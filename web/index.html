<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>حکم گرین‌دریم</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: Tahoma, Arial, sans-serif;
            background: #063d25;
            color: white;
        }

        body {
            background:
                radial-gradient(circle at center, #16834c 0%, #07532f 48%, #032c1b 100%);
        }

        button {
            font-family: inherit;
        }

        .app {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        .topbar {
            height: 58px;
            min-height: 58px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 12px;
            background: rgba(0, 0, 0, .22);
            border-bottom: 1px solid rgba(255, 215, 100, .25);
        }

        .title {
            font-size: 18px;
            font-weight: bold;
            color: #f7d36b;
        }

        .status {
            font-size: 12px;
            color: #d7f5e4;
        }

        .table {
            position: relative;
            flex: 1;
            min-height: 0;
            margin: 8px;
            border: 3px solid #caa348;
            border-radius: 28px;
            background:
                radial-gradient(circle at center, #15904f 0%, #0b6738 58%, #07502d 100%);
            box-shadow:
                inset 0 0 40px rgba(0, 0, 0, .28),
                0 0 20px rgba(0, 0, 0, .35);
            overflow: hidden;
        }

        .seat {
            position: absolute;
            width: 115px;
            min-height: 48px;
            padding: 7px;
            border-radius: 14px;
            background: rgba(0, 0, 0, .27);
            border: 1px solid rgba(255, 215, 100, .22);
            text-align: center;
            transition: .2s;
        }

        .seat.turn {
            border-color: #f7d36b;
            box-shadow: 0 0 16px rgba(247, 211, 107, .55);
        }

        .seat.me {
            background: rgba(0, 0, 0, .38);
        }

        .seat-name {
            font-size: 13px;
            font-weight: bold;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .seat-info {
            margin-top: 3px;
            font-size: 10px;
            color: #d9f4e5;
        }

        .seat.top {
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
        }

        .seat.right {
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
        }

        .seat.bottom {
            bottom: 8px;
            left: 50%;
            transform: translateX(-50%);
        }

        .seat.left {
            left: 8px;
            top: 50%;
            transform: translateY(-50%);
        }

        .center {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 220px;
            height: 190px;
            transform: translate(-50%, -50%);
        }

        .hokm {
            position: absolute;
            top: -5px;
            left: 50%;
            transform: translateX(-50%);
            padding: 6px 14px;
            border-radius: 20px;
            background: #1c1710;
            border: 1px solid #d7b354;
            color: #f7d36b;
            font-size: 13px;
            font-weight: bold;
            z-index: 4;
        }

        .trick {
            position: absolute;
            inset: 25px 0 0 0;
        }

        .played-card {
            position: absolute;
            width: 60px;
            height: 82px;
            background: white;
            color: #111;
            border-radius: 8px;
            border: 1px solid #ddd;
            box-shadow: 0 4px 10px rgba(0, 0, 0, .4);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 18px;
        }

        .played-card .player {
            position: absolute;
            bottom: 2px;
            font-size: 8px;
            color: #555;
            max-width: 52px;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        .played-card.north {
            top: 0;
            left: 50%;
            transform: translateX(-50%);
        }

        .played-card.east {
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
        }

        .played-card.south {
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
        }

        .played-card.west {
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
        }

        .info-bar {
            position: absolute;
            bottom: 72px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 7px;
            padding: 6px 9px;
            border-radius: 18px;
            background: rgba(0, 0, 0, .32);
            white-space: nowrap;
            font-size: 10px;
        }

        .hand-area {
            position: relative;
            height: 132px;
            min-height: 132px;
            padding: 10px 8px 4px;
            background: rgba(0, 0, 0, .22);
            border-top: 1px solid rgba(255, 215, 100, .2);
        }

        .hand-title {
            position: absolute;
            top: 4px;
            right: 10px;
            font-size: 10px;
            color: #d9f4e5;
        }

        .hand {
            height: 100%;
            position: relative;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding-top: 13px;
        }

        .card {
            width: 48px;
            height: 76px;
            margin-left: -13px;
            border-radius: 7px;
            background: #fff;
            color: #111;
            border: 1px solid #ddd;
            box-shadow: 0 3px 8px rgba(0, 0, 0, .45);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 17px;
            cursor: pointer;
            transition: .12s;
        }

        .card:first-child {
            margin-left: 0;
        }

        .card:hover,
        .card:active {
            transform: translateY(-12px);
        }

        .card.disabled {
            opacity: .42;
            cursor: not-allowed;
        }

        .red {
            color: #d51e2f;
        }

        .black {
            color: #111;
        }

        .bottom-controls {
            position: absolute;
            left: 8px;
            bottom: 4px;
            display: flex;
            gap: 5px;
        }

        .btn {
            border: 0;
            border-radius: 12px;
            padding: 8px 12px;
            background: #caa348;
            color: #241b08;
            font-weight: bold;
            font-size: 11px;
            cursor: pointer;
        }

        .btn.secondary {
            background: rgba(255,255,255,.15);
            color: white;
            border: 1px solid rgba(255,255,255,.15);
        }

        .empty {
            color: #d9f4e5;
            font-size: 13px;
            text-align: center;
            width: 100%;
            padding-top: 35px;
        }

        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.62);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 50;
            padding: 20px;
        }

        .overlay.show {
            display: flex;
        }

        .modal {
            width: min(340px, 100%);
            background: #0a4e2d;
            border: 2px solid #caa348;
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 15px 50px rgba(0,0,0,.55);
        }

        .modal h3 {
            margin: 0 0 16px;
            color: #f7d36b;
        }

        .suits {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .suit-btn {
            height: 55px;
            border: 1px solid rgba(255,255,255,.2);
            border-radius: 14px;
            background: rgba(255,255,255,.08);
            color: white;
            font-size: 24px;
            cursor: pointer;
        }

        .message {
            position: fixed;
            left: 50%;
            bottom: 145px;
            transform: translateX(-50%);
            background: #171717;
            color: white;
            padding: 10px 15px;
            border-radius: 12px;
            font-size: 12px;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: .2s;
        }

        .message.show {
            opacity: 1;
        }

        @media (max-width: 380px) {
            .seat {
                width: 95px;
            }

            .center {
                width: 190px;
            }

            .card {
                width: 43px;
                height: 70px;
                margin-left: -15px;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <div class="topbar">
        <div class="title">♠ حکم گرین‌دریم</div>
        <div class="status" id="status">در حال اتصال...</div>
    </div>

    <div class="table">

        <div class="seat top" id="seat-top"></div>
        <div class="seat right" id="seat-right"></div>
        <div class="seat bottom" id="seat-bottom"></div>
        <div class="seat left" id="seat-left"></div>

        <div class="center">

            <div class="hokm" id="hokm">
                حکم: —
            </div>

            <div class="trick" id="trick"></div>

        </div>

        <div class="info-bar">
            <span id="turn-info">نوبت: —</span>
            <span> | </span>
            <span id="score-info">امتیاز: ۰ - ۰</span>
            <span> | </span>
            <span id="cards-info">کارت: ۰</span>
        </div>

        <div class="bottom-controls">
            <button class="btn" id="startBtn" onclick="startGame()">
                شروع بازی
            </button>

            <button class="btn secondary" onclick="loadGame()">
                ↻
            </button>
        </div>

    </div>

    <div class="hand-area">

        <div class="hand-title">
            کارت‌های من
        </div>

        <div class="hand" id="hand">
            <div class="empty">
                منتظر شروع بازی...
            </div>
        </div>

    </div>

</div>


<div class="overlay" id="hokmModal">

    <div class="modal">

        <h3>حکم را انتخاب کنید</h3>

        <div class="suits">

            <button class="suit-btn red" onclick="chooseHokm('♥')">
                ♥
            </button>

            <button class="suit-btn red" onclick="chooseHokm('♦')">
                ♦
            </button>

            <button class="suit-btn black" onclick="chooseHokm('♣')">
                ♣
            </button>

            <button class="suit-btn black" onclick="chooseHokm('♠')">
                ♠
            </button>

        </div>

    </div>

</div>


<div class="message" id="message"></div>


<script>

const tg = window.Telegram && window.Telegram.WebApp
    ? window.Telegram.WebApp
    : null;

if (tg) {
    tg.ready();
    tg.expand();
}


const params = new URLSearchParams(window.location.search);

let gameId = params.get("game");

if (!gameId && tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param) {
    const startParam = tg.initDataUnsafe.start_param;

    if (startParam.startsWith("play_")) {
        gameId = startParam.substring(5);
    }

    if (startParam.startsWith("join_")) {
        gameId = startParam.substring(5);
    }
}


let game = null;
let loading = false;


function headers() {

    const result = {
        "Content-Type": "application/json"
    };

    if (tg && tg.initData) {
        result["X-Telegram-Init-Data"] = tg.initData;
    }

    return result;
}


function showMessage(text) {

    const el = document.getElementById("message");

    el.textContent = text;
    el.classList.add("show");

    setTimeout(() => {
        el.classList.remove("show");
    }, 2200);
}


function suitClass(suit) {

    if (suit === "♥" || suit === "♦") {
        return "red";
    }

    return "black";
}


function cardText(card) {

    return `${card.label}${card.suit}`;
}


function getMe() {

    if (!game || !game.players) {
        return null;
    }

    return game.players.find(
        player => player.id === game.viewer_id
    ) || null;
}


function getPlayerPosition(playerId) {

    if (!game || !game.players) {
        return "bottom";
    }

    const meIndex = game.players.findIndex(
        player => player.id === game.viewer_id
    );

    const index = game.players.findIndex(
        player => player.id === playerId
    );

    if (index === -1) {
        return "bottom";
    }

    const relative =
        (index - meIndex + game.players.length)
        % game.players.length;

    if (relative === 0) return "bottom";
    if (relative === 1) return "left";
    if (relative === 2) return "top";
    return "right";
}


function renderPlayer(player) {

    const position = getPlayerPosition(player.id);

    const seat = document.getElementById(
        `seat-${position}`
    );

    if (!seat) return;

    seat.className = "seat " + position;

    if (player.id === game.viewer_id) {
        seat.classList.add("me");
    }

    if (player.is_turn) {
        seat.classList.add("turn");
    }

    const hakim = player.is_hakim
        ? " 👑"
        : "";

    const turn = player.is_turn
        ? " • نوبت"
        : "";

    seat.innerHTML = `
        <div class="seat-name">
            ${escapeHtml(player.name)}${hakim}
        </div>

        <div class="seat-info">
            ${player.card_count} کارت
            • ${player.tricks} دست${turn}
        </div>
    `;
}


function renderSeats() {

    ["top", "right", "bottom", "left"]
        .forEach(position => {

            const seat = document.getElementById(
                `seat-${position}`
            );

            seat.className = "seat " + position;
            seat.innerHTML = "";

        });

    if (!game || !game.players) {
        return;
    }

    game.players.forEach(renderPlayer);
}


function renderHokm() {

    const el = document.getElementById("hokm");

    if (!game.hokm) {
        el.textContent = "حکم: —";
        return;
    }

    el.textContent = `حکم: ${game.hokm}`;
}


function renderInfo() {

    const turnEl =
        document.getElementById("turn-info");

    const scoreEl =
        document.getElementById("score-info");

    const cardsEl =
        document.getElementById("cards-info");

    let turnName = "—";

    if (game.current_player_id) {

        const player = game.players.find(
            p => p.id === game.current_player_id
        );

        if (player) {
            turnName = player.name;
        }
    }

    turnEl.textContent =
        `نوبت: ${turnName}`;

    scoreEl.textContent =
        `امتیاز: ${game.team_a_score || 0} - ${game.team_b_score || 0}`;

    const me = getMe();

    cardsEl.textContent =
        `کارت: ${me ? me.card_count : 0}`;
}


function renderTrick() {

    const container =
        document.getElementById("trick");

    container.innerHTML = "";

    if (!game || !game.current_trick) {
        return;
    }

    game.current_trick.forEach(item => {

        const card = item.card;

        const position =
            getPlayerPosition(item.player_id);

        const div =
            document.createElement("div");

        div.className =
            `played-card ${position} ${suitClass(card.suit)}`;

        div.innerHTML = `
            <div>${card.label}</div>
            <div>${card.suit}</div>
            <div class="player">
                ${escapeHtml(item.player_name)}
            </div>
        `;

        container.appendChild(div);

    });
}


function isLegalCard(card, me) {

    if (!me) {
        return false;
    }

    if (game.current_player_id !== game.viewer_id) {
        return false;
    }

    if (!game.current_trick || game.current_trick.length === 0) {
        return true;
    }

    if (!game.lead_suit) {
        return true;
    }

    const hasLeadSuit =
        me.cards.some(
            c => c.suit === game.lead_suit
        );

    if (!hasLeadSuit) {
        return true;
    }

    return card.suit === game.lead_suit;
}


function renderHand() {

    const container =
        document.getElementById("hand");

    container.innerHTML = "";

    const me = getMe();

    if (!me) {

        container.innerHTML = `
            <div class="empty">
                بازیکن پیدا نشد.
            </div>
        `;

        return;
    }

    if (!game.started) {

        container.innerHTML = `
            <div class="empty">
                منتظر شروع بازی...
            </div>
        `;

        return;
    }

    if (!me.cards || me.cards.length === 0) {

        container.innerHTML = `
            <div class="empty">
                کارت دیگری باقی نمانده است.
            </div>
        `;

        return;
    }

    const cards = [...me.cards];

    cards.sort((a, b) => {

        const suitOrder = {
            "♥": 1,
            "♦": 2,
            "♣": 3,
            "♠": 4
        };

        if (a.suit !== b.suit) {
            return suitOrder[a.suit]
                - suitOrder[b.suit];
        }

        return a.rank - b.rank;

    });

    cards.forEach(card => {

        const button =
            document.createElement("button");

        const legal =
            isLegalCard(card, me);

        button.className =
            `card ${suitClass(card.suit)}`;

        if (!legal) {
            button.classList.add("disabled");
        }

        button.innerHTML = `
            <div>${card.label}</div>
            <div>${card.suit}</div>
        `;

        button.onclick = () => {

            if (!legal) {
                showMessage(
                    "این کارت در این نوبت مجاز نیست."
                );
                return;
            }

            playCard(card);

        };

        container.appendChild(button);

    });
}


function renderStartButton() {

    const button =
        document.getElementById("startBtn");

    const me = getMe();

    if (!me || !game) {
        button.style.display = "none";
        return;
    }

    if (game.started) {
        button.style.display = "none";
        return;
    }

    if (game.creator_id === game.viewer_id) {
        button.style.display = "block";
        button.textContent =
            `شروع بازی (${game.player_count}/${game.max_players})`;
    } else {
        button.style.display = "none";
    }
}


function render() {

    if (!game) {
        return;
    }

    renderSeats();
    renderHokm();
    renderInfo();
    renderTrick();
    renderHand();
    renderStartButton();

    const status =
        document.getElementById("status");

    if (game.finished) {
        status.textContent = "بازی تمام شد";
    } else if (game.started) {
        status.textContent = "بازی در حال اجرا";
    } else {
        status.textContent =
            `${game.player_count}/${game.max_players} بازیکن`;
    }

    if (
        game.started &&
        !game.hokm &&
        game.hakim_id === game.viewer_id
    ) {
        document
            .getElementById("hokmModal")
            .classList.add("show");
    } else {
        document
            .getElementById("hokmModal")
            .classList.remove("show");
    }
}


async function loadGame() {

    if (!gameId) {

        document.getElementById("status")
            .textContent = "شناسه بازی وجود ندارد.";

        return;
    }

    if (loading) {
        return;
    }

    loading = true;

    try {

        const response =
            await fetch(
                `/api/game/${encodeURIComponent(gameId)}`,
                {
                    method: "GET",
                    headers: headers()
                }
            );

        const data =
            await response.json();

        if (!response.ok) {
            throw new Error(
                data.error || "خطا در دریافت بازی"
            );
        }

        game = data;

        render();

    } catch (error) {

        console.error(error);

        document.getElementById("status")
            .textContent = "خطا در اتصال";

        showMessage(error.message);

    } finally {

        loading = false;
    }
}


async function startGame() {

    try {

        const response =
            await fetch(
                `/api/game/${encodeURIComponent(gameId)}/start`,
                {
                    method: "POST",
                    headers: headers(),
                    body: JSON.stringify({})
                }
            );

        const data =
            await response.json();

        if (!response.ok) {
            throw new Error(
                data.error || "امکان شروع بازی نیست."
            );
        }

        showMessage("بازی شروع شد.");

        await loadGame();

    } catch (error) {

        showMessage(error.message);

    }
}


async function chooseHokm(suit) {

    try {

        const response =
            await fetch(
                `/api/game/${encodeURIComponent(gameId)}/hokm`,
                {
                    method: "POST",
                    headers: headers(),
                    body: JSON.stringify({
                        suit: suit
                    })
                }
            );

        const data =
            await response.json();

        if (!response.ok) {
            throw new Error(
                data.error || "خطا در انتخاب حکم."
            );
        }

        document
            .getElementById("hokmModal")
            .classList.remove("show");

        showMessage(
            `حکم ${suit} انتخاب شد.`
        );

        await loadGame();

    } catch (error) {

        showMessage(error.message);

    }
}


async function playCard(card) {

    try {

        const response =
            await fetch(
                `/api/game/${encodeURIComponent(gameId)}/play`,
                {
                    method: "POST",
                    headers: headers(),
                    body: JSON.stringify({
                        suit: card.suit,
                        rank: card.rank
                    })
                }
            );

        const data =
            await response.json();

        if (!response.ok) {
            throw new Error(
                data.error || "کارت قابل بازی نیست."
            );
        }

        await loadGame();

    } catch (error) {

        showMessage(error.message);

    }
}


function escapeHtml(text) {

    return String(text)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}


loadGame();

setInterval(
    loadGame,
    2500
);

</script>

</body>
</html>
