<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>حکم گرین‌دریم</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            font-family: Tahoma, Arial, sans-serif;
            background: #061d13;
            color: white;
        }

        body {
            min-height: 100vh;
            overflow-x: hidden;
        }

        button {
            font-family: inherit;
        }

        .app {
            min-height: 100vh;
            background:
                radial-gradient(
                    circle at 50% 40%,
                    #16703d 0%,
                    #0b542d 45%,
                    #031e12 100%
                );
        }

        .topbar {
            height: 62px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 12px;
            background: rgba(0, 0, 0, .30);
            border-bottom: 1px solid rgba(255, 215, 100, .35);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 9px;
        }

        .logo {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #c89b3c;
            color: #17351f;
            font-size: 22px;
            box-shadow: 0 3px 10px rgba(0,0,0,.4);
        }

        .title {
            font-size: 15px;
            font-weight: bold;
        }

        .subtitle {
            margin-top: 3px;
            font-size: 10px;
            opacity: .7;
        }

        .status {
            font-size: 11px;
        }

        .status-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            margin-left: 4px;
            border-radius: 50%;
            background: #50e878;
        }

        .table-area {
            width: 100%;
            min-height: calc(100vh - 62px);
            padding: 10px 8px 175px;
        }

        .table {
            position: relative;
            width: 100%;
            max-width: 520px;
            height: 560px;
            margin: 8px auto 0;
            border: 5px solid #bd8b2f;
            border-radius: 42px;
            background:
                radial-gradient(
                    ellipse at center,
                    #197744 0%,
                    #0d5c32 52%,
                    #063b21 100%
                );
            box-shadow:
                inset 0 0 0 3px rgba(255,255,255,.07),
                inset 0 0 35px rgba(0,0,0,.45),
                0 12px 35px rgba(0,0,0,.45);
        }

        .seat {
            position: absolute;
            min-width: 100px;
            padding: 7px 9px;
            border-radius: 14px;
            background: rgba(0,0,0,.30);
            border: 1px solid rgba(255,215,100,.35);
            text-align: center;
            font-size: 11px;
            z-index: 5;
        }

        .seat.active {
            border-color: #ffe18a;
            box-shadow: 0 0 15px rgba(255,220,100,.55);
        }

        .avatar {
            width: 31px;
            height: 31px;
            margin: 0 auto 3px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #d3a640;
            color: #17351f;
            font-weight: bold;
        }

        .hakim {
            display: none;
            margin-top: 3px;
            color: #ffe18a;
            font-size: 9px;
        }

        .hakim-seat .hakim {
            display: block;
        }

        .seat.top {
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
        }

        .seat.left {
            top: 48%;
            left: 8px;
            transform: translateY(-50%);
        }

        .seat.right {
            top: 48%;
            right: 8px;
            transform: translateY(-50%);
        }

        .seat.bottom {
            bottom: 18px;
            left: 50%;
            transform: translateX(-50%);
        }

        .hokm-badge {
            position: absolute;
            top: 92px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            padding: 6px 13px;
            border-radius: 20px;
            background: rgba(0,0,0,.38);
            border: 1px solid rgba(255,215,100,.4);
            font-size: 12px;
        }

        .center {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 220px;
            height: 190px;
            transform: translate(-50%, -50%);
        }

        .trick {
            position: relative;
            width: 100%;
            height: 100%;
        }

        .empty-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 150px;
            text-align: center;
            font-size: 12px;
            opacity: .55;
        }

        .played-card {
            position: absolute;
            width: 65px;
            height: 92px;
            border-radius: 8px;
            background: white;
            color: #111;
            border: 1px solid #aaa;
            box-shadow: 0 4px 10px rgba(0,0,0,.35);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .played-card.red {
            color: #c62020;
        }

        .played-card:nth-child(1) {
            left: 78px;
            top: 0;
        }

        .played-card:nth-child(2) {
            left: 0;
            top: 48px;
        }

        .played-card:nth-child(3) {
            right: 0;
            top: 48px;
        }

        .played-card:nth-child(4) {
            left: 78px;
            bottom: 0;
        }

        .info-bar {
            position: absolute;
            top: 365px;
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            display: flex;
            justify-content: space-around;
            font-size: 10px;
            opacity: .9;
        }

        .bottom-panel {
            position: fixed;
            z-index: 30;
            left: 0;
            right: 0;
            bottom: 0;
            padding: 8px 7px 12px;
            background: rgba(3,20,12,.95);
            border-top: 1px solid rgba(255,215,100,.35);
            backdrop-filter: blur(8px);
        }

        .hand {
            max-width: 520px;
            min-height: 112px;
            margin: 0 auto;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            direction: ltr;
        }

        .card {
            position: relative;
            width: 54px;
            height: 82px;
            margin-left: -15px;
            border-radius: 8px;
            border: 1px solid #aaa;
            background: linear-gradient(
                145deg,
                #ffffff,
                #eeeeee
            );
            color: #111;
            box-shadow: 0 3px 8px rgba(0,0,0,.4);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            transition: transform .12s;
        }

        .card:first-child {
            margin-left: 0;
        }

        .card.red {
            color: #c51e25;
        }

        .card:active {
            transform: translateY(-12px);
        }

        .card.disabled {
            opacity: .42;
        }

        .rank {
            font-size: 17px;
        }

        .suit {
            font-size: 21px;
        }

        .actions {
            max-width: 520px;
            margin: 7px auto 0;
            display: flex;
            gap: 7px;
        }

        .action {
            flex: 1;
            padding: 10px 6px;
            border: 0;
            border-radius: 10px;
            background: #c99c3c;
            color: #142518;
            font-weight: bold;
        }

        .action.secondary {
            background: rgba(255,255,255,.12);
            color: white;
            border: 1px solid rgba(255,255,255,.15);
        }

        .action:disabled {
            opacity: .5;
        }

        .modal {
            position: fixed;
            z-index: 100;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: rgba(0,0,0,.72);
        }

        .modal.show {
            display: flex;
        }

        .modal-box {
            width: min(360px, 100%);
            padding: 20px;
            border-radius: 20px;
            background: #103e27;
            border: 2px solid #c99c3c;
            text-align: center;
            box-shadow: 0 15px 45px rgba(0,0,0,.5);
        }

        .modal-box h2 {
            margin-top: 0;
        }

        .suits {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 9px;
            margin-top: 15px;
        }

        .suit-btn {
            padding: 14px;
            border: 1px solid rgba(255,255,255,.2);
            border-radius: 12px;
            background: rgba(255,255,255,.08);
            color: white;
            font-size: 22px;
        }

        .message {
            position: fixed;
            z-index: 200;
            top: 72px;
            left: 50%;
            transform: translateX(-50%);
            width: min(92%, 430px);
            padding: 11px 14px;
            border-radius: 12px;
            background: rgba(0,0,0,.82);
            text-align: center;
            font-size: 12px;
            display: none;
        }

        .message.show {
            display: block;
        }

        @media (max-height: 650px) {

            .table {
                height: 490px;
            }

            .info-bar {
                top: 330px;
            }

            .hand {
                min-height: 95px;
            }

            .card {
                height: 72px;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <header class="topbar">

        <div class="brand">

            <div class="logo">
                ♥
            </div>

            <div>

                <div class="title">
                    حکم گرین‌دریم
                </div>

                <div class="subtitle">
                    میز بازی آنلاین
                </div>

            </div>

        </div>

        <div class="status">
            <span class="status-dot"></span>
            آنلاین
        </div>

    </header>


    <main class="table-area">

        <section class="table">

            <div
                class="seat top"
                id="seat-top"
            >
                <div class="avatar">?</div>
                <div class="name">
                    منتظر بازیکن
                </div>
                <div class="hakim">
                    👑 حاکم
                </div>
            </div>


            <div
                class="seat left"
                id="seat-left"
            >
                <div class="avatar">?</div>
                <div class="name">
                    منتظر بازیکن
                </div>
                <div class="hakim">
                    👑 حاکم
                </div>
            </div>


            <div
                class="seat right"
                id="seat-right"
            >
                <div class="avatar">?</div>
                <div class="name">
                    منتظر بازیکن
                </div>
                <div class="hakim">
                    👑 حاکم
                </div>
            </div>


            <div
                class="seat bottom"
                id="seat-bottom"
            >
                <div class="avatar">🙂</div>
                <div class="name">
                    شما
                </div>
                <div class="hakim">
                    👑 حاکم
                </div>
            </div>


            <div
                class="hokm-badge"
                id="hokm"
            >
                حکم: —
            </div>


            <div class="center">

                <div
                    class="trick"
                    id="trick"
                >
                    <div class="empty-center">
                        هنوز کارتی بازی نشده
                    </div>
                </div>

            </div>


            <div class="info-bar">

                <span>
                    🎯 دست:
                    <b id="tricks">0</b>
                </span>

                <span>
                    🃏 کارت:
                    <b id="remaining">0</b>
                </span>

            </div>

        </section>

    </main>


    <div class="bottom-panel">

        <div
            class="hand"
            id="hand"
        ></div>


        <div class="actions">

            <button
                class="action"
                id="startButton"
                onclick="startGame()"
            >
                ▶️ شروع بازی
            </button>

            <button
                class="action secondary"
                onclick="refreshGame()"
            >
                🔄 بروزرسانی
            </button>

        </div>

    </div>

</div>


<div
    class="modal"
    id="hokmModal"
>

    <div class="modal-box">

        <h2>
            👑 انتخاب حکم
        </h2>

        <p>
            یک خال را برای حکم انتخاب کنید.
        </p>

        <div class="suits">

            <button
                class="suit-btn"
                onclick="chooseHokm('♥')"
            >
                ♥
            </button>

            <button
                class="suit-btn"
                onclick="chooseHokm('♦')"
            >
                ♦
            </button>

            <button
                class="suit-btn"
                onclick="chooseHokm('♣')"
            >
                ♣
            </button>

            <button
                class="suit-btn"
                onclick="chooseHokm('♠')"
            >
                ♠
            </button>

        </div>

    </div>

</div>


<div
    class="message"
    id="message"
></div>


<script>

const tg =
    window.Telegram &&
    window.Telegram.WebApp
        ? window.Telegram.WebApp
        : null;


if (tg) {
    tg.ready();
    tg.expand();
}


const params =
    new URLSearchParams(
        window.location.search
    );


let gameId =
    params.get("game");


if (!gameId && tg) {

    gameId =
        tg.initDataUnsafe &&
        tg.initDataUnsafe.start_param
            ? tg.initDataUnsafe.start_param
            : null;
}


let game = null;


function headers() {

    const result = {
        "Content-Type":
            "application/json"
    };

    if (tg && tg.initData) {

        result[
            "X-Telegram-Init-Data"
        ] = tg.initData;
    }

    return result;
}


function showMessage(text) {

    const element =
        document.getElementById(
            "message"
        );

    element.textContent = text;

    element.classList.add(
        "show"
    );

    setTimeout(
        () => {
            element.classList.remove(
                "show"
            );
        },
        2500
    );
}


function escapeHtml(value) {

    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}


function isRedSuit(suit) {

    return (
        suit === "♥" ||
        suit === "♦"
    );
}


function cardText(card) {

    return `
        <span class="rank">
            ${escapeHtml(card.rank)}
        </span>
        <span class="suit">
            ${escapeHtml(card.suit)}
        </span>
    `;
}


async function loadGame() {

    if (!gameId) {

        showMessage(
            "کد بازی پیدا نشد."
        );

        return;
    }

    try {

        const response =
            await fetch(
                `/api/game/${encodeURIComponent(gameId)}`
            );

        const data =
            await response.json();

        if (!data.ok) {

            showMessage(
                data.error ||
                "خطا در دریافت بازی."
            );

            return;
        }

        game = data.game;

        renderGame();

    } catch (error) {

        showMessage(
            "ارتباط با سرور برقرار نشد."
        );
    }
}


function renderGame() {

    if (!game) {
        return;
    }

    renderPlayers();
    renderTrick();
    renderHand();

    document.getElementById(
        "hokm"
    ).textContent =
        `حکم: ${game.hokm || "—"}`;

    const me =
        getMyPlayer();

    if (me) {

        document.getElementById(
            "tricks"
        ).textContent =
            me.tricks || 0;

        document.getElementById(
            "remaining"
        ).textContent =
            me.card_count || 0;
    }

    const startButton =
        document.getElementById(
            "startButton"
        );

    if (game.started) {

        startButton.textContent =
            "🎴 بازی در حال اجرا";

        startButton.disabled =
            true;

    } else {

        startButton.textContent =
            "▶️ شروع بازی";

        startButton.disabled =
            false;
    }

    const me2 =
        getMyPlayer();

    if (
        game.started &&
        game.hakim_id &&
        !game.hokm &&
        me2 &&
        game.hakim_id === me2.id
    ) {

        openHokm();
    }
}


function getMyPlayer() {

    if (!game || !game.players) {
        return null;
    }

    return game.players.find(
        player =>
            player.cards !== undefined
    ) || null;
}


function renderPlayers() {

    const positions = [
        "seat-top",
        "seat-left",
        "seat-right",
        "seat-bottom"
    ];

    const players =
        game.players || [];

    positions.forEach(
        (id, index) => {

            const element =
                document.getElementById(id);

            if (!element) {
                return;
            }

            let player = null;

            if (index < players.length) {
                player = players[index];
            }

            const avatar =
                element.querySelector(
                    ".avatar"
                );

            const name =
                element.querySelector(
                    ".name"
                );

            if (!player) {

                avatar.textContent =
                    "?";

                name.textContent =
                    "منتظر بازیکن";

                element.classList.remove(
                    "active"
                );

                element.classList.remove(
                    "hakim-seat"
                );

                return;
            }

            avatar.textContent =
                player.name
                    ? player.name
                        .trim()
                        .charAt(0)
                    : "?";

            name.textContent =
                player.name;

            element.classList.toggle(
                "active",
                game.current_player_id ===
                player.id
            );

            element.classList.toggle(
                "hakim-seat",
                game.hakim_id ===
                player.id
            );
        }
    );
}


function renderTrick() {

    const container =
        document.getElementById(
            "trick"
        );

    container.innerHTML = "";

    const trick =
        game.current_trick || [];

    if (!trick.length) {

        container.innerHTML =
            `
            <div class="empty-center">
                هنوز کارتی بازی نشده
            </div>
            `;

        return;
    }

    trick.forEach(
        item => {

            const card =
                document.createElement(
                    "div"
                );

            if (
                isRedSuit(
                    item.card.suit
                )
            ) {

                card.className =
                    "played-card red";

            } else {

                card.className =
                    "played-card";
            }

            card.innerHTML =
                cardText(
                    item.card
                );

            container.appendChild(
                card
            );
        }
    );
}


function renderHand() {

    const container =
        document.getElementById(
            "hand"
        );

    container.innerHTML = "";

    const me =
        getMyPlayer();

    if (!me) {
        return;
    }

    const cards =
        me.cards || [];

    const myTurn =
        game.current_player_id ===
        me.id;

    cards.forEach(
        cardData => {

            const button =
                document.createElement(
                    "button"
                );

            button.className =
                "card";

            if (
                isRedSuit(
                    cardData.suit
                )
            ) {

                button.classList.add(
                    "red"
                );
            }

            const legal =
                isLegalCard(
                    cardData,
                    me
                );

            if (
                !legal ||
                !myTurn
            ) {

                button.classList.add(
                    "disabled"
                );
            }

            button.innerHTML =
                cardText(
                    cardData
                );

            button.onclick =
                () => {

                    if (!myTurn) {

                        showMessage(
                            "الان نوبت شما نیست."
                        );

                        return;
                    }

                    if (!legal) {

                        showMessage(
                            "این کارت مجاز نیست."
                        );

                        return;
                    }

                    playCard(
                        cardData
                    );
                };

            container.appendChild(
                button
            );
        }
    );
}


function isLegalCard(
    card,
    me
) {

    const trick =
        game.current_trick || [];

    if (!trick.length) {
        return true;
    }

    const lead =
        trick[0].card.suit;

    const hasLead =
        (me.cards || []).some(
            c =>
                c.suit === lead
        );

    if (!hasLead) {
        return true;
    }

    return card.suit === lead;
}


async function startGame() {

    if (!gameId) {
        return;
    }

    try {

        const response =
            await fetch(
                `/api/game/${encodeURIComponent(gameId)}/start`,
                {
                    method: "POST",
                    headers: headers(),
                    body: "{}"
                }
            );

        const data =
            await response.json();

        if (!data.ok) {

            showMessage(
                data.error ||
                "امکان شروع بازی نیست."
            );

            return;
        }

        game =
            data.game;

        renderGame();

    } catch (error) {

        showMessage(
            "خطا در شروع بازی."
        );
    }
}


function openHokm() {

    document
        .getElementById(
            "hokmModal"
        )
        .classList.add(
            "show"
        );
}


function closeHokm() {

    document
        .getElementById(
            "hokmModal"
        )
        .classList.remove(
            "show"
        );
}


async function chooseHokm(
    suit
) {

    try {

        const response =
            await fetch(
                `/api/game/${encodeURIComponent(gameId)}/hokm`,
                {
                    method: "POST",
                    headers: headers(),
                    body: JSON.stringify({
                        suit: suit
                    })
                }
            );

        const data =
            await response.json();

        if (!data.ok) {

            showMessage(
                data.error ||
                "خطا در تعیین حکم."
            );

            return;
        }

        game =
            data.game;

        closeHokm();

        renderGame();

    } catch (error) {

        showMessage(
            "خطا در ارتباط با سرور."
        );
    }
}


async function playCard(
    card
) {

    try {

        const response =
            await fetch(
                `/api/game/${encodeURIComponent(gameId)}/play`,
                {
                    method: "POST",
                    headers: headers(),
                    body: JSON.stringify({
                        suit: card.suit,
                        rank: card.rank
                    })
                }
            );

        const data =
            await response.json();

        if (!data.ok) {

            showMessage(
                data.error ||
                "امکان بازی کردن کارت نیست."
            );

            return;
        }

        game =
            data.game;

        renderGame();

    } catch (error) {

        showMessage(
            "ارتباط با سرور قطع شد."
        );
    }
}


async function refreshGame() {

    await loadGame();

    showMessage(
        "بازی بروزرسانی شد."
    );
}


loadGame();


setInterval(
    loadGame,
    2500
);

</script>
