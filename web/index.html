<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

<title>حکم گرین‌دریم</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>

/* =========================================================
   RESET
========================================================= */

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html{
    width:100%;
    height:100%;
    margin:0;
    padding:0;
    overflow:hidden;
}

body{
    width:100%;
    height:100%;
    min-height:100%;
    margin:0;
    padding:0;
    overflow:hidden !important;

    background:#08100d;
    color:#fff;

    font-family:Tahoma,Arial,sans-serif;

    overscroll-behavior:none;
    position:fixed;
    inset:0;
}

button{
    font-family:inherit;
}


/* =========================================================
   VARIABLES
========================================================= */

:root{
    --gold:#d5a63e;
    --gold2:#f1cb6c;
    --gold-dark:#8d6425;

    --green:#075b3b;
    --green2:#08764b;

    --panel:#101915;
    --panel2:#16221d;

    --muted:#a9b4ae;

    --red:#e33b3b;
}


/* =========================================================
   MAIN PAGE
========================================================= */

.page{
    width:100%;
    max-width:620px;

    height:100dvh;
    max-height:100dvh;

    min-height:0;

    margin:0 auto;

    padding:
        env(safe-area-inset-top)
        7px
        env(safe-area-inset-bottom)
        7px;

    background:
        radial-gradient(
            circle at 50% 28%,
            rgba(16,108,70,.22),
            transparent 42%
        ),
        linear-gradient(
            #0c1411,
            #07100d 75%
        );

    overflow:hidden;
}


/* =========================================================
   GAME HEADER
========================================================= */

.game-head{
    height:76px;

    padding:5px 4px 3px;

    display:grid;

    grid-template-columns:50px 1fr 50px;

    align-items:center;

    gap:4px;

    flex-shrink:0;
}

.head-side{
    display:flex;
    justify-content:center;
}

.icon-btn{
    width:38px;
    height:38px;

    border-radius:50%;

    border:1px solid rgba(226,191,103,.5);

    background:
        linear-gradient(
            145deg,
            #1c2822,
            #0d1512
        );

    color:#d9c07d;

    box-shadow:
        0 4px 12px rgba(0,0,0,.28),
        inset 0 1px rgba(255,255,255,.08);

    font-size:18px;

    cursor:pointer;
}

.game-title{
    text-align:center;
    line-height:1.05;
}

.game-title strong{
    display:block;

    font-size:21px;
    font-weight:900;

    letter-spacing:-.5px;
}

.game-title span{
    display:block;

    margin-top:3px;

    color:#c5cbc8;

    font-size:10px;
}

.round-pill{
    display:inline-flex;

    margin-top:4px;

    padding:3px 10px;

    border-radius:14px;

    background:#111a16;

    border:1px solid rgba(255,255,255,.08);

    color:#d8dedb;

    font-size:9px;
}


/* =========================================================
   SCORE
========================================================= */

.score-row{
    display:grid;

    grid-template-columns:1fr auto 1fr;

    align-items:center;

    gap:6px;

    margin:0 6px 6px;

    flex-shrink:0;
}

.score-box{
    min-height:37px;

    padding:5px 9px;

    border-radius:14px;

    background:
        linear-gradient(
            145deg,
            #19231f,
            #101713
        );

    border:1px solid rgba(255,255,255,.07);

    box-shadow:0 5px 14px rgba(0,0,0,.2);

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:7px;

    font-size:10px;
}

.score-box .score{
    color:var(--gold2);

    font-size:15px;

    font-weight:900;
}

.score-center{
    width:46px;
    height:27px;

    border-radius:15px;

    display:flex;

    align-items:center;

    justify-content:center;

    background:#1d2822;

    color:#d5ddd9;

    border:1px solid rgba(255,255,255,.07);

    font-size:9px;
}


/* =========================================================
   TABLE
========================================================= */

.table{
    position:relative;

    width:100%;

    /*
       ارتفاع میز خودش با صفحه هماهنگ می‌شود
    */
    height:calc(100dvh - 270px);

    min-height:480px;

    max-height:660px;

    border-radius:38px;

    border:5px solid var(--gold);

    background:
        radial-gradient(
            ellipse at 50% 48%,
            #16865a 0%,
            #0c6c47 43%,
            #075239 76%,
            #043827 100%
        );

    box-shadow:
        0 0 0 2px #6d4a19,
        0 0 0 5px rgba(237,195,90,.08),
        inset 0 0 0 2px rgba(247,211,120,.28),
        inset 0 0 70px rgba(0,0,0,.35),
        0 18px 45px rgba(0,0,0,.48);

    overflow:hidden;

    flex-shrink:0;
}

.table:before{
    content:"";

    position:absolute;

    inset:10px;

    border-radius:31px;

    border:1px solid rgba(245,211,123,.16);

    box-shadow:
        inset 0 0 30px rgba(0,0,0,.13);

    pointer-events:none;
}

.table:after{
    content:"";

    position:absolute;

    inset:0;

    background:
        radial-gradient(
            circle at 50% 52%,
            rgba(255,255,255,.035),
            transparent 38%
        ),
        repeating-radial-gradient(
            ellipse at center,
            rgba(255,255,255,.012) 0 1px,
            transparent 1px 7px
        );

    opacity:.55;

    pointer-events:none;
}


/* =========================================================
   TABLE TOP
========================================================= */

.table-top{
    position:absolute;

    top:10px;
    left:14px;
    right:14px;

    z-index:10;

    display:flex;

    justify-content:space-between;

    align-items:flex-start;
}

.hokm-pill{
    min-width:92px;

    padding:6px 10px;

    border-radius:20px;

    background:rgba(12,28,22,.8);

    border:1px solid rgba(255,255,255,.08);

    box-shadow:0 4px 12px rgba(0,0,0,.18);

    color:#ead79f;

    font-size:10px;

    text-align:center;
}

.hokm-pill b{
    color:#fff;

    font-size:16px;

    margin-left:3px;
}

.turn-pill{
    max-width:145px;

    padding:6px 10px;

    border-radius:20px;

    background:rgba(12,28,22,.8);

    border:1px solid rgba(255,255,255,.08);

    color:#e9eeeb;

    font-size:9px;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
}


/* =========================================================
   SEATS
========================================================= */

.seat{
    position:absolute;

    z-index:12;

    display:flex;

    flex-direction:column;

    align-items:center;

    width:105px;

    transition:all .2s ease;
}

.seat.top{
    top:25px;

    left:50%;

    transform:translateX(-50%);
}

.seat.left{
    top:43%;

    left:4px;
}

.seat.right{
    top:43%;

    right:4px;
}

.seat.bottom{
    display:none;
}

.avatar{
    position:relative;

    width:56px;
    height:56px;

    border-radius:50%;

    display:flex;

    align-items:center;

    justify-content:center;

    background:
        radial-gradient(
            circle at 35% 30%,
            #6b7b77,
            #27332f 68%
        );

    border:3px solid #7dd2ae;

    box-shadow:
        0 0 0 2px rgba(0,0,0,.3),
        0 6px 16px rgba(0,0,0,.28);

    color:#fff;

    font-size:24px;

    font-weight:900;
}

.seat.top .avatar{
    border-color:var(--gold2);
}

.seat.turn .avatar{
    box-shadow:
        0 0 0 3px rgba(239,194,83,.2),
        0 0 20px rgba(239,194,83,.55),
        0 7px 18px rgba(0,0,0,.3);
}

.seat-name{
    max-width:100px;

    margin-top:5px;

    padding:4px 10px;

    border-radius:16px;

    background:rgba(10,25,19,.88);

    border:1px solid rgba(255,255,255,.06);

    box-shadow:0 4px 10px rgba(0,0,0,.18);

    color:#e8eee9;

    font-family:Georgia,serif;

    font-style:italic;

    font-weight:700;

    font-size:11px;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
}

.seat-meta{
    margin-top:3px;

    padding:3px 7px;

    border-radius:13px;

    background:rgba(8,20,15,.72);

    color:#b8c1bc;

    font-size:8px;

    min-height:17px;
}

.crown{
    position:absolute;

    top:-12px;
    right:-8px;

    min-width:48px;

    padding:3px 6px;

    border-radius:13px;

    background:
        linear-gradient(
            145deg,
            #f1ca65,
            #b17c24
        );

    color:#251a08;

    font-size:8px;

    font-weight:900;

    box-shadow:0 4px 9px rgba(0,0,0,.28);

    border:1px solid #f5dc8c;
}

.empty-seat{
    opacity:.45;
}


/* =========================================================
   CENTER
========================================================= */

.center{
    position:absolute;

    z-index:7;

    top:29%;

    left:50%;

    width:215px;
    height:230px;

    transform:translateX(-50%);
}

.trick-label{
    text-align:center;

    color:rgba(255,255,255,.45);

    font-size:8px;

    margin-bottom:4px;
}

.trick{
    position:relative;

    width:190px;
    height:180px;

    margin:auto;
}

.played{
    position:absolute;

    width:65px;
    height:91px;

    border-radius:9px;

    background:
        linear-gradient(
            145deg,
            #fff,
            #f1eee7 58%,
            #e7e2d8
        );

    border:1px solid #c9c3b8;

    color:#151515;

    box-shadow:
        0 8px 15px rgba(0,0,0,.36);

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    font-family:Arial,sans-serif;

    font-weight:900;

    transform-origin:center;
}

.played.red{
    color:#d42525;
}

.played .rank{
    font-size:22px;

    line-height:1;

    font-family:Georgia,serif;
}

.played .suit{
    font-size:27px;

    line-height:1;

    margin-top:6px;
}

.played.p1{
    top:0;
    left:62px;

    transform:rotate(-2deg);
}

.played.p2{
    top:45px;
    right:0;

    transform:rotate(5deg);
}

.played.p3{
    bottom:0;
    left:62px;

    transform:rotate(2deg);
}

.played.p4{
    top:45px;
    left:0;

    transform:rotate(-5deg);
}

.hokm-center{
    width:76px;

    margin:4px auto 0;

    padding:6px 8px;

    border-radius:20px;

    text-align:center;

    background:
        linear-gradient(
            145deg,
            #d7aa48,
            #976b24
        );

    border:1px solid #f0cf78;

    box-shadow:
        0 5px 14px rgba(0,0,0,.35);

    color:#fff;

    font-size:10px;

    font-weight:900;
}

.hokm-center.empty{
    opacity:.6;
}


/* =========================================================
   TIMER
========================================================= */

.timer{
    position:absolute;

    left:13px;

    bottom:13px;

    z-index:12;

    min-width:100px;

    padding:6px 9px;

    border-radius:20px;

    background:rgba(9,26,20,.84);

    border:1px solid rgba(255,255,255,.08);

    color:#dce5e0;

    font-size:9px;

    text-align:center;
}

.timer b{
    color:var(--gold2);

    font-size:14px;

    margin-right:3px;
}


/* =========================================================
   PLAYER STRIP
========================================================= */

.my-strip{
    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:7px;

    margin:6px 10px 0;

    min-height:46px;

    flex-shrink:0;
}

.my-player{
    display:flex;

    align-items:center;

    gap:7px;

    direction:rtl;
}

.my-avatar{
    width:43px;
    height:43px;

    border-radius:50%;

    display:flex;

    align-items:center;

    justify-content:center;

    background:
        radial-gradient(
            circle at 35% 30%,
            #71807b,
            #27332e
        );

    border:2px solid #81d7b1;

    box-shadow:
        0 0 0 2px rgba(0,0,0,.25),
        0 5px 13px rgba(0,0,0,.3);

    font-size:19px;
}

.my-name{
    color:#79ddb5;

    font-family:Georgia,serif;

    font-style:italic;

    font-weight:700;

    font-size:15px;
}

.waiting{
    padding:7px 10px;

    border-radius:18px;

    background:#111a16;

    color:#c5cdc8;

    font-size:9px;

    border:1px solid rgba(255,255,255,.05);
}


/* =========================================================
   HAND
========================================================= */

.hand-wrap{
    position:relative;

    height:125px;

    margin:0 -2px;

    overflow:visible;

    flex-shrink:0;
}

.hand{
    position:absolute;

    left:50%;

    bottom:-2px;

    width:100%;

    height:120px;

    transform:translateX(-50%);

    display:flex;

    align-items:flex-end;

    justify-content:center;

    padding:0 3px;

    overflow:visible;

    direction:ltr;
}


/* =========================================================
   CARDS
========================================================= */

.card{
    position:relative;

    flex:0 0 clamp(43px,10.2vw,60px);

    width:clamp(43px,10.2vw,60px);

    height:clamp(75px,21.5vw,102px);

    margin-left:clamp(-15px,-2.8vw,-7px);

    border-radius:9px;

    border:1px solid #c9c3b8;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.98),
            rgba(249,247,241,.98) 55%,
            rgba(229,225,216,.98)
        );

    color:#151515;

    box-shadow:
        0 7px 14px rgba(0,0,0,.55),
        0 2px 3px rgba(0,0,0,.35),
        inset 0 0 0 1px rgba(255,255,255,.9);

    cursor:pointer;

    overflow:hidden;

    transform-origin:50% 108%;

    transition:
        transform .18s ease,
        box-shadow .18s ease,
        filter .18s ease;

    user-select:none;
}

.card:first-child{
    margin-left:0;
}

.card:before{
    content:"";

    position:absolute;

    inset:3px;

    border:1px solid rgba(160,154,143,.55);

    border-radius:7px;

    pointer-events:none;
}

.card.red{
    color:#c91d2b;
}

.card-corner{
    position:absolute;

    left:5px;
    top:4px;

    width:16px;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    font-family:Georgia,"Times New Roman",serif;

    font-weight:900;

    line-height:.92;

    z-index:3;
}

.card-corner.bottom{
    left:auto;

    top:auto;

    right:5px;

    bottom:4px;

    transform:rotate(180deg);
}

.card-corner .rank{
    font-size:clamp(12px,3.3vw,17px);
}

.card-corner .mini-suit{
    margin-top:2px;

    font-size:clamp(9px,2.5vw,12px);
}

.card-center-suit{
    position:absolute;

    left:50%;
    top:53%;

    transform:translate(-50%,-50%);

    font-size:clamp(27px,7.5vw,44px);

    line-height:1;

    font-family:"Times New Roman",serif;

    text-shadow:
        0 1px 0 rgba(0,0,0,.05);

    z-index:2;
}

.card.selected{
    transform:
        translateY(-25px)
        rotate(0deg)!important;

    z-index:100!important;

    box-shadow:
        0 18px 28px rgba(0,0,0,.62),
        0 0 0 2px var(--gold2),
        0 0 18px rgba(241,203,108,.3);
}

.card.disabled{
    opacity:.38;

    filter:
        saturate(.35)
        brightness(.9);
}


/* =========================================================
   CARD FAN
========================================================= */

.card:nth-child(1){
    transform:rotate(-16deg) translateY(10px);
    z-index:1;
}

.card:nth-child(2){
    transform:rotate(-13deg) translateY(6px);
    z-index:2;
}

.card:nth-child(3){
    transform:rotate(-10deg) translateY(3px);
    z-index:3;
}

.card:nth-child(4){
    transform:rotate(-7deg) translateY(1px);
    z-index:4;
}

.card:nth-child(5){
    transform:rotate(-4deg) translateY(-2px);
    z-index:5;
}

.card:nth-child(6){
    transform:rotate(-2deg) translateY(-3px);
    z-index:6;
}

.card:nth-child(7){
    transform:rotate(0deg) translateY(-4px);
    z-index:7;
}

.card:nth-child(8){
    transform:rotate(2deg) translateY(-3px);
    z-index:8;
}

.card:nth-child(9){
    transform:rotate(4deg) translateY(-2px);
    z-index:9;
}

.card:nth-child(10){
    transform:rotate(7deg) translateY(1px);
    z-index:10;
}

.card:nth-child(11){
    transform:rotate(10deg) translateY(3px);
    z-index:11;
}

.card:nth-child(12){
    transform:rotate(13deg) translateY(6px);
    z-index:12;
}

.card:nth-child(13){
    transform:rotate(16deg) translateY(10px);
    z-index:13;
}


/* =========================================================
   CONTROLS
========================================================= */

.controls{
    display:flex;

    justify-content:center;

    gap:6px;

    margin:3px 0 0;

    flex-shrink:0;
}

.btn{
    border:1px solid rgba(255,255,255,.12);

    padding:7px 12px;

    border-radius:18px;

    color:#fff;

    background:
        linear-gradient(
            145deg,
            #1d2b24,
            #101814
        );

    box-shadow:
        0 5px 12px rgba(0,0,0,.28);

    font-size:9px;

    font-weight:800;

    cursor:pointer;
}

.btn.primary{
    background:
        linear-gradient(
            145deg,
            #d3a747,
            #8f6525
        );

    border-color:#ebca76;
}

.btn:active{
    transform:scale(.96);
}


/* =========================================================
   MODAL
========================================================= */

.modal{
    position:fixed;

    inset:0;

    z-index:1000;

    display:none;

    align-items:center;

    justify-content:center;

    padding:20px;

    background:rgba(0,0,0,.76);

    backdrop-filter:blur(4px);
}

.modal.show{
    display:flex;
}

.modal-box{
    width:min(340px,94vw);

    padding:22px;

    border-radius:25px;

    background:
        linear-gradient(
            145deg,
            #0b4f34,
            #0a6d45
        );

    border:2px solid var(--gold);

    box-shadow:
        0 18px 45px rgba(0,0,0,.65);

    text-align:center;
}

.modal-title{
    font-size:19px;

    font-weight:900;

    margin-bottom:7px;
}

.modal-subtitle{
    font-size:11px;

    color:#c7d1cc;

    margin-bottom:16px;
}

.suits{
    display:grid;

    grid-template-columns:repeat(2,1fr);

    gap:9px;
}

.suit-btn{
    min-height:64px;

    border-radius:16px;

    border:1px solid rgba(255,255,255,.12);

    background:rgba(0,0,0,.2);

    color:#fff;

    font-size:28px;

    cursor:pointer;
}

.suit-btn.red{
    color:#ff5555;
}


/* =========================================================
   MESSAGE
========================================================= */

.message{
    position:fixed;

    left:50%;

    bottom:20px;

    transform:translateX(-50%);

    z-index:2000;

    max-width:90vw;

    padding:10px 16px;

    border-radius:16px;

    background:rgba(0,0,0,.88);

    color:#fff;

    font-size:11px;

    text-align:center;

    display:none;

    box-shadow:
        0 8px 25px rgba(0,0,0,.35);
}

.message.show{
    display:block;
}


/* =========================================================
   SMALL PHONES
========================================================= */

@media(max-height:700px){

    .game-head{
        height:68px;
    }

    .score-row{
        margin-bottom:4px;
    }

    .table{
        height:calc(100dvh - 235px);

        min-height:430px;
    }

    .seat.top{
        top:21px;
    }

    .seat.left,
    .seat.right{
        top:42%;
    }

    .center{
        top:27%;

        transform:
            translateX(-50%)
            scale(.88);
    }

    .my-strip{
        min-height:40px;

        margin-top:4px;
    }

    .my-avatar{
        width:38px;
        height:38px;

        font-size:17px;
    }

    .my-name{
        font-size:13px;
    }

    .hand-wrap{
        height:105px;
    }

    .hand{
        height:102px;
    }

    .card{
        height:72px;
    }

    .controls{
        margin-top:1px;
    }

    .btn{
        padding:6px 10px;
    }
}


/* =========================================================
   VERY SMALL PHONES
========================================================= */

@media(max-width:380px){

    .page{
        padding-left:5px;
        padding-right:5px;
    }

    .game-head{
        height:64px;

        grid-template-columns:44px 1fr 44px;
    }

    .icon-btn{
        width:35px;
        height:35px;

        font-size:16px;
    }

    .game-title strong{
        font-size:18px;
    }

    .game-title span{
        font-size:9px;
    }

    .table{
        height:calc(100dvh - 225px);

        min-height:410px;

        border-width:4px;

        border-radius:34px;
    }

    .table-top{
        left:10px;
        right:10px;
    }

    .hokm-pill{
        min-width:80px;

        font-size:8px;
    }

    .turn-pill{
        max-width:120px;

        font-size:8px;
    }

    .seat{
        width:92px;
    }

    .seat.left{
        left:2px;
    }

    .seat.right{
        right:2px;
    }

    .avatar{
        width:50px;
        height:50px;

        font-size:21px;
    }

    .seat-name{
        font-size:10px;
    }

    .center{
        top:27%;

        transform:
            translateX(-50%)
            scale(.78);
    }

    .hand-wrap{
        height:98px;
    }

    .hand{
        height:95px;
    }

    .card{
        flex-basis:39px;

        width:39px;

        height:69px;

        margin-left:-12px;
    }

    .card-center-suit{
        font-size:26px;
    }

    .my-strip{
        margin-left:6px;
        margin-right:6px;
    }
}

</style>
</head>


<body>

<div class="page">


    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header class="game-head">

        <div class="head-side">

            <button
                class="icon-btn"
                onclick="tg && tg.close ? tg.close() : null"
            >
                ×
            </button>

        </div>


        <div class="game-title">

            <strong>حکم</strong>

            <span>
                میز بازی گرین‌دریم
            </span>

            <span
                id="roundInfo"
                class="round-pill"
            >
                دست ۱
            </span>

        </div>


        <div class="head-side">

            <button
                class="icon-btn"
                onclick="showMessage('پنل بازی')"
            >
                ⋯
            </button>

        </div>

    </header>



    <!-- =====================================================
         SCORE
    ====================================================== -->

    <div class="score-row">

        <div class="score-box">

            <span id="teamAName">
                ما
            </span>

            <span
                id="teamAScore"
                class="score"
            >
                ۰
            </span>

        </div>


        <div class="score-center">
            امتیاز
        </div>


        <div class="score-box">

            <span id="teamBName">
                حریف
            </span>

            <span
                id="teamBScore"
                class="score"
            >
                ۰
            </span>

        </div>

    </div>



    <!-- =====================================================
         TABLE
    ====================================================== -->

    <section class="table">


        <!-- TABLE INFO -->

        <div class="table-top">

            <div
                id="hokmInfo"
                class="hokm-pill"
            >
                حکم:
                <b>—</b>
            </div>


            <div
                id="turnInfo"
                class="turn-pill"
            >
                در حال دریافت وضعیت...
            </div>

        </div>



        <!-- TOP PLAYER -->

        <div
            id="seatTop"
            class="seat top"
        >

            <div class="avatar">
                ♞
            </div>

            <div class="seat-name">
                —
            </div>

            <div class="seat-meta">
                —
            </div>

        </div>



        <!-- LEFT PLAYER -->

        <div
            id="seatLeft"
            class="seat left"
        >

            <div class="avatar">
                🐱
            </div>

            <div class="seat-name">
                —
            </div>

            <div class="seat-meta">
                —
            </div>

        </div>



        <!-- RIGHT PLAYER -->

        <div
            id="seatRight"
            class="seat right"
        >

            <div class="avatar">
                🐯
            </div>

            <div class="seat-name">
                —
            </div>

            <div class="seat-meta">
                —
            </div>

        </div>



        <!-- CENTER -->

        <div class="center">

            <div class="trick-label">
                کارت‌های بازی‌شده
            </div>


            <div
                id="trick"
                class="trick"
            ></div>


            <div
                id="hokmBox"
                class="hokm-center empty"
            >
                حکم —
            </div>

        </div>



        <!-- TIMER -->

        <div
            id="timer"
            class="timer"
        >

            زمان نوبت

            <b id="timerValue">
                ۳۰
            </b>

        </div>


    </section>



    <!-- =====================================================
         MY PLAYER
    ====================================================== -->

    <div class="my-strip">


        <div
            id="waiting"
            class="waiting"
        >
            منتظر بازیکنان...
        </div>


        <div class="my-player">

            <div>

                <div
                    id="myName"
                    class="my-name"
                >
                    بازیکن
                </div>


                <div
                    id="bottomInfo"
                    style="
                        color:#9da9a3;
                        font-size:8px;
                        margin-top:2px;
                    "
                >
                    دست شما
                </div>

            </div>


            <div
                id="myAvatar"
                class="my-avatar"
            >
                🦉
            </div>

        </div>

    </div>



    <!-- =====================================================
         HAND
    ====================================================== -->

    <div class="hand-wrap">

        <div
            id="hand"
            class="hand"
        ></div>

    </div>



    <!-- =====================================================
         BUTTONS
    ====================================================== -->

    <div class="controls">

        <button
            id="startBtn"
            class="btn primary"
            onclick="startGame()"
        >
            🎮 شروع بازی
        </button>


        <button
            class="btn"
            onclick="loadGame()"
        >
            ↻ بروزرسانی
        </button>

    </div>


</div>



<!-- =========================================================
     HOKM MODAL
========================================================= -->

<div
    id="hokmModal"
    class="modal"
>

    <div class="modal-box">

        <div class="modal-title">
            👑 انتخاب حکم
        </div>

        <div class="modal-subtitle">
            یکی از خال‌ها را برای حکم انتخاب کنید
        </div>


        <div class="suits">

            <button
                class="suit-btn red"
                onclick="chooseHokm('♥')"
            >
                ♥
            </button>

            <button
                class="suit-btn red"
                onclick="chooseHokm('♦')"
            >
                ♦
            </button>

            <button
                class="suit-btn"
                onclick="chooseHokm('♣')"
            >
                ♣
            </button>

            <button
                class="suit-btn"
                onclick="chooseHokm('♠')"
            >
                ♠
            </button>

        </div>

    </div>

</div>



<!-- =========================================================
     MESSAGE
========================================================= -->

<div
    id="message"
    class="message"
></div>



<script>

/* =========================================================
   TELEGRAM
========================================================= */

const tg =
    window.Telegram &&
    window.Telegram.WebApp
        ? window.Telegram.WebApp
        : null;

if(tg){

    tg.ready();

    tg.expand();

}


/* =========================================================
   GAME
========================================================= */

const params =
    new URLSearchParams(
        window.location.search
    );

const gameId =
    params.get("game") ||
    params.get("game_id");

let currentState = null;

let messageTimer = null;


/* =========================================================
   HEADERS
========================================================= */

function headers(){

    const result = {
        "Content-Type":
            "application/json"
    };

    if(
        tg &&
        tg.initData
    ){

        result[
            "X-Telegram-Init-Data"
        ] = tg.initData;

    }

    return result;
}


/* =========================================================
   API
========================================================= */

async function api(
    url,
    options={}
){

    const response =
        await fetch(
            url,
            {
                ...options,

                headers:{
                    ...headers(),
                    ...(options.headers || {})
                }
            }
        );


    let data={};

    try{

        data =
            await response.json();

    }catch{

        data={};

    }


    if(!response.ok){

        throw new Error(
            data.error ||
            "خطا در ارتباط با سرور"
        );

    }


    return data;
}


/* =========================================================
   MESSAGE
========================================================= */

function showMessage(text){

    const box =
        document.getElementById(
            "message"
        );

    box.textContent = text;

    box.classList.add("show");

    clearTimeout(
        messageTimer
    );

    messageTimer =
        setTimeout(
            () =>
                box.classList.remove(
                    "show"
                ),
            2600
        );

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(value){

    return String(
        value ?? ""
    )
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================================================
   CARD HELPERS
========================================================= */

function cardIsRed(suit){

    return (
        suit === "♥" ||
        suit === "♦"
    );

}


function initials(name){

    const s =
        String(
            name || "؟"
        ).trim();

    return s
        ? s.slice(0,1).toUpperCase()
        : "؟";

}


/* =========================================================
   SCORE UI
========================================================= */

function setScoreUI(state){

    const a =
        state.team_a_score ??
        state.score_a ??
        state.our_score ??
        0;

    const b =
        state.team_b_score ??
        state.score_b ??
        state.opponent_score ??
        0;


    document.getElementById(
        "teamAScore"
    ).textContent = a;


    document.getElementById(
        "teamBScore"
    ).textContent = b;


    if(state.team_a_name){

        document.getElementById(
            "teamAName"
        ).textContent =
            state.team_a_name;

    }


    if(state.team_b_name){

        document.getElementById(
            "teamBName"
        ).textContent =
            state.team_b_name;

    }


    if(state.round != null){

        document.getElementById(
            "roundInfo"
        ).textContent =
            "دست " +
            state.round;

    }

}


/* =========================================================
   LOAD GAME
========================================================= */

async function loadGame(){

    if(!gameId){

        document.getElementById(
            "turnInfo"
        ).textContent =
            "❌ شناسه بازی پیدا نشد";

        return;

    }


    try{

        const state =
            await api(
                `/api/game/${gameId}`
            );

        currentState = state;

        render(state);

    }
    catch(error){

        document.getElementById(
            "turnInfo"
        ).textContent =
            "❌ " +
            error.message;

    }

}


/* =========================================================
   RENDER
========================================================= */

function render(state){

    setScoreUI(state);


    document.getElementById(
        "turnInfo"
    ).textContent =

        state.current_player_name

            ? "🎯 نوبت: " +
              state.current_player_name

            : (
                state.status_text ||
                "در حال بازی"
            );


    const hokm =
        state.hokm || "—";


    document.getElementById(
        "hokmInfo"
    ).innerHTML =
        `حکم: <b>${
            escapeHtml(hokm)
        }</b>`;


    const hokmBox =
        document.getElementById(
            "hokmBox"
        );


    if(state.hokm){

        hokmBox.textContent =
            "حکم " +
            state.hokm;

        hokmBox.classList.remove(
            "empty"
        );

    }
    else{

        hokmBox.textContent =
            "حکم —";

        hokmBox.classList.add(
            "empty"
        );

    }


    renderSeats(state);

    renderTrick(state);

    renderHand(state);


    const startBtn =
        document.getElementById(
            "startBtn"
        );


    if(state.started){

        startBtn.style.display =
            "none";

    }
    else{

        startBtn.style.display =

            Number(
                state.viewer_id
            ) === Number(
                state.creator_id
            )

                ? "inline-block"

                : "none";

    }


    document
        .getElementById(
            "hokmModal"
        )
        .classList.toggle(

            "show",

            state.phase ===
                "choose_hokm"

            &&

            Number(
                state.viewer_id
            ) === Number(
                state.hakim_id
            )

        );

}


/* =========================================================
   SEAT
========================================================= */

function updateSeat(
    seat,
    player
){

    seat.classList.remove(
        "turn",
        "empty-seat"
    );


    const avatar =
        seat.querySelector(
            ".avatar"
        );

    const name =
        seat.querySelector(
            ".seat-name"
        );

    const meta =
        seat.querySelector(
            ".seat-meta"
        );


    seat
        .querySelector(
            ".crown"
        )
        ?.remove();


    if(!player){

        seat.classList.add(
            "empty-seat"
        );

        avatar.textContent =
            "•";

        name.textContent =
            "صندلی خالی";

        meta.textContent =
            "";

        return;

    }


    avatar.textContent =
        player.avatar ||
        initials(
            player.name
        );


    name.textContent =
        player.name ||
        "بازیکن";


    let metaText=[];


    if(player.is_turn){

        seat.classList.add(
            "turn"
        );

        metaText.push(
            "🎯 نوبت"
        );

    }


    if(player.is_bot){

        metaText.push(
            "🤖 کامپیوتر"
        );

    }


    meta.textContent =
        metaText.join(" • ") ||
        "در بازی";


    if(player.is_hakim){

        const crown =
            document.createElement(
                "div"
            );

        crown.className =
            "crown";

        crown.textContent =
            "👑 حاکم";

        seat.appendChild(
            crown
        );

    }

}


/* =========================================================
   SEATS
========================================================= */

function renderSeats(state){

    const players =
        state.players || [];


    const me =
        players.find(
            p =>
                Number(p.id) ===
                Number(
                    state.viewer_id
                )
        );


    const others =
        players.filter(
            p =>
                Number(p.id) !==
                Number(
                    state.viewer_id
                )
        );


    updateSeat(
        document.getElementById(
            "seatTop"
        ),
        others[0]
    );


    updateSeat(
        document.getElementById(
            "seatRight"
        ),
        others[1]
    );


    updateSeat(
        document.getElementById(
            "seatLeft"
        ),
        others[2]
    );


    if(me){

        document.getElementById(
            "myName"
        ).textContent =
            me.name ||
            "بازیکن";


        document.getElementById(
            "myAvatar"
        ).textContent =
            me.avatar ||
            initials(me.name);


        let info =
            state.status_text ||
            "دست شما";


        if(me.is_turn){

            info =
                "🎯 نوبت شما";

        }


        if(me.is_hakim){

            info +=
                " • 👑 حاکم";

        }


        document.getElementById(
            "bottomInfo"
        ).textContent =
            info;


        document.getElementById(
            "waiting"
        ).textContent =

            me.is_turn

                ? "نوبت شماست"

                : (
                    state.status_text ||
                    "منتظر نوبت..."
                );

    }

}


/* =========================================================
   TRICK
========================================================= */

function renderTrick(state){

    const trick =
        document.getElementById(
            "trick"
        );


    trick.innerHTML = "";


    const cards =
        state.current_trick || [];


    cards.forEach(
        (item,index) => {

            const card =
                item.card;


            if(!card)
                return;


            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "played " +

                (
                    cardIsRed(
                        card.suit
                    )
                        ? "red "
                        : ""
                ) +

                "p" +

                (index + 1);


            div.innerHTML =
                `
                <div class="rank">
                    ${escapeHtml(
                        card.label
                    )}
                </div>

                <div class="suit">
                    ${escapeHtml(
                        card.suit
                    )}
                </div>
                `;


            trick.appendChild(
                div
            );

        }
    );

}


/* =========================================================
   HAND
========================================================= */

function renderHand(state){

    const hand =
        document.getElementById(
            "hand"
        );


    hand.innerHTML = "";


    const me =
        (state.players || [])
        .find(
            p =>
                Number(p.id) ===
                Number(
                    state.viewer_id
                )
        );


    if(!me)
        return;


    const cards =
        me.cards || [];


    const canPlay =

        state.phase ===
            "playing"

        &&

        Number(
            state.current_player_id
        ) === Number(
            state.viewer_id
        );


    let legal=[];


    if(canPlay){

        const trick =
            state.current_trick ||
            [];


        const lead =
            state.lead_suit;


        if(
            trick.length === 0 ||
            !lead
        ){

            legal = cards;

        }
        else{

            const sameSuit =
                cards.filter(
                    card =>
                        card.suit ===
                        lead
                );


            legal =
                sameSuit.length
                    ? sameSuit
                    : cards;

        }

    }


    cards.forEach(
        card => {

            const div =
                document.createElement(
                    "div"
                );


            const legalCard =
                legal.some(
                    item =>
                        item.suit ===
                            card.suit

                        &&

                        Number(
                            item.rank
                        ) === Number(
                            card.rank
                        )
                );


            div.className =

                "card " +

                (
                    cardIsRed(
                        card.suit
                    )
                        ? "red "
                        : ""
                ) +

                (
                    canPlay &&
                    !legalCard
                        ? "disabled"
                        : ""
                );


            const rank =
                escapeHtml(
                    card.label
                );


            const suit =
                escapeHtml(
                    card.suit
                );


            div.innerHTML =
                `
                <div class="card-corner top">

                    <span class="rank">
                        ${rank}
                    </span>

                    <span class="mini-suit">
                        ${suit}
                    </span>

                </div>


                <div class="card-center-suit">
                    ${suit}
                </div>


                <div class="card-corner bottom">

                    <span class="rank">
                        ${rank}
                    </span>

                    <span class="mini-suit">
                        ${suit}
                    </span>

                </div>
                `;


            if(
                canPlay &&
                legalCard
            ){

                div.onclick =
                    () =>
                        playCard(
                            card.suit,
                            card.rank,
                            div
                        );

            }


            hand.appendChild(
                div
            );

        }
    );

}


/* =========================================================
   START
========================================================= */

async function startGame(){

    if(!gameId)
        return;


    try{

        await api(
            `/api/game/${gameId}/start`,
            {
                method:"POST"
            }
        );


        await loadGame();

    }
    catch(error){

        showMessage(
            error.message
        );

    }

}


/* =========================================================
   HOKM
========================================================= */

async function chooseHokm(
    suit
){

    if(!gameId)
        return;


    try{

        document
            .getElementById(
                "hokmModal"
            )
            .classList.remove(
                "show"
            );


        await api(
            `/api/game/${gameId}/hokm`,
            {
                method:"POST",

                body:
                    JSON.stringify({
                        suit
                    })
            }
        );


        await loadGame();

    }
    catch(error){

        showMessage(
            error.message
        );

    }

}


/* =========================================================
   PLAY CARD
========================================================= */

async function playCard(
    suit,
    rank,
    element
){

    if(
        !currentState ||
        currentState.phase !==
            "playing"
    )
        return;


    if(
        Number(
            currentState.current_player_id
        ) !== Number(
            currentState.viewer_id
        )
    ){

        showMessage(
            "الان نوبت شما نیست."
        );

        return;

    }


    element.classList.add(
        "selected"
    );


    try{

        await api(
            `/api/game/${gameId}/play`,
            {
                method:"POST",

                body:
                    JSON.stringify({
                        suit,
                        rank
                    })
            }
        );


        await loadGame();

    }
    catch(error){

        element.classList.remove(
            "selected"
        );

        showMessage(
            error.message
        );

    }

}


/* =========================================================
   INITIAL LOAD
========================================================= */

loadGame();


/*
   بروزرسانی بازی
*/
setInterval(
    loadGame,
    1800
);

</script>

</body>
</html>
