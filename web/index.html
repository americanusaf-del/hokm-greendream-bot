<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>حکم گرین‌دریم</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Tahoma, Arial, sans-serif;
            background:
                radial-gradient(
                    circle at center,
                    #137044 0%,
                    #07512f 45%,
                    #032f1d 100%
                );
            color: white;
            overflow-x: hidden;
        }

        button {
            font-family: inherit;
        }

        .page {
            min-height: 100vh;
            padding: 10px;
            display: flex;
            flex-direction: column;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
        }

        .brand {
            font-size: 18px;
            font-weight: 900;
        }

        .room {
            font-size: 11px;
            opacity: .7;
        }

        .info-panel {
            background: rgba(0,0,0,.35);
            border: 1px solid rgba(255,215,120,.5);
            border-radius: 15px;
            padding: 10px;
            margin-bottom: 8px;
        }

        .status {
            text-align: center;
            font-size: 16px;
            font-weight: 900;
            margin-bottom: 8px;
        }

        .details {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
        }

        .detail {
            background: rgba(255,255,255,.08);
            border-radius: 10px;
            padding: 7px 4px;
            text-align: center;
            font-size: 11px;
        }

        .detail strong {
            display: block;
            font-size: 14px;
            margin-top: 3px;
        }

        .table {
            position: relative;
            flex: 1;
            min-height: 540px;
            border-radius: 35px;
            border: 5px solid #c69b43;
            box-shadow:
                inset 0 0 0 3px #6e4c19,
                inset 0 0 70px rgba(0,0,0,.35),
                0 10px 30px rgba(0,0,0,.4);
            background:
                radial-gradient(
                    circle,
                    #15814b 0%,
                    #096038 55%,
                    #064027 100%
                );
            overflow: hidden;
        }

        .seat {
            position: absolute;
            min-width: 105px;
            max-width: 145px;
            text-align: center;
            padding: 8px;
            border-radius: 14px;
            background: rgba(0,0,0,.35);
            border: 2px solid rgba(255,255,255,.15);
            transition: .2s;
            z-index: 5;
        }

        .seat.turn {
            border-color: #ffd45c;
            box-shadow:
                0 0 18px rgba(255,212,92,.7);
        }

        .seat.hakim {
            border-color: #ffd45c;
        }

        .seat.you {
            background: rgba(255,255,255,.12);
        }

        .seat-top {
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
        }

        .seat-right {
            right: 7px;
            top: 50%;
            transform: translateY(-50%);
        }

        .seat-bottom {
            bottom: 8px;
            left: 50%;
            transform: translateX(-50%);
        }

        .seat-left {
            left: 7px;
            top: 50%;
            transform: translateY(-50%);
        }

        .player-name {
            font-weight: 900;
            font-size: 12px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .badges {
            display: flex;
            justify-content: center;
            gap: 4px;
            margin-top: 5px;
            flex-wrap: wrap;
        }

        .badge {
            font-size: 9px;
            padding: 3px 6px;
            border-radius: 10px;
            background: rgba(255,255,255,.12);
        }

        .badge.hakim-badge {
            background: #c8972d;
            color: #201500;
            font-weight: 900;
        }

        .badge.turn-badge {
            background: #ffe17b;
            color: #2d2200;
            font-weight: 900;
        }

        .card-count {
            font-size: 10px;
            margin-top: 4px;
            opacity: .75;
        }

        .center {
            position: absolute;
            left: 50%;
            top: 49%;
            transform: translate(-50%, -50%);
            width: 210px;
            height: 175px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .hokm-box {
            min-width: 145px;
            text-align: center;
            padding: 10px 14px;
            border-radius: 16px;
            background: rgba(0,0,0,.4);
            border: 2px solid #d8ae54;
            margin-bottom: 12px;
        }

        .hokm-title {
            font-size: 11px;
            opacity: .75;
        }

        .hokm-value {
            font-size: 30px;
            font-weight: 900;
            margin-top: 2px;
        }

        .trick {
            position: relative;
            width: 130px;
            height: 110px;
        }

        .played-card {
            position: absolute;
            width: 55px;
            height: 78px;
            border-radius: 7px;
            background: #fff;
            color: #111;
            border: 1px solid #ddd;
            box-shadow: 0 5px 12px rgba(0,0,0,.35);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-weight: 900;
        }

        .played-card.red {
            color: #d22;
        }

        .played-card .rank {
            font-size: 21px;
        }

        .played-card .suit {
            font-size: 21px;
        }

        .played-card:nth-child(1) {
            left: 38px;
            top: 0;
        }

        .played-card:nth-child(2) {
            right: 0;
            top: 24px;
        }

        .played-card:nth-child(3) {
            left: 38px;
            bottom: 0;
        }

        .played-card:nth-child(4) {
            left: 0;
            top: 24px;
        }

        .hand-area {
            margin-top: 10px;
            min-height: 150px;
            padding: 10px 2px 4px;
        }

        .hand-title {
            text-align: center;
            font-size: 12px;
            margin-bottom: 4px;
            opacity: .85;
        }

        .hand {
            height: 120px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: flex-end;
        }

        .card {
            position: relative;
            width: 58px;
            height: 92px;
            margin-left: -18px;
            border-radius: 8px;
            background: #fff;
            color: #111;
            border: 2px solid #ddd;
            box-shadow: 0 4px 9px rgba(0,0,0,.35);
            cursor: pointer;
            transition:
                transform .15s,
                margin .15s;
            flex-shrink: 0;
            z-index: 1;
        }

        .card:first-child {
            margin-left: 0;
        }

        .card:hover,
        .card.selected {
            transform: translateY(-18px);
            z-index: 20;
        }

        .card.disabled {
            opacity: .4;
            filter: grayscale(.7);
            cursor: default;
        }

        .card.red {
            color: #d11;
        }

        .card-rank {
            position: absolute;
            top: 5px;
            left: 6px;
            font-size: 18px;
            font-weight: 900;
        }

        .card-suit {
            position: absolute;
            right: 6px;
            bottom: 5px;
            font-size: 20px;
        }

        .actions {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 8px;
        }

        .action {
            border: 0;
            border-radius: 12px;
            padding: 11px 17px;
            font-weight: 900;
            cursor: pointer;
            background: #d7a943;
            color: #241900;
        }

        .action.secondary {
            background: rgba(255,255,255,.12);
            color: white;
            border: 1px solid rgba(255,255,255,.2);
        }

        .modal {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.72);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
            padding: 20px;
        }

        .modal.show {
            display: flex;
        }

        .modal-box {
            width: min(390px, 100%);
            background:
                linear-gradient(
                    145deg,
                    #07502f,
                    #062e1d
                );
            border: 2px solid #d3a94d;
            border-radius: 22px;
            padding: 22px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,.6);
        }

        .modal-title {
            font-size: 21px;
            font-weight: 900;
            margin-bottom: 8px;
        }

        .modal-sub {
            font-size: 13px;
            opacity: .8;
            margin-bottom: 18px;
        }

        .suits {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .suit-btn {
            height: 75px;
            border: 1px solid rgba(255,255,255,.2);
            border-radius: 15px;
            background: rgba(255,255,255,.1);
            color: white;
            font-size: 34px;
            cursor: pointer;
        }

        .suit-btn.red {
            color: #ff6666;
        }

        .message {
            position: fixed;
            left: 50%;
            bottom: 20px;
            transform: translateX(-50%);
            background: rgba(0,0,0,.85);
            padding: 12px 18px;
            border-radius: 13px;
            z-index: 200;
            display: none;
            max-width: 90%;
            text-align: center;
            font-size: 13px;
        }

        .message.show {
            display: block;
        }

        @media (max-width: 430px) {

            .table {
                min-height: 500px;
            }

            .seat {
                min-width: 92px;
            }

            .card {
                width: 53px;
                height: 86px;
                margin-left: -20px;
            }

            .card-rank {
                font-size: 16px;
            }

            .card-suit {
                font-size: 18px;
            }

            .center {
                transform:
                    translate(-50%, -50%)
                    scale(.9);
            }
        }

    </style>
</head>

<body>

<div class="page">

    <div class="topbar">

        <div class="brand">
            ♠️ حکم گرین‌دریم
        </div>

        <div
            class="room"
            id="roomId"
        >
        </div>

    </div>


    <div class="info-panel">

        <div
            class="status"
            id="status"
        >
            در حال بارگذاری...
        </div>

        <div class="details">

            <div class="detail">
                👑 حاکم
                <strong id="hakim">
                    -
                </strong>
            </div>

            <div class="detail">
                🃏 حکم
                <strong id="hokm">
                    انتخاب نشده
                </strong>
            </div>

            <div class="detail">
                🎯 نوبت
                <strong id="turn">
                    -
                </strong>
            </div>

        </div>

    </div>


    <div class="table">

        <div
            class="seat seat-top"
            id="seat0"
        ></div>

        <div
            class="seat seat-right"
            id="seat1"
        ></div>

        <div
            class="seat seat-bottom"
            id="seat2"
        ></div>

        <div
            class="seat seat-left"
            id="seat3"
        ></div>


        <div class="center">

            <div class="hokm-box">

                <div class="hokm-title">
                    حکم بازی
                </div>

                <div
                    class="hokm-value"
                    id="centerHokm"
                >
                    ؟
                </div>

            </div>

            <div
                class="trick"
                id="trick"
            ></div>

        </div>

    </div>


    <div class="hand-area">

        <div
            class="hand-title"
            id="handTitle"
        >
            کارت‌های شما
        </div>

        <div
            class="hand"
            id="hand"
        ></div>

    </div>


    <div class="actions">

        <button
            class="action"
            id="startBtn"
            onclick="startGame()"
            style="display:none"
        >
            🎮 شروع بازی
        </button>

        <button
            class="action secondary"
            onclick="loadGame()"
        >
            🔄 بروزرسانی
        </button>

    </div>

</div>


<div
    class="modal"
    id="hokmModal"
>

    <div class="modal-box">

        <div class="modal-title">
            👑 انتخاب حکم
        </div>

        <div class="modal-sub">
            شما حاکم هستید.
            یکی از چهار خال را انتخاب کنید.
        </div>

        <div class="suits">

            <button
                class="suit-btn red"
                onclick="chooseHokm('♥')"
            >
                ♥
            </button>

            <button
                class="suit-btn red"
                onclick="chooseHokm('♦')"
            >
                ♦
            </button>

            <button
                class="suit-btn"
                onclick="chooseHokm('♣')"
            >
                ♣
            </button>

            <button
                class="suit-btn"
                onclick="chooseHokm('♠')"
            >
                ♠
            </button>

        </div>

    </div>

</div>


<div
    class="message"
    id="message"
></div>


<script>

const tg = window.Telegram?.WebApp;

if (tg) {
    tg.ready();
    tg.expand();
}

const params = new URLSearchParams(
    window.location.search
);

const gameId =
    params.get("game") ||
    params.get("game_id") ||
    "";

let game = null;

let loading = false;


document.getElementById(
    "roomId"
).textContent =
    gameId
        ? `میز ${gameId}`
        : "";


function initData() {

    if (!tg) {
        return "";
    }

    return tg.initData || "";
}


async function api(
    url,
    options = {}
) {

    const headers = {
        "Content-Type":
            "application/json",

        "X-Telegram-Init-Data":
            initData(),
    };

    const response = await fetch(
        url,
        {
            ...options,
            headers: {
                ...headers,
                ...(options.headers || {}),
            },
        }
    );

    const data =
        await response.json();

    if (!response.ok) {

        throw new Error(
            data.error ||
            "خطا در ارتباط با سرور"
        );
    }

    return data;
}


function showMessage(
    text
) {

    const box =
        document.getElementById(
            "message"
        );

    box.textContent = text;

    box.classList.add(
        "show"
    );

    setTimeout(
        () => {
            box.classList.remove(
                "show"
            );
        },
        2500
    );
}


function suitName(
    suit
) {

    if (!suit) {
        return "انتخاب نشده";
    }

    if (suit === "♥") {
        return "♥ دل";
    }

    if (suit === "♦") {
        return "♦ خشت";
    }

    if (suit === "♣") {
        return "♣ گشنیز";
    }

    if (suit === "♠") {
        return "♠ پیک";
    }

    return suit;
}


function render() {

    if (!game) {
        return;
    }


    document.getElementById(
        "status"
    ).textContent =
        game.status_text ||
        "در حال بازی";


    document.getElementById(
        "hakim"
    ).textContent =
        game.hakim_name ||
        "-";


    document.getElementById(
        "hokm"
    ).textContent =
        suitName(
            game.hokm
        );


    document.getElementById(
        "centerHokm"
    ).textContent =
        game.hokm || "؟";


    document.getElementById(
        "turn"
    ).textContent =
        game.current_player_name ||
        "-";


    renderSeats();

    renderTrick();

    renderHand();


    const start =
        document.getElementById(
            "startBtn"
        );

    if (
        !game.started &&
        game.viewer_id === game.creator_id
    ) {

        start.style.display =
            "block";

    } else {

        start.style.display =
            "none";
    }


    const modal =
        document.getElementById(
            "hokmModal"
        );


    if (
        game.started &&
        game.phase === "choose_hokm" &&
        game.hakim_id === game.viewer_id
    ) {

        modal.classList.add(
            "show"
        );

    } else {

        modal.classList.remove(
            "show"
        );
    }

}


function renderSeats() {

    const players =
        game.players || [];


    /*
        بازیکن خودمان پایین میز است.
        بقیه به صورت نسبی اطراف میز قرار می‌گیرند.
    */

    const meIndex =
        players.findIndex(
            p =>
                p.id === game.viewer_id
        );


    let ordered = [];


    if (meIndex >= 0) {

        for (
            let i = 0;
            i < players.length;
            i++
        ) {

            ordered.push(
                players[
                    (meIndex + i)
                    % players.length
                ]
            );

        }

    } else {

        ordered = players;
    }


    for (
        let i = 0;
        i < 4;
        i++
    ) {

        const seat =
            document.getElementById(
                `seat${i}`
            );

        const player =
            ordered[i];


        if (!player) {

            seat.innerHTML =
                `
                <div class="player-name">
                    صندلی خالی
                </div>
                `;

            seat.className =
                `seat ${
                    [
                        "seat-bottom",
                        "seat-left",
                        "seat-top",
                        "seat-right"
                    ][i]
                }`;

            continue;
        }


        let badges = "";


        if (player.is_hakim) {

            badges +=
                `
                <span class="badge hakim-badge">
                    👑 حاکم
                </span>
                `;
        }


        if (player.is_turn) {

            badges +=
                `
                <span class="badge turn-badge">
                    🎯 نوبت
                </span>
                `;
        }


        if (
            player.id === game.viewer_id
        ) {

            badges +=
                `
                <span class="badge">
                    شما
                </span>
                `;
        }


        seat.innerHTML =
            `
            <div class="player-name">
                ${escapeHtml(player.name)}
            </div>

            <div class="badges">
                ${badges}
            </div>

            <div class="card-count">
                🃏 ${player.card_count} کارت
                · 🏆 ${player.tricks} دست
            </div>
            `;


        let position =
            [
                "seat-bottom",
                "seat-left",
                "seat-top",
                "seat-right"
            ][i];


        seat.className =
            `seat ${position}`;


        if (
            player.is_turn
        ) {

            seat.classList.add(
                "turn"
            );
        }


        if (
            player.is_hakim
        ) {

            seat.classList.add(
                "hakim"
            );
        }


        if (
            player.id === game.viewer_id
        ) {

            seat.classList.add(
                "you"
            );
        }

    }

}


function renderTrick() {

    const box =
        document.getElementById(
            "trick"
        );

    box.innerHTML = "";


    const trick =
        game.current_trick || [];


    trick.forEach(
        item => {

            const card =
                item.card;


            const el =
                document.createElement(
                    "div"
                );


            el.className =
                "played-card";


            if (
                card.suit === "♥" ||
                card.suit === "♦"
            ) {

                el.classList.add(
                    "red"
                );
            }


            el.innerHTML =
                `
                <div class="rank">
                    ${card.label}
                </div>

                <div class="suit">
                    ${card.suit}
                </div>
                `;


            box.appendChild(
                el
            );

        }
    );

}


function renderHand() {

    const hand =
        document.getElementById(
            "hand"
        );

    hand.innerHTML = "";


    const me =
        game.players.find(
            p =>
                p.id === game.viewer_id
        );


    if (!me) {
        return;
    }


    const cards =
        me.cards || [];


    const legal =
        new Set();


    if (
        game.phase === "playing" &&
        game.current_player_id === game.viewer_id
    ) {

        cards.forEach(
            card => {

                if (
                    isLegalCard(card)
                ) {

                    legal.add(
                        `${card.suit}_${card.rank}`
                    );
                }

            }
        );

    }


    cards.sort(
        (a, b) => {

            const suitA =
                ["♥", "♦", "♣", "♠"]
                .indexOf(a.suit);

            const suitB =
                ["♥", "♦", "♣", "♠"]
                .indexOf(b.suit);

            if (
                suitA !== suitB
            ) {

                return suitA - suitB;
            }

            return b.rank - a.rank;
        }
    );


    cards.forEach(
        card => {

            const button =
                document.createElement(
                    "button"
                );


            button.className =
                "card";


            if (
                card.suit === "♥" ||
                card.suit === "♦"
            ) {

                button.classList.add(
                    "red"
                );
            }


            const key =
                `${card.suit}_${card.rank}`;


            const canPlay =
                legal.has(
                    key
                );


            if (
                game.phase !== "playing" ||
                game.current_player_id !== game.viewer_id ||
                !canPlay
            ) {

                button.classList.add(
                    "disabled"
                );

            }


            button.innerHTML =
                `
                <span class="card-rank">
                    ${card.label}
                </span>

                <span class="card-suit">
                    ${card.suit}
                </span>
                `;


            button.onclick =
                () => {

                    if (
                        !canPlay
                    ) {

                        if (
                            game.current_player_id !== game.viewer_id
                        ) {

                            showMessage(
                                "🎯 الان نوبت شما نیست."
                            );

                        } else if (
                            game.lead_suit &&
                            !cardHasSuit(card)
                        ) {

                            showMessage(
                                "باید از خال شروع‌شده بازی کنید."
                            );

                        }

                        return;
                    }


                    playCard(
                        card
                    );

                };


            hand.appendChild(
                button
            );

        }
    );

}


function cardHasSuit(
    card
) {

    const me =
        game.players.find(
            p =>
                p.id === game.viewer_id
        );


    if (!me) {
        return false;
    }


    return me.cards.some(
        c =>
            c.suit === game.lead_suit
    );
}


function isLegalCard(
    card
) {

    if (
        !game.current_trick ||
        game.current_trick.length === 0
    ) {

        return true;
    }


    if (!game.lead_suit) {
        return true;
    }


    const me =
        game.players.find(
            p =>
                p.id === game.viewer_id
        );


    if (!me) {
        return false;
    }


    const hasLead =
        me.cards.some(
            c =>
                c.suit === game.lead_suit
        );


    if (!hasLead) {
        return true;
    }


    return (
        card.suit ===
        game.lead_suit
    );
}


async function startGame() {

    try {

        await api(
            `/api/game/${gameId}/start`,
            {
                method: "POST",
            }
        );

        await loadGame();

    } catch (error) {

        showMessage(
            error.message
        );

    }

}


async function chooseHokm(
    suit
) {

    try {

        await api(
            `/api/game/${gameId}/hokm`,
            {
                method: "POST",

                body: JSON.stringify({
                    suit: suit,
                }),
            }
        );


        document
            .getElementById(
                "hokmModal"
            )
            .classList.remove(
                "show"
            );


        await loadGame();


    } catch (error) {

        showMessage(
            error.message
        );

    }

}


async function playCard(
    card
) {

    try {

        await api(
            `/api/game/${gameId}/play`,
            {
                method: "POST",

                body: JSON.stringify({
                    suit: card.suit,
                    rank: card.rank,
                }),
            }
        );


        await loadGame();


    } catch (error) {

        showMessage(
            error.message
        );

    }

}


async function loadGame() {

    if (
        !gameId ||
        loading
    ) {

        return;
    }


    loading = true;


    try {

        game =
            await api(
                `/api/game/${gameId}`
            );


        render();


    } catch (error) {

        showMessage(
            error.message
        );


    } finally {

        loading = false;
    }

}


function escapeHtml(
    text
) {

    return String(text)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


loadGame();


setInterval(
    loadGame,
    1800
);

</script>
