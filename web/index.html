<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>حکم گرین‌دریم</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
    overflow-x:hidden;
    background:#08100d;
}

body{
    font-family:Tahoma,Arial,sans-serif;
    color:#fff;
}

button{
    font-family:inherit;
}

:root{
    --gold:#d5a63e;
    --gold2:#f1cb6c;
    --gold-dark:#8d6425;
    --green:#075b3b;
    --green2:#08764b;
    --panel:#101915;
    --panel2:#16221d;
    --muted:#a9b4ae;
    --red:#e33b3b;
}

/* ---------- PAGE ---------- */

.page{
    width:100%;
    max-width:620px;
    min-height:100vh;
    margin:0 auto;
    padding:0 9px 12px;

    background:
        radial-gradient(
            circle at 50% 28%,
            rgba(16,108,70,.22),
            transparent 42%
        ),
        linear-gradient(#0c1411,#07100d 75%);
}

/* ---------- GAME HUD ---------- */

.game-head{
    height:92px;
    padding:9px 5px 6px;

    display:grid;
    grid-template-columns:58px 1fr 58px;
    align-items:center;
    gap:5px;
}

.head-side{
    display:flex;
    justify-content:center;
}

.icon-btn{
    width:43px;
    height:43px;
    border-radius:50%;
    border:1px solid rgba(226,191,103,.5);

    background:
        linear-gradient(145deg,#1c2822,#0d1512);

    color:#d9c07d;

    box-shadow:
        0 4px 12px rgba(0,0,0,.28),
        inset 0 1px rgba(255,255,255,.08);

    font-size:19px;
    cursor:pointer;
}

.game-title{
    text-align:center;
    line-height:1.05;
}

.game-title strong{
    display:block;
    font-size:23px;
    font-weight:900;
    letter-spacing:-.5px;
}

.game-title span{
    display:block;
    margin-top:5px;
    color:#c5cbc8;
    font-size:12px;
}

.round-pill{
    display:inline-flex;
    margin-top:7px;
    padding:4px 12px;
    border-radius:14px;

    background:#111a16;
    border:1px solid rgba(255,255,255,.08);

    color:#d8dedb;
    font-size:10px;
}

/* ---------- SCORE HUD ---------- */

.score-row{
    display:grid;
    grid-template-columns:1fr auto 1fr;
    align-items:center;
    gap:8px;
    margin:0 7px 8px;
}

.score-box{
    min-height:43px;
    padding:6px 10px;
    border-radius:15px;

    background:
        linear-gradient(145deg,#19231f,#101713);

    border:1px solid rgba(255,255,255,.07);

    box-shadow:0 5px 14px rgba(0,0,0,.2);

    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;

    font-size:11px;
}

.score-box .score{
    color:var(--gold2);
    font-size:17px;
    font-weight:900;
}

.score-center{
    width:50px;
    height:30px;
    border-radius:15px;

    display:flex;
    align-items:center;
    justify-content:center;

    background:#1d2822;
    color:#d5ddd9;

    border:1px solid rgba(255,255,255,.07);

    font-size:10px;
}

/* ---------- TABLE ---------- */

.table{
    position:relative;
    width:100%;
    height:760px;

    border-radius:44px;
    border:6px solid var(--gold);

    background:
        radial-gradient(
            ellipse at 50% 48%,
            #16865a 0%,
            #0c6c47 43%,
            #075239 76%,
            #043827 100%
        );

    box-shadow:
        0 0 0 2px #6d4a19,
        0 0 0 5px rgba(237,195,90,.08),
        inset 0 0 0 2px rgba(247,211,120,.28),
        inset 0 0 70px rgba(0,0,0,.35),
        0 18px 45px rgba(0,0,0,.48);

    overflow:hidden;
}

.table:before{
    content:"";
    position:absolute;
    inset:12px;

    border-radius:34px;
    border:1px solid rgba(245,211,123,.16);

    box-shadow:
        inset 0 0 30px rgba(0,0,0,.13);

    pointer-events:none;
}

.table:after{
    content:"";
    position:absolute;
    inset:0;

    background:
        radial-gradient(
            circle at 50% 52%,
            rgba(255,255,255,.035),
            transparent 38%
        ),
        repeating-radial-gradient(
            ellipse at center,
            rgba(255,255,255,.012) 0 1px,
            transparent 1px 7px
        );

    opacity:.55;
    pointer-events:none;
}

/* ---------- TABLE TOP ---------- */

.table-top{
    position:absolute;
    top:13px;
    left:18px;
    right:18px;

    z-index:10;

    display:flex;
    justify-content:space-between;
    align-items:flex-start;
}

.hokm-pill{
    min-width:104px;
    padding:7px 12px;
    border-radius:20px;

    background:rgba(12,28,22,.8);
    border:1px solid rgba(255,255,255,.08);

    box-shadow:0 4px 12px rgba(0,0,0,.18);

    color:#ead79f;
    font-size:11px;
    text-align:center;
}

.hokm-pill b{
    color:#fff;
    font-size:18px;
    margin-left:4px;
}

.turn-pill{
    max-width:170px;
    padding:7px 12px;
    border-radius:20px;

    background:rgba(12,28,22,.8);
    border:1px solid rgba(255,255,255,.08);

    color:#e9eeeb;
    font-size:10px;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

/* ---------- SEATS ---------- */

.seat{
    position:absolute;
    z-index:12;

    display:flex;
    flex-direction:column;
    align-items:center;

    width:118px;

    transition:all .2s ease;
}

.seat.top{
    top:30px;
    left:50%;
    transform:translateX(-50%);
}

.seat.left{
    top:325px;
    left:12px;
}

.seat.right{
    top:325px;
    right:12px;
}

.seat.bottom{
    display:none;
}

.avatar{
    position:relative;

    width:66px;
    height:66px;
    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    background:
        radial-gradient(
            circle at 35% 30%,
            #6b7b77,
            #27332f 68%
        );

    border:3px solid #7dd2ae;

    box-shadow:
        0 0 0 2px rgba(0,0,0,.3),
        0 6px 16px rgba(0,0,0,.28);

    color:#fff;
    font-size:27px;
    font-weight:900;
}

.seat.top .avatar{
    border-color:var(--gold2);
}

.seat.turn .avatar{
    box-shadow:
        0 0 0 3px rgba(239,194,83,.2),
        0 0 20px rgba(239,194,83,.55),
        0 7px 18px rgba(0,0,0,.3);
}

.seat-name{
    max-width:112px;
    margin-top:7px;
    padding:5px 13px;
    border-radius:16px;

    background:rgba(10,25,19,.88);
    border:1px solid rgba(255,255,255,.06);

    box-shadow:0 4px 10px rgba(0,0,0,.18);

    color:#e8eee9;

    font-family:Georgia,serif;
    font-style:italic;
    font-weight:700;
    font-size:13px;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.seat-meta{
    margin-top:5px;
    padding:4px 9px;
    border-radius:13px;

    background:rgba(8,20,15,.72);

    color:#b8c1bc;
    font-size:9px;

    min-height:20px;
}

.crown{
    position:absolute;
    top:-15px;
    right:-11px;

    min-width:54px;
    padding:4px 8px;
    border-radius:13px;

    background:
        linear-gradient(145deg,#f1ca65,#b17c24);

    color:#251a08;

    font-size:9px;
    font-weight:900;

    box-shadow:0 4px 9px rgba(0,0,0,.28);

    border:1px solid #f5dc8c;
}

.empty-seat{
    opacity:.45;
}

/* ---------- CENTER ---------- */

.center{
    position:absolute;
    z-index:7;

    top:195px;
    left:50%;

    width:235px;
    height:300px;

    transform:translateX(-50%);
}

.trick-label{
    text-align:center;
    color:rgba(255,255,255,.45);
    font-size:9px;
    margin-bottom:5px;
}

.trick{
    position:relative;

    width:210px;
    height:205px;

    margin:auto;
}

.played{
    position:absolute;

    width:72px;
    height:101px;

    border-radius:9px;

    background:
        linear-gradient(
            145deg,
            #fff,
            #f1eee7 58%,
            #e7e2d8
        );

    border:1px solid #c9c3b8;

    color:#151515;

    box-shadow:
        0 8px 15px rgba(0,0,0,.36);

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    font-family:Arial,sans-serif;
    font-weight:900;

    transform-origin:center;
}

.played.red{
    color:#d42525;
}

.played .rank{
    font-size:25px;
    line-height:1;
    font-family:Georgia,serif;
}

.played .suit{
    font-size:30px;
    line-height:1;
    margin-top:7px;
}

.played.p1{
    top:0;
    left:71px;
    transform:rotate(-2deg);
}

.played.p2{
    top:52px;
    right:0;
    transform:rotate(5deg);
}

.played.p3{
    bottom:0;
    left:71px;
    transform:rotate(2deg);
}

.played.p4{
    top:52px;
    left:0;
    transform:rotate(-5deg);
}

.hokm-center{
    width:84px;
    margin:5px auto 0;
    padding:7px 10px;
    border-radius:20px;

    text-align:center;

    background:
        linear-gradient(145deg,#d7aa48,#976b24);

    border:1px solid #f0cf78;

    box-shadow:
        0 5px 14px rgba(0,0,0,.35);

    color:#fff;
    font-size:11px;
    font-weight:900;
}

.hokm-center.empty{
    opacity:.6;
}

/* ---------- TIMER ---------- */

.timer{
    position:absolute;

    left:18px;
    bottom:22px;

    z-index:12;

    min-width:112px;
    padding:8px 11px;
    border-radius:20px;

    background:rgba(9,26,20,.84);
    border:1px solid rgba(255,255,255,.08);

    color:#dce5e0;
    font-size:10px;
    text-align:center;
}

.timer b{
    color:var(--gold2);
    font-size:16px;
    margin-right:4px;
}

/* ---------- BOTTOM PLAYER STRIP ---------- */

.my-strip{
    display:flex;
    align-items:center;
    justify-content:space-between;

    gap:10px;

    margin:10px 15px 2px;

    min-height:58px;
}

.my-player{
    display:flex;
    align-items:center;
    gap:9px;
    direction:rtl;
}

.my-avatar{
    width:54px;
    height:54px;
    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    background:
        radial-gradient(
            circle at 35% 30%,
            #71807b,
            #27332e
        );

    border:3px solid #81d7b1;

    box-shadow:
        0 0 0 2px rgba(0,0,0,.25),
        0 5px 13px rgba(0,0,0,.3);

    font-size:23px;
}

.my-name{
    color:#79ddb5;

    font-family:Georgia,serif;
    font-style:italic;
    font-weight:700;

    font-size:18px;
}

.waiting{
    padding:9px 13px;
    border-radius:18px;

    background:#111a16;

    color:#c5cdc8;
    font-size:11px;

    border:1px solid rgba(255,255,255,.05);
}

/* =========================================================
   HAND - PROFESSIONAL PLAYING CARD FAN
   ========================================================= */

.hand-wrap{
    position:relative;

    height:175px;

    margin:0 -3px;

    overflow:visible;
}

.hand{
    position:absolute;

    left:50%;
    bottom:0;

    width:100%;
    height:170px;

    transform:translateX(-50%);

    display:flex;
    align-items:flex-end;
    justify-content:center;

    padding:0 4px;

    overflow:visible;

    direction:ltr;
}

/* ---------- CARD ---------- */

.card{
    position:relative;

    flex:0 0 clamp(52px,14vw,78px);

    width:clamp(52px,14vw,78px);
    height:clamp(76px,19vw,108px);

    /*
       هم‌پوشانی زیاد کارت‌ها
       برای شبیه شدن به دسته پاسور واقعی
    */
    margin-left:clamp(-28px,-5vw,-17px);

    border-radius:9px;

    border:1px solid #c7c3bb;

    background:
        linear-gradient(
            135deg,
            #ffffff 0%,
            #faf9f5 48%,
            #e8e5de 100%
        );

    color:#111;

    box-shadow:
        0 8px 15px rgba(0,0,0,.48),
        0 2px 4px rgba(0,0,0,.35),
        inset 0 0 0 1px rgba(255,255,255,.85);

    cursor:pointer;

    overflow:hidden;

    transform-origin:50% 115%;

    transition:
        transform .18s ease,
        box-shadow .18s ease,
        filter .18s ease;

    user-select:none;
}

.card:first-child{
    margin-left:0;
}

/* حاشیه داخلی کارت */

.card:before{
    content:"";

    position:absolute;

    inset:3px;

    border:1px solid rgba(170,165,155,.45);

    border-radius:6px;

    pointer-events:none;
}

/* کارت قرمز */

.card.red{
    color:#d21f2f;
}

/* ---------- CARD CORNERS ---------- */

.card-corner{
    position:absolute;

    left:6px;
    top:5px;

    width:20px;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-weight:900;

    line-height:.9;

    z-index:3;
}

.card-corner.bottom{
    left:auto;
    top:auto;

    right:6px;
    bottom:5px;

    transform:rotate(180deg);
}

.card-corner .rank{
    font-size:clamp(15px,4vw,21px);
}

.card-corner .mini-suit{
    margin-top:2px;
    font-size:clamp(11px,3vw,15px);
}

/* ---------- CENTER SUIT ---------- */

.card-center-suit{
    position:absolute;

    left:50%;
    top:53%;

    transform:translate(-50%,-50%);

    font-size:clamp(34px,9vw,52px);

    line-height:1;

    font-family:
        "Times New Roman",
        Georgia,
        serif;

    z-index:2;
}

/* =========================================================
   FAN
   ========================================================= */

.card:nth-child(1){
    transform:rotate(-20deg) translateY(14px);
    z-index:1;
}

.card:nth-child(2){
    transform:rotate(-17deg) translateY(10px);
    z-index:2;
}

.card:nth-child(3){
    transform:rotate(-14deg) translateY(6px);
    z-index:3;
}

.card:nth-child(4){
    transform:rotate(-11deg) translateY(3px);
    z-index:4;
}

.card:nth-child(5){
    transform:rotate(-8deg) translateY(0);
    z-index:5;
}

.card:nth-child(6){
    transform:rotate(-4deg) translateY(-3px);
    z-index:6;
}

.card:nth-child(7){
    transform:rotate(0deg) translateY(-5px);
    z-index:7;
}

.card:nth-child(8){
    transform:rotate(4deg) translateY(-3px);
    z-index:8;
}

.card:nth-child(9){
    transform:rotate(8deg) translateY(0);
    z-index:9;
}

.card:nth-child(10){
    transform:rotate(11deg) translateY(3px);
    z-index:10;
}

.card:nth-child(11){
    transform:rotate(14deg) translateY(6px);
    z-index:11;
}

.card:nth-child(12){
    transform:rotate(17deg) translateY(10px);
    z-index:12;
}

.card:nth-child(13){
    transform:rotate(20deg) translateY(14px);
    z-index:13;
}

/* ---------- SELECTED CARD ---------- */

.card.selected{
    transform:
        translateY(-30px)
        rotate(0deg)!important;

    z-index:100!important;

    box-shadow:
        0 18px 28px rgba(0,0,0,.62),
        0 0 0 2px var(--gold2),
        0 0 18px rgba(241,203,108,.3);
}

/* ---------- DISABLED CARD ---------- */

.card.disabled{
    opacity:.38;
    filter:saturate(.35) brightness(.9);
}

/* ---------- CONTROLS ---------- */

.controls{
    display:flex;
    justify-content:center;

    gap:8px;

    margin:2px 0 0;
}

.btn{
    border:1px solid rgba(255,255,255,.12);

    padding:9px 15px;

    border-radius:18px;

    color:#fff;

    background:
        linear-gradient(145deg,#1d2b24,#101814);

    box-shadow:
        0 5px 12px rgba(0,0,0,.28);

    font-size:10px;
    font-weight:800;

    cursor:pointer;
}

.btn.primary{
    background:
        linear-gradient(145deg,#d3a747,#8f6525);

    border-color:#ebca76;
}

.btn:active{
    transform:scale(.96);
}

/* ---------- MODAL / MESSAGE ---------- */

.modal{
    position:fixed;
    inset:0;

    z-index:1000;

    display:none;

    align-items:center;
    justify-content:center;

    padding:20px;

    background:rgba(0,0,0,.76);

    backdrop-filter:blur(4px);
}

.modal.show{
    display:flex;
}

.modal-box{
    width:min(340px,94vw);

    padding:22px;

    border-radius:25px;

    background:
        linear-gradient(145deg,#0b4f34,#0a6d45);

    border:2px solid var(--gold);

    box-shadow:
        0 18px 45px rgba(0,0,0,.65);

    text-align:center;
}

.modal-title{
    font-size:19px;
    font-weight:900;
    margin-bottom:7px;
}

.modal-subtitle{
    font-size:11px;
    color:#c7d1cc;
    margin-bottom:16px;
}

.suits{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:9px;
}

.suit-btn{
    min-height:64px;

    border-radius:16px;

    border:1px solid rgba(255,255,255,.12);

    background:rgba(0,0,0,.2);

    color:#fff;

    font-size:28px;

    cursor:pointer;
}

.suit-btn.red{
    color:#ff5555;
}

.message{
    position:fixed;

    left:50%;
    bottom:20px;

    transform:translateX(-50%);

    z-index:2000;

    max-width:90vw;

    padding:10px 16px;

    border-radius:16px;

    background:rgba(0,0,0,.88);

    color:#fff;

    font-size:11px;

    text-align:center;

    display:none;

    box-shadow:
        0 8px 25px rgba(0,0,0,.35);
}

.message.show{
    display:block;
}

/* =========================================================
   RESPONSIVE
   ========================================================= */

@media(max-width:480px){

    .page{
        padding-left:6px;
        padding-right:6px;
    }

    .game-head{
        height:82px;
        grid-template-columns:50px 1fr 50px;
    }

    .game-title strong{
        font-size:20px;
    }

    .icon-btn{
        width:39px;
        height:39px;
        font-size:17px;
    }

    .table{
        height:690px;
        border-width:5px;
        border-radius:37px;
    }

    .seat{
        width:104px;
    }

    .seat.left{
        left:5px;
        top:296px;
    }

    .seat.right{
        right:5px;
        top:296px;
    }

    .avatar{
        width:58px;
        height:58px;
        font-size:24px;
    }

    .seat-name{
        font-size:11px;
    }

    .center{
        top:190px;
        transform:
            translateX(-50%)
            scale(.9);
    }

    .timer{
        left:12px;
        bottom:17px;
    }

    .my-strip{
        margin-left:10px;
        margin-right:10px;
    }

    .hand-wrap{
        height:165px;
    }

    .hand{
        height:160px;
    }
}

/* ---------- SMALL PHONES ---------- */

@media(max-width:380px){

    .table{
        height:650px;
        border-width:4px;
    }

    .table-top{
        left:12px;
        right:12px;
    }

    .hokm-pill{
        min-width:88px;
        font-size:9px;
    }

    .turn-pill{
        max-width:125px;
        font-size:9px;
    }

    .seat.left,
    .seat.right{
        top:282px;
    }

    .center{
        top:178px;

        transform:
            translateX(-50%)
            scale(.8);
    }

    .hand-wrap{
        height:150px;
    }

    .hand{
        height:145px;
    }

    .card{
        width:45px;
        height:66px;
        margin-left:-17px;
    }
}
</style>
</head>

<body>

<div class="page">

    <!-- ================= GAME HEADER ================= -->

    <header class="game-head">

        <div class="head-side">
            <button
                class="icon-btn"
                onclick="tg && tg.close ? tg.close() : null"
            >×</button>
        </div>

        <div class="game-title">

            <strong>حکم</strong>

            <span>میز بازی گرین‌دریم</span>

            <span
                id="roundInfo"
                class="round-pill"
            >دست ۱</span>

        </div>

        <div class="head-side">

            <button
                class="icon-btn"
                onclick="showMessage('پنل بازی')"
            >⋯</button>

        </div>

    </header>

    <!-- ================= SCORE ================= -->

    <div class="score-row">

    <!-- ================= MY PLAYER ================= -->

    <div class="my-strip">

        >
            منتظر بازیکنان...
        </div>

        <div class="my-player">

            <div>

                <div
                    id="myName"
                    class="my-name"
                >
                    بازیکن

                <div

<!-- ================= HOKM MODAL ================= -->

<div
    id="hokmModal"
    class="modal"
>

    <div class="modal-box">

        <div class="modal-title">
            👑 انتخاب حکم

            یکی از خال‌ها را برای حکم انتخاب کنید
        </div>

            <button
                class="suit-btn red"
                onclick="chooseHokm('♥')"
            >
                ♥
            </button>

            <button
                class="suit-btn red"
                onclick="chooseHokm('♦')"
            >
                ♦
            </button>

            <button
                class="suit-btn"
                onclick="chooseHokm('♣')"
            >
                ♣
            </button>

            <button
                class="suit-btn"
                onclick="chooseHokm('♠')"
            >
                ♠
            </button>

        </div>

<!-- ================= MESSAGE ================= -->

<div
    id="message"
    class="message"
></div>

<script>

/* =========================================================
   TELEGRAM
   ========================================================= */

const tg =
    window.Telegram &&
    window.Telegram.WebApp
        ? window.Telegram.WebApp
        : null;

if(tg){

    tg.ready();

    tg.expand();

}

/* =========================================================
   GAME PARAMS
   ========================================================= */

const params =
    new URLSearchParams(
        window.location.search
    );

const gameId =
    params.get("game") ||
    params.get("game_id");

let currentState = null;

let messageTimer = null;

/* =========================================================
   API HEADERS
   ========================================================= */

function headers(){

    const result = {
        "Content-Type":"application/json"
    };

    if(tg && tg.initData){

        result["X-Telegram-Init-Data"] =
            tg.initData;

    }

    return result;
}

/* =========================================================
   API
   ========================================================= */

async function api(
    url,
    options={}
){

    const response =
        await fetch(
            url,
            {
                ...options,

                headers:{
                    ...headers(),
                    ...(options.headers||{})
                }
            }
        );

    let data={};

    try{

        data =
            await response.json();

    }catch{}

    if(!response.ok){

        throw new Error(
            data.error ||
            "خطا در ارتباط با سرور"
        );

    }

    return data;
}

/* =========================================================
   MESSAGE
   ========================================================= */

function showMessage(text){

    const box =
        document.getElementById(
            "message"
        );

    box.textContent = text;

    box.classList.add("show");

    clearTimeout(messageTimer);

    messageTimer =
        setTimeout(
            () =>
                box.classList.remove(
                    "show"
                ),
            2600
        );
}

/* =========================================================
   ESCAPE HTML
   ========================================================= */

function escapeHtml(value){

    return String(
        value ?? ""
    )
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

/* =========================================================
   CARD HELPERS
   ========================================================= */

function cardIsRed(suit){

    return (
        suit==="♥" ||
        suit==="♦"
    );

}

function initials(name){

    const s =
        String(
            name||"؟"
        ).trim();

    return s
        ? s.slice(0,1).toUpperCase()
        : "؟";
}

/* =========================================================
   SCORE
   ========================================================= */

function setScoreUI(state){

    const a =
        state.team_a_score ??
        state.score_a ??
        state.our_score ??
        0;

    const b =
        state.team_b_score ??
        state.score_b ??
        state.opponent_score ??
        0;

    document.getElementById(
        "teamAScore"
    ).textContent = a;

    document.getElementById(
        "teamBScore"
    ).textContent = b;

    if(state.team_a_name){

        document.getElementById(
            "teamAName"
        ).textContent =
            state.team_a_name;

    }

    if(state.team_b_name){

        document.getElementById(
            "teamBName"
        ).textContent =
            state.team_b_name;

    }

    if(state.round != null){

        document.getElementById(
            "roundInfo"
        ).textContent =
            "دست " + state.round;

    }

}

/* =========================================================
   LOAD GAME
   ========================================================= */

async function loadGame(){

    if(!gameId){

        document.getElementById(
            "turnInfo"
        ).textContent =
            "❌ شناسه بازی پیدا نشد";

        return;
    }

    try{

        const state =
            await api(
                `/api/game/${gameId}`
            );

        currentState = state;

        render(state);

    }catch(error){

        document.getElementById(
            "turnInfo"
        ).textContent =
            "❌ " + error.message;

    }

}

/* =========================================================
   RENDER
   ========================================================= */

function render(state){

    setScoreUI(state);

    document.getElementById(
        "turnInfo"
    ).textContent =

        state.current_player_name

            ? "🎯 نوبت: " +
              state.current_player_name

            : (
                state.status_text ||
                "در حال بازی"
            );

    const hokm =
        state.hokm || "—";

    document.getElementById(
        "hokmInfo"
    ).innerHTML =
        `حکم: <b>${escapeHtml(hokm)}</b>`;

    const hokmBox =
        document.getElementById(
            "hokmBox"
        );

    if(state.hokm){

        hokmBox.textContent =
            "حکم " + state.hokm;

        hokmBox.classList.remove(
            "empty"
        );

    }else{

        hokmBox.textContent =
            "حکم —";

        hokmBox.classList.add(
            "empty"
        );

    }

    renderSeats(state);

    renderTrick(state);

    renderHand(state);

    const startBtn =
        document.getElementById(
            "startBtn"
        );

    if(state.started){

        startBtn.style.display =
            "none";

    }else{

        startBtn.style.display =
            Number(state.viewer_id) ===
            Number(state.creator_id)

                ? "inline-block"

                : "none";

    }

    document
        .getElementById("hokmModal")
        .classList.toggle(
            "show",

            state.phase ===
                "choose_hokm" &&

            Number(state.viewer_id) ===
            Number(state.hakim_id)
        );

}

/* =========================================================
   SEAT
   ========================================================= */

function updateSeat(
    seat,
    player
){

    seat.classList.remove(
        "turn",
        "empty-seat"
    );

    const avatar =
        seat.querySelector(
            ".avatar"
        );

    const name =
        seat.querySelector(
            ".seat-name"
        );

    const meta =
        seat.querySelector(
            ".seat-meta"
        );

    seat
        .querySelector(".crown")
        ?.remove();

    if(!player){

        seat.classList.add(
            "empty-seat"
        );

        avatar.textContent = "•";

        name.textContent =
            "صندلی خالی";

        meta.textContent = "";

        return;
    }

    avatar.textContent =
        player.avatar ||
        initials(player.name);

    name.textContent =
        player.name ||
        "بازیکن";

    let metaText=[];

    if(player.is_turn){

        seat.classList.add(
            "turn"
        );

        metaText.push(
            "🎯 نوبت"
        );

    }

    if(player.is_bot){

        metaText.push(
            "🤖 کامپیوتر"
        );

    }

    meta.textContent =
        metaText.join(" • ") ||
        "در بازی";

    if(player.is_hakim){

        const crown =
            document.createElement(
                "div"
            );

        crown.className =
            "crown";

        crown.textContent =
            "👑 حاکم";

        seat.appendChild(
            crown
        );

    }

}

/* =========================================================
   RENDER SEATS
   ========================================================= */

function renderSeats(state){

    const players =
        state.players || [];

    const me =
        players.find(
            p =>
                Number(p.id) ===
                Number(state.viewer_id)
        );

    const others =
        players.filter(
            p =>
                Number(p.id) !==
                Number(state.viewer_id)
        );

    updateSeat(
        document.getElementById(
            "seatTop"
        ),
        others[0]
    );

    updateSeat(
        document.getElementById(
            "seatRight"
        ),
        others[1]
    );

    updateSeat(
        document.getElementById(
            "seatLeft"
        ),
        others[2]
    );

    if(me){

        document.getElementById(
            "myName"
        ).textContent =
            me.name ||
            "بازیکن";

        document.getElementById(
            "myAvatar"
        ).textContent =
            me.avatar ||
            initials(me.name);

        let info =
            state.status_text ||
            "دست شما";

        if(me.is_turn){

            info =
                "🎯 نوبت شما";

        }

        if(me.is_hakim){

            info +=
                " • 👑 حاکم";

        }

        document.getElementById(
            "bottomInfo"
        ).textContent =
            info;

        document.getElementById(
            "waiting"
        ).textContent =

            me.is_turn

                ? "نوبت شماست"

                : (
                    state.status_text ||
                    "منتظر نوبت..."
                );

    }

}

/* =========================================================
   RENDER TRICK
   ========================================================= */

function renderTrick(state){

    const trick =
        document.getElementById(
            "trick"
        );

    trick.innerHTML = "";

    const cards =
        state.current_trick || [];

    cards.forEach(
        (item,index)=>{

            const card =
                item.card;

            if(!card)return;

            const div =
                document.createElement(
                    "div"
                );

            div.className =
                "played " +
                (
                    cardIsRed(
                        card.suit
                    )
                        ? "red "
                        : ""
                ) +
                "p" +
                (index+1);

            div.innerHTML =

                `<div class="rank">
                    ${escapeHtml(card.label)}
                 </div>
                 <div class="suit">
                    ${escapeHtml(card.suit)}
                 </div>`;

            trick.appendChild(
                div
            );

        }
    );

}

/* =========================================================
   RENDER HAND
   ========================================================= */

function renderHand(state){

    const hand =
        document.getElementById(
            "hand"
        );

    hand.innerHTML = "";

    const me =
        (state.players||[])
        .find(
            p =>
                Number(p.id) ===
                Number(state.viewer_id)
        );

    if(!me)return;

    const cards =
        me.cards || [];

    const canPlay =
        state.phase === "playing" &&
        Number(
            state.current_player_id
        ) ===
        Number(
            state.viewer_id
        );

    let legal=[];

    if(canPlay){

        const trick =
            state.current_trick || [];

        const lead =
            state.lead_suit;

        if(
            trick.length === 0 ||
            !lead
        ){

            legal = cards;

        }else{

            const sameSuit =
                cards.filter(
                    card =>
                        card.suit ===
                        lead
                );

            legal =
                sameSuit.length
                    ? sameSuit
                    : cards;

        }

    }

    cards.forEach(
        card=>{

            const div =
                document.createElement(
                    "div"
                );

            const legalCard =
                legal.some(
                    item =>
                        item.suit ===
                            card.suit &&
                        Number(item.rank) ===
                            Number(card.rank)
                );

            div.className =
                "card " +

                (
                    cardIsRed(
                        card.suit
                    )
                        ? "red "
                        : ""
                ) +

                (
                    canPlay &&
                    !legalCard
                        ? "disabled"
                        : ""
                );

            const rank =
                escapeHtml(
                    card.label
                );

            const suit =
                escapeHtml(
                    card.suit
                );

            div.innerHTML =

                `<div class="card-corner top">

                    <span class="rank">
                        ${rank}
                    </span>

                    <span class="mini-suit">
                        ${suit}
                    </span>

                </div>

                <div class="card-center-suit">
                    ${suit}
                </div>

                <div class="card-corner bottom">

                    <span class="rank">
                        ${rank}
                    </span>

                    <span class="mini-suit">
                        ${suit}
                    </span>

                </div>`;

            if(
                canPlay &&
                legalCard
            ){

                div.onclick =
                    () =>
                        playCard(
                            card.suit,
                            card.rank,
                            div
                        );

            }

            hand.appendChild(
                div
            );

        }
    );

}

/* =========================================================
   START GAME
   ========================================================= */

async function startGame(){

    if(!gameId)return;

    try{

        await api(
            `/api/game/${gameId}/start`,
            {
                method:"POST"
            }
        );

        await loadGame();

    }catch(error){

        showMessage(
            error.message
        );

    }

}

/* =========================================================
   CHOOSE HOKM
   ========================================================= */

async function chooseHokm(
    suit
){

    if(!gameId)return;

    try{

        document
            .getElementById(
                "hokmModal"
            )
            .classList.remove(
                "show"
            );

        await api(
            `/api/game/${gameId}/hokm`,
            {
                method:"POST",

                body:
                    JSON.stringify({
                        suit
                    })
            }
        );

        await loadGame();

    }catch(error){

        showMessage(
            error.message
        );

    }

}

/* =========================================================
   PLAY CARD
   ========================================================= */

async function playCard(
    suit,
    rank,
    element
){

    if(
        !currentState ||
        currentState.phase !==
            "playing"
    ){

        return;
    }

    if(
        Number(
            currentState.current_player_id
        ) !==
        Number(
            currentState.viewer_id
        )
    ){

        showMessage(
            "الان نوبت شما نیست."
        );

        return;
    }

    element.classList.add(
        "selected"
    );

    try{

        await api(
            `/api/game/${gameId}/play`,
            {
                method:"POST",

                body:
                    JSON.stringify({
                        suit,
                        rank
                    })
            }
        );

        await loadGame();

    }catch(error){

        element.classList.remove(
            "selected"
        );

        showMessage(
            error.message
        );

    }

}

/* =========================================================
   INITIAL LOAD
   ========================================================= */

loadGame();

/* =========================================================
   AUTO REFRESH
   ========================================================= */

setInterval(
    loadGame,
    1800
);

</script>
