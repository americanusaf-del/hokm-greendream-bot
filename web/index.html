<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>حکم گرین‌دریم</title>

    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background:
                radial-gradient(circle at top, #19713f 0%, #0d4428 45%, #062619 100%);
            color: white;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Tahoma,
                sans-serif;
            overflow-x: hidden;
        }

        button {
            font-family: inherit;
        }

        .app {
            width: 100%;
            max-width: 900px;
            min-height: 100vh;
            margin: auto;
            padding: 10px;
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 8px;
        }

        .logo {
            font-size: 20px;
            font-weight: 900;
        }

        .game-id {
            background: rgba(0,0,0,.25);
            padding: 6px 10px;
            border-radius: 999px;
            font-size: 11px;
            color: #e8f7ed;
        }

        .status {
            text-align: center;
            padding: 8px 12px;
            margin-bottom: 8px;
            border-radius: 12px;
            background: rgba(0,0,0,.22);
            font-size: 14px;
            min-height: 38px;
        }

        .status.error {
            background: rgba(160,20,20,.55);
        }

        .status.success {
            background: rgba(20,130,70,.55);
        }

        .room-panel {
            background: rgba(0,0,0,.25);
            border: 1px solid rgba(255,255,255,.1);
            border-radius: 18px;
            padding: 12px;
            margin-bottom: 10px;
        }

        .room-title {
            font-weight: 900;
            margin-bottom: 8px;
        }

        .players {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
        }

        .player {
            background: rgba(255,255,255,.08);
            border-radius: 12px;
            padding: 8px 5px;
            text-align: center;
            min-height: 68px;
            border: 1px solid transparent;
        }

        .player.me {
            border-color: #e5bd5a;
        }

        .player.turn {
            box-shadow:
                0 0 0 2px #e5bd5a,
                0 0 15px rgba(229,189,90,.35);
        }

        .player-avatar {
            font-size: 24px;
        }

        .player-name {
            font-size: 11px;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        .player-info {
            font-size: 9px;
            opacity: .7;
            margin-top: 2px;
        }

        .actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 10px;
        }

        .btn {
            border: 0;
            border-radius: 12px;
            padding: 11px 15px;
            font-weight: 900;
            cursor: pointer;
            background: #d9ad43;
            color: #1d1606;
            flex: 1;
            min-width: 130px;
        }

        .btn:disabled {
            opacity: .45;
            cursor: default;
        }

        .btn.secondary {
            background: rgba(255,255,255,.12);
            color: white;
        }

        .table {
            position: relative;
            width: 100%;
            aspect-ratio: 1.45 / 1;
            min-height: 390px;
            border-radius: 42%;
            background:
                radial-gradient(
                    ellipse at center,
                    #17804a 0%,
                    #0e5d35 55%,
                    #093c24 100%
                );
            border: 13px solid #c69a42;
            box-shadow:
                inset 0 0 0 5px #76551e,
                inset 0 0 40px rgba(0,0,0,.45),
                0 15px 35px rgba(0,0,0,.35);
            overflow: hidden;
        }

        .table::after {
            content: "";
            position: absolute;
            inset: 15px;
            border: 1px solid rgba(255,255,255,.08);
            border-radius: 42%;
            pointer-events: none;
        }

        .center-info {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 2;
            pointer-events: none;
        }

        .hokm-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 65px;
            height: 40px;
            padding: 0 12px;
            border-radius: 999px;
            background: rgba(0,0,0,.35);
            border: 1px solid rgba(255,255,255,.15);
            font-size: 22px;
            font-weight: 900;
        }

        .turn-text {
            margin-top: 7px;
            font-size: 11px;
            opacity: .8;
        }

        .played-card {
            position: absolute;
            width: 66px;
            height: 92px;
            border-radius: 9px;
            background: #fff;
            color: #171717;
            box-shadow: 0 5px 12px rgba(0,0,0,.35);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            font-weight: 900;
            z-index: 5;
        }

        .played-card.red {
            color: #c92828;
        }

        .played-rank {
            font-size: 22px;
            line-height: 1;
        }

        .played-suit {
            font-size: 23px;
            line-height: 1;
        }

        .played-label {
            position: absolute;
            font-size: 9px;
            background: rgba(0,0,0,.5);
            color: white;
            padding: 3px 6px;
            border-radius: 999px;
            white-space: nowrap;
            bottom: -19px;
        }

        .played-card.pos-0 {
            top: 12%;
            left: 50%;
            transform: translateX(-50%);
        }

        .played-card.pos-1 {
            right: 12%;
            top: 50%;
            transform: translateY(-50%);
        }

        .played-card.pos-2 {
            bottom: 12%;
            left: 50%;
            transform: translateX(-50%);
        }

        .played-card.pos-3 {
            left: 12%;
            top: 50%;
            transform: translateY(-50%);
        }

        .hand-section {
            margin-top: 10px;
        }

        .hand-title {
            text-align: center;
            font-size: 12px;
            opacity: .8;
            margin-bottom: 4px;
        }

        .hand {
            position: relative;
            height: 135px;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            direction: ltr;
            overflow: visible;
        }

        .card {
            position: relative;
            width: 58px;
            height: 86px;
            margin-left: -15px;
            border-radius: 9px;
            background: #fff;
            color: #171717;
            border: 1px solid #ddd;
            box-shadow: 0 4px 10px rgba(0,0,0,.35);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition:
                transform .15s ease,
                margin .15s ease,
                opacity .15s ease;
            flex-shrink: 0;
        }

        .card:first-child {
            margin-left: 0;
        }

        .card.red {
            color: #c92828;
        }

        .card-rank {
            font-size: 18px;
            font-weight: 900;
            line-height: 1;
        }

        .card-suit {
            font-size: 21px;
            line-height: 1;
            margin-top: 3px;
        }

        .card.legal:hover,
        .card.legal:active {
            transform: translateY(-20px);
            z-index: 20;
        }

        .card.not-legal {
            opacity: .45;
        }

        .card.my-turn {
            box-shadow:
                0 0 0 2px #e4bd5a,
                0 4px 12px rgba(0,0,0,.4);
        }

        .scores {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 8px;
        }

        .score {
            background: rgba(0,0,0,.24);
            border-radius: 10px;
            padding: 6px 12px;
            font-size: 11px;
        }

        .hokm-panel {
            background: rgba(0,0,0,.3);
            border: 1px solid rgba(255,255,255,.12);
            border-radius: 16px;
            padding: 12px;
            margin-top: 10px;
            text-align: center;
        }

        .hokm-title {
            font-weight: 900;
            margin-bottom: 8px;
        }

        .suits {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        .suit-btn {
            border: 0;
            border-radius: 13px;
            padding: 12px 5px;
            background: #fff;
            font-size: 25px;
            cursor: pointer;
        }

        .suit-btn.red {
            color: #c92828;
        }

        .loading {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.55);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .loading.show {
            display: flex;
        }

        .loading-box {
            background: #103b25;
            border: 1px solid rgba(255,255,255,.15);
            border-radius: 16px;
            padding: 20px 30px;
            text-align: center;
        }

        @media (max-width: 600px) {
            .app {
                padding: 7px;
            }

            .table {
                min-height: 350px;
                border-width: 10px;
            }

            .players {
                grid-template-columns: repeat(4, 1fr);
            }

            .player {
                min-height: 62px;
            }

            .hand {
                height: 125px;
            }

            .card {
                width: 53px;
                height: 80px;
                margin-left: -18px;
            }

            .played-card {
                width: 58px;
                height: 82px;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <div class="topbar">
        <div class="logo">🎴 حکم گرین‌دریم</div>
        <div class="game-id" id="gameIdLabel">---</div>
    </div>

    <div id="status" class="status">
        در حال اتصال به بازی...
    </div>

    <div class="room-panel">

        <div class="room-title">
            👥 بازیکنان
        </div>

        <div id="players" class="players"></div>

        <div class="actions">

            <button
                id="startButton"
                class="btn"
                onclick="startGame()"
                style="display:none"
            >
                🎮 شروع بازی
            </button>

            <button
                id="refreshButton"
                class="btn secondary"
                onclick="loadGame()"
            >
                🔄 بروزرسانی
            </button>

        </div>

    </div>

    <div class="table">

        <div id="centerInfo" class="center-info">

            <div
                id="hokmBadge"
                class="hokm-badge"
            >
                حکم؟
            </div>

            <div
                id="turnText"
                class="turn-text"
            >
                منتظر بازی
            </div>

        </div>

        <div id="trickCards"></div>

    </div>

    <div
        id="hokmPanel"
        class="hokm-panel"
        style="display:none"
    >

        <div class="hokm-title">
            👑 حاکم، حکم را انتخاب کن
        </div>

        <div class="suits">

            <button
                class="suit-btn red"
                onclick="chooseHokm('♥')"
            >
                ♥
            </button>

            <button
                class="suit-btn red"
                onclick="chooseHokm('♦')"
            >
                ♦
            </button>

            <button
                class="suit-btn"
                onclick="chooseHokm('♣')"
            >
                ♣
            </button>

            <button
                class="suit-btn"
                onclick="chooseHokm('♠')"
            >
                ♠
            </button>

        </div>

    </div>

    <div class="hand-section">

        <div class="hand-title">
            🃏 کارت‌های شما
        </div>

        <div
            id="hand"
            class="hand"
        ></div>

    </div>

    <div
        id="scores"
        class="scores"
    ></div>

</div>

<div
    id="loading"
    class="loading"
>
    <div class="loading-box">
        <div>⏳</div>
        <div>لطفاً صبر کنید...</div>
    </div>
</div>

<script>

    const tg =
        window.Telegram &&
        window.Telegram.WebApp
            ? window.Telegram.WebApp
            : null;

    if (tg) {
        tg.ready();
        tg.expand();
    }

    let gameId = null;
    let game = null;
    let loading = false;

    function getTelegramInitData() {

        if (!tg) {
            return "";
        }

        return tg.initData || "";
    }

    function findGameId() {

        const params =
            new URLSearchParams(
                window.location.search
            );

        let id =
            params.get("game");

        if (id) {
            return id;
        }

        if (tg) {

            const startParam =
                tg.initDataUnsafe &&
                tg.initDataUnsafe.start_param;

            if (startParam) {
                return startParam;
            }
        }

        return null;
    }

    async function api(
        url,
        options = {}
    ) {

        const headers = {
            "Content-Type":
                "application/json",

            "X-Telegram-Init-Data":
                getTelegramInitData(),

            ...(options.headers || {})
        };

        const response =
            await fetch(
                url,
                {
                    ...options,
                    headers
                }
            );

        let data = null;

        try {

            data =
                await response.json();

        } catch (error) {

            data = {
                ok: false,
                error:
                    "پاسخ نامعتبر از سرور"
            };
        }

        if (!response.ok) {

            throw new Error(
                data.error ||
                "خطا در ارتباط با سرور"
            );
        }

        return data;
    }

    function setStatus(
        text,
        type = ""
    ) {

        const element =
            document.getElementById(
                "status"
            );

        element.textContent = text;

        element.className =
            "status " + type;
    }

    function showLoading(
        value
    ) {

        loading = value;

        const element =
            document.getElementById(
                "loading"
            );

        if (value) {

            element.classList.add(
                "show"
            );

        } else {

            element.classList.remove(
                "show"
            );
        }
    }

    async function loadGame(
        silent = false
    ) {

        if (!gameId) {

            setStatus(
                "شناسه بازی پیدا نشد.",
                "error"
            );

            return;
        }

        if (!silent) {
            showLoading(true);
        }

        try {

            const data =
                await api(
                    `/api/game/${gameId}`
                );

            game = data.game;

            renderGame();

        } catch (error) {

            setStatus(
                translateError(
                    error.message
                ),
                "error"
            );

        } finally {

            if (!silent) {
                showLoading(false);
            }
        }
    }

    function renderGame() {

        if (!game) {
            return;
        }

        document.getElementById(
            "gameIdLabel"
        ).textContent =
            game.id;

        renderPlayers();
        renderTable();
        renderHand();
        renderScores();
        renderStartButton();
        renderHokm();
        renderStatus();
    }

    function renderPlayers() {

        const container =
            document.getElementById(
                "players"
            );

        container.innerHTML = "";

        const avatars = [
            "👤",
            "🧑",
            "👨",
            "👩"
        ];

        for (
            let i = 0;
            i < game.players.length;
            i++
        ) {

            const player =
                game.players[i];

            const div =
                document.createElement(
                    "div"
                );

            div.className =
                "player";

            if (player.is_me) {
                div.classList.add(
                    "me"
                );
            }

            if (
                player.id ===
                game.current_player_id
            ) {

                div.classList.add(
                    "turn"
                );
            }

            let crown = "";

            if (player.is_hakim) {
                crown = " 👑";
            }

            div.innerHTML = `
                <div class="player-avatar">
                    ${avatars[
                        player.position % 4
                    ]}
                </div>

                <div class="player-name">
                    ${escapeHtml(
                        player.name
                    )}${crown}
                </div>

                <div class="player-info">
                    🃏 ${player.cards_count}
                    &nbsp; • &nbsp;
                    🏆 ${player.tricks_won}
                </div>
            `;

            container.appendChild(
                div
            );
        }
    }

    function renderTable() {

        const container =
            document.getElementById(
                "trickCards"
            );

        container.innerHTML = "";

        for (
            const item
            of game.current_trick
        ) {

            const card =
                item.card;

            const div =
                document.createElement(
                    "div"
                );

            div.className =
                "played-card " +
                "pos-" +
                item.player_position;

            if (
                card.suit === "♥" ||
                card.suit === "♦"
            ) {

                div.classList.add(
                    "red"
                );
            }

            const player =
                game.players.find(
                    p =>
                        p.id ===
                        item.player_id
                );

            const name =
                player
                    ? player.name
                    : "";

            div.innerHTML = `
                <div class="played-rank">
                    ${card.rank}
                </div>

                <div class="played-suit">
                    ${card.suit}
                </div>

                <div class="played-label">
                    ${escapeHtml(name)}
                </div>
            `;

            container.appendChild(
                div
            );
        }

        const badge =
            document.getElementById(
                "hokmBadge"
            );

        if (game.hokm) {

            badge.textContent =
                "حکم " +
                game.hokm;

        } else {

            badge.textContent =
                "حکم؟";
        }
    }

    function renderHand() {

        const container =
            document.getElementById(
                "hand"
            );

        container.innerHTML = "";

        const hand =
            game.my_hand || [];

        const isMyTurn =
            game.current_player_id ===
            game.my_user_id;

        let legalTexts = [];

        if (
            isMyTurn &&
            game.lead_suit
        ) {

            const sameSuit =
                hand.filter(
                    card =>
                        card.suit ===
                        game.lead_suit
                );

            if (
                sameSuit.length > 0
            ) {

                legalTexts =
                    sameSuit.map(
                        card =>
                            card.text
                    );

            } else {

                legalTexts =
                    hand.map(
                        card =>
                            card.text
                    );
            }

        } else {

            legalTexts =
                hand.map(
                    card =>
                        card.text
                );
        }

        hand.forEach(
            (
                card,
                index
            ) => {

                const button =
                    document.createElement(
                        "button"
                    );

                button.className =
                    "card";

                const legal =
                    isMyTurn &&
                    legalTexts.includes(
                        card.text
                    );

                if (legal) {

                    button.classList.add(
                        "legal"
                    );

                    button.onclick =
                        () =>
                            playCard(
                                card.text
                            );

                } else {

                    button.classList.add(
                        "not-legal"
                    );
                }

                if (isMyTurn) {

                    button.classList.add(
                        "my-turn"
                    );
                }

                if (
                    card.suit === "♥" ||
                    card.suit === "♦"
                ) {

                    button.classList.add(
                        "red"
                    );
                }

                button.style.zIndex =
                    index + 1;

                button.innerHTML = `
                    <div class="card-rank">
                        ${card.rank}
                    </div>

                    <div class="card-suit">
                        ${card.suit}
                    </div>
                `;

                container.appendChild(
                    button
                );
            }
        );
    }

    function renderScores() {

        const container =
            document.getElementById(
                "scores"
            );

        container.innerHTML = "";

        const score0 =
            game.team_scores &&
            game.team_scores[0]
                ? game.team_scores[0]
                : 0;

        const score1 =
            game.team_scores &&
            game.team_scores[1]
                ? game.team_scores[1]
                : 0;

        container.innerHTML = `
            <div class="score">
                تیم ۱:
                <strong>
                    ${score0}
                </strong>
            </div>

            <div class="score">
                تیم ۲:
                <strong>
                    ${score1}
                </strong>
            </div>
        `;
    }

    function renderStartButton() {

        const button =
            document.getElementById(
                "startButton"
            );

        const amCreator =
            game.creator_id ===
            game.my_user_id;

        if (
            !game.started &&
            amCreator
        ) {

            button.style.display =
                "block";

            button.disabled =
                game.players.length !==
                game.max_players;

        } else {

            button.style.display =
                "none";
        }
    }

    function renderHokm() {

        const panel =
            document.getElementById(
                "hokmPanel"
            );

        const isHakim =
            game.hakim_id ===
            game.my_user_id;

        if (
            game.started &&
            !game.finished &&
            !game.hokm &&
            isHakim
        ) {

            panel.style.display =
                "block";

        } else {

            panel.style.display =
                "none";
        }
    }

    function renderStatus() {

        const turnText =
            document.getElementById(
                "turnText"
            );

        if (!game.started) {

            setStatus(
                `منتظر شروع بازی هستیم — ${game.players.length} از ${game.max_players} بازیکن`,
                ""
            );

            turnText.textContent =
                "بازی هنوز شروع نشده";

            return;
        }

        if (game.finished) {

            if (
                game.winner_id ===
                game.my_user_id
            ) {

                setStatus(
                    "🏆 بازی تمام شد",
                    "success"
                );

            } else {

                setStatus(
                    "🏁 بازی تمام شد",
                    ""
                );
            }

            turnText.textContent =
                "بازی تمام شد";

            return;
        }

        if (!game.hokm) {

            if (
                game.hakim_id ===
                game.my_user_id
            ) {

                setStatus(
                    "👑 شما حاکم هستید؛ حکم را انتخاب کنید.",
                    ""
                );

            } else {

                setStatus(
                    "منتظر انتخاب حکم توسط حاکم...",
                    ""
                );
            }

            turnText.textContent =
                "انتخاب حکم";

            return;
        }

        if (
            game.current_player_id ===
            game.my_user_id
        ) {

            setStatus(
                "🎯 نوبت شماست؛ یک کارت انتخاب کنید.",
                "success"
            );

            turnText.textContent =
                "نوبت شماست";

        } else {

            const player =
                game.players.find(
                    p =>
                        p.id ===
                        game.current_player_id
                );

            const name =
                player
                    ? player.name
                    : "بازیکن";

            setStatus(
                `⏳ نوبت ${name} است...`,
                ""
            );

            turnText.textContent =
                `نوبت ${name}`;
        }
    }

    async function startGame() {

        if (!game) {
            return;
        }

        if (
            game.creator_id !==
            game.my_user_id
        ) {

            setStatus(
                "فقط سازنده بازی می‌تواند شروع کند.",
                "error"
            );

            return;
        }

        if (
            game.players.length !==
            game.max_players
        ) {

            setStatus(
                `برای شروع باید ${game.max_players} بازیکن حضور داشته باشند.`,
                "error"
            );

            return;
        }

        showLoading(true);

        try {

            await api(
                `/api/game/${gameId}/start`,
                {
                    method: "POST"
                }
            );

            await loadGame(true);

        } catch (error) {

            setStatus(
                translateError(
                    error.message
                ),
                "error"
            );

        } finally {

            showLoading(false);
        }
    }

    async function chooseHokm(
        suit
    ) {

        if (!game) {
            return;
        }

        if (
            game.hakim_id !==
            game.my_user_id
        ) {
            return;
        }

        showLoading(true);

        try {

            await api(
                `/api/game/${gameId}/hokm`,
                {
                    method: "POST",
                    body:
                        JSON.stringify({
                            suit
                        })
                }
            );

            await loadGame(true);

        } catch (error) {

            setStatus(
                translateError(
                    error.message
                ),
                "error"
            );

        } finally {

            showLoading(false);
        }
    }

    async function playCard(
        cardText
    ) {

        if (loading) {
            return;
        }

        if (!game) {
            return;
        }

        if (
            game.current_player_id !==
            game.my_user_id
        ) {
            return;
        }

        showLoading(true);

        try {

            await api(
                `/api/game/${gameId}/play`,
                {
                    method: "POST",
                    body:
                        JSON.stringify({
                            card:
                                cardText
                        })
                }
            );

            await loadGame(true);

        } catch (error) {

            setStatus(
                translateError(
                    error.message
                ),
                "error"
            );

        } finally {

            showLoading(false);
        }
    }

    function translateError(
        error
    ) {

        const messages = {

            game_not_found:
                "بازی پیدا نشد.",

            not_a_player:
                "شما بازیکن این بازی نیستید.",

            creator_only:
                "فقط سازنده بازی می‌تواند بازی را شروع کند.",

            wrong_count:
                "تعداد بازیکنان برای شروع کامل نیست.",

            already_started:
                "بازی قبلاً شروع شده.",

            not_started:
                "بازی هنوز شروع نشده.",

            finished:
                "این بازی تمام شده.",

            not_your_turn:
                "الان نوبت شما نیست.",

            hokm_not_selected:
                "هنوز حکم انتخاب نشده.",

            must_follow_suit:
                "اگر از این خال دارید، باید همان خال را بازی کنید.",

            card_not_in_hand:
                "این کارت در دست شما نیست.",

            invalid_card:
                "کارت انتخاب‌شده معتبر نیست.",

            card_missing:
                "کارت انتخاب نشده.",

            not_hakim:
                "فقط حاکم می‌تواند حکم را انتخاب کند."
        };

        return (
            messages[error] ||
            error ||
            "خطایی رخ داد."
        );
    }

    function escapeHtml(
        value
    ) {

        return String(value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    gameId =
        findGameId();

    if (!gameId) {

        setStatus(
            "شناسه بازی پیدا نشد.",
            "error"
        );

    } else {

        loadGame();

        setInterval(
            () =>
                loadGame(true),
            1000
        );
    }

</script>

</body>
</html>
