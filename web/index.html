<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>حکم گرین‌دریم</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            overflow-x: hidden;
        }

        body {
            font-family:
                Tahoma,
                Arial,
                sans-serif;

            background:
                radial-gradient(
                    circle at center,
                    #16834c 0%,
                    #0a6039 48%,
                    #04351f 100%
                );

            color: #fff;
        }

        button {
            font-family: inherit;
        }

        .page {
            width: 100%;
            max-width: 540px;
            min-height: 100vh;
            margin: 0 auto;
            padding: 7px;
            overflow-x: hidden;
        }

        /* =========================
           TABLE
        ========================= */

        .table {
            position: relative;

            width: 100%;
            min-height: 720px;

            overflow: hidden;

            border-radius: 28px;

            border: 4px solid #b88b3a;

            background:
                radial-gradient(
                    ellipse at center,
                    #16844d 0%,
                    #0c663d 45%,
                    #064027 100%
                );

            box-shadow:
                inset 0 0 0 2px #5c401d,
                inset 0 0 55px rgba(0,0,0,.38),
                0 10px 30px rgba(0,0,0,.45);
        }

        .table::before {
            content: "";

            position: absolute;

            inset: 12px;

            border-radius: 21px;

            border: 1px solid rgba(220,180,90,.2);

            pointer-events: none;
        }

        /* =========================
           TOP
        ========================= */

        .topbar {
            position: relative;
            z-index: 5;

            padding: 13px 12px 5px;

            text-align: center;
        }

        .title {
            font-size: 20px;
            font-weight: 900;

            text-shadow:
                0 2px 4px rgba(0,0,0,.45);
        }

        .subtitle {
            margin-top: 5px;

            font-size: 11px;

            opacity: .8;
        }

        .status {
            margin: 8px auto 0;

            width: fit-content;
            max-width: 94%;

            padding: 7px 13px;

            border-radius: 20px;

            background: rgba(0,0,0,.25);

            border: 1px solid rgba(255,255,255,.12);

            font-size: 12px;
        }

        /* =========================
           INFO
        ========================= */

        .info-row {
            position: relative;
            z-index: 5;

            display: flex;

            justify-content: center;

            gap: 7px;

            flex-wrap: wrap;

            padding: 4px 12px;
        }

        .info {
            padding: 5px 9px;

            border-radius: 14px;

            background: rgba(0,0,0,.22);

            border: 1px solid rgba(255,255,255,.1);

            font-size: 10px;
        }

        /* =========================
           SEATS
        ========================= */

        .seat {
            position: absolute;

            z-index: 4;

            width: 100px;

            min-height: 50px;

            padding: 6px 7px;

            border-radius: 13px;

            text-align: center;

            background:
                rgba(0,0,0,.27);

            border:
                1px solid rgba(255,255,255,.14);

            box-shadow:
                0 4px 12px rgba(0,0,0,.2);

            transition:
                transform .2s ease,
                border .2s ease,
                box-shadow .2s ease;
        }

        .seat.turn {
            border-color: #e3b94f;

            box-shadow:
                0 0 0 2px rgba(227,185,79,.18),
                0 0 18px rgba(227,185,79,.28);
        }

        .seat.you {
            background:
                rgba(20,100,60,.7);
        }

        .seat-name {
            white-space: nowrap;

            overflow: hidden;

            text-overflow: ellipsis;

            font-size: 11px;

            font-weight: 800;
        }

        .seat-status {
            margin-top: 3px;

            font-size: 9px;

            opacity: .85;
        }

        .seat-badge {
            display: inline-block;

            margin-top: 3px;

            padding: 2px 6px;

            border-radius: 8px;

            font-size: 8px;

            background: rgba(255,255,255,.12);
        }

        .seat.top {
            top: 116px;
            left: 50%;
            transform: translateX(-50%);
        }

        .seat.right {
            top: 300px;
            right: 10px;
        }

        .seat.left {
            top: 300px;
            left: 10px;
        }

        .seat.bottom {
            display: none;
        }

        /* =========================
           CENTER
        ========================= */

        .center {
            position: absolute;

            top: 205px;
            left: 50%;

            transform: translateX(-50%);

            width: 190px;
            height: 210px;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;
        }

        .hokm-box {
            min-width: 85px;

            padding: 7px 13px;

            border-radius: 18px;

            text-align: center;

            background:
                linear-gradient(
                    145deg,
                    #c79b43,
                    #8e6424
                );

            border: 1px solid #e5c16c;

            box-shadow:
                0 4px 12px rgba(0,0,0,.35);

            color: #fff;

            font-size: 12px;

            font-weight: 900;
        }

        .hokm-box.empty {
            opacity: .65;
        }

        .trick {
            position: relative;

            width: 160px;
            height: 145px;

            margin-top: 8px;
        }

        .played {
            position: absolute;

            width: 52px;
            height: 76px;

            border-radius: 8px;

            background:
                linear-gradient(
                    145deg,
                    #fff,
                    #f1eee6
                );

            border: 2px solid #d5d0c5;

            color: #171717;

            box-shadow:
                0 5px 12px rgba(0,0,0,.42);

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            font-weight: 900;
        }

        .played.red {
            color: #c52222;
        }

        .played .rank {
            font-size: 20px;
            line-height: 1;
        }

        .played .suit {
            margin-top: 4px;
            font-size: 20px;
            line-height: 1;
        }

        .played.p1 {
            top: 2px;
            left: 54px;
        }

        .played.p2 {
            top: 35px;
            right: 5px;
        }

        .played.p3 {
            bottom: 0;
            left: 54px;
        }

        .played.p4 {
            top: 35px;
            left: 5px;
        }

        /* =========================
           BOTTOM AREA
        ========================= */

        .bottom-area {
            position: absolute;

            left: 0;
            right: 0;
            bottom: 5px;

            z-index: 10;

            width: 100%;

            overflow: hidden;

            padding: 0 5px 9px;
        }

        .bottom-info {
            text-align: center;

            margin-bottom: 4px;

            font-size: 11px;

            font-weight: 800;
        }

        /* =========================
           HAND
        ========================= */

        .hand {
            position: relative;

            width: 100%;

            height: 124px;

            display: flex;

            justify-content: center;

            align-items: flex-end;

            overflow: visible;

            padding:
                0
                max(4px, 1vw);
        }

        /*
          مهم:
          کارت‌ها با فاصله منفی کنترل‌شده
          داخل عرض صفحه نگه داشته می‌شوند.
        */

        .card {
            position: relative;

            width: clamp(43px, 12.8vw, 57px);

            height: clamp(67px, 20vw, 88px);

            flex:
                0 1 auto;

            min-width: 0;

            margin-left:
                clamp(-15px, -3.5vw, -8px);

            border-radius: 9px;

            border:
                2px solid #d6d0c4;

            background:
                linear-gradient(
                    145deg,
                    #ffffff 0%,
                    #f8f6ef 60%,
                    #ebe7dd 100%
                );

            color: #171717;

            box-shadow:
                0 5px 10px rgba(0,0,0,.45),
                inset 0 0 0 1px #fff;

            cursor: pointer;

            transition:
                transform .18s ease,
                box-shadow .18s ease,
                filter .18s ease;

            z-index: 1;

            overflow: hidden;
        }

        .card:first-child {
            margin-left: 0;
        }

        .card::before {
            content: "";

            position: absolute;

            inset: 4px;

            border:
                1px solid #dfd9cd;

            border-radius: 5px;

            pointer-events: none;
        }

        .card.red {
            color: #c52222;
        }

        .card-rank {
            position: absolute;

            top: 5px;
            left: 6px;

            font-size:
                clamp(
                    14px,
                    4vw,
                    18px
                );

            line-height: 1;

            font-weight: 900;

            z-index: 2;
        }

        .card-suit {
            position: absolute;

            right: 5px;
            bottom: 5px;

            font-size:
                clamp(
                    16px,
                    4.5vw,
                    21px
                );

            line-height: 1;

            z-index: 2;
        }

        .card.selected {
            transform:
                translateY(-16px);

            z-index: 100;

            box-shadow:
                0 12px 20px rgba(0,0,0,.5),
                0 0 0 2px #e1b84f;
        }

        .card.disabled {
            opacity: .42;

            filter:
                saturate(.55)
                brightness(.9);
        }

        /* =========================
           BUTTONS
        ========================= */

        .controls {
            display: flex;

            justify-content: center;

            gap: 7px;

            margin-top: 5px;
        }

        .btn {
            border: 0;

            padding:
                8px 13px;

            border-radius: 17px;

            color: #fff;

            background:
                linear-gradient(
                    145deg,
                    #c69a45,
                    #8d6324
                );

            box-shadow:
                0 4px 10px rgba(0,0,0,.3);

            font-size: 11px;

            font-weight: 800;

            cursor: pointer;
        }

        .btn:active {
            transform: scale(.96);
        }

        .btn.secondary {
            background:
                rgba(0,0,0,.28);

            border:
                1px solid rgba(255,255,255,.15);
        }

        /* =========================
           HOKM MODAL
        ========================= */

        .modal {
            position: fixed;

            inset: 0;

            z-index: 1000;

            display: none;

            align-items: center;

            justify-content: center;

            padding: 20px;

            background:
                rgba(0,0,0,.72);
        }

        .modal.show {
            display: flex;
        }

        .modal-box {
            width: min(
                330px,
                94vw
            );

            padding: 20px;

            border-radius: 22px;

            background:
                linear-gradient(
                    145deg,
                    #07502f,
                    #0d7041
                );

            border:
                2px solid #b98b3b;

            box-shadow:
                0 15px 40px rgba(0,0,0,.6);

            text-align: center;
        }

        .modal-title {
            font-size: 18px;

            font-weight: 900;

            margin-bottom: 6px;
        }

        .modal-subtitle {
            font-size: 11px;

            opacity: .8;

            margin-bottom: 15px;
        }

        .suits {
            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 9px;
        }

        .suit-btn {
            min-height: 62px;

            border-radius: 15px;

            border:
                1px solid rgba(255,255,255,.15);

            background:
                rgba(0,0,0,.2);

            color: #fff;

            font-size: 25px;

            cursor: pointer;
        }

        .suit-btn.red {
            color: #ff5b5b;
        }

        /* =========================
           LOADING / ERROR
        ========================= */

        .message {
            position: fixed;

            left: 50%;
            bottom: 20px;

            transform:
                translateX(-50%);

            z-index: 2000;

            max-width: 90vw;

            padding:
                9px 15px;

            border-radius: 15px;

            background:
                rgba(0,0,0,.82);

            color: #fff;

            font-size: 11px;

            text-align: center;

            display: none;
        }

        .message.show {
            display: block;
        }

        /* =========================
           SMALL PHONES
        ========================= */

        @media (max-width: 380px) {

            .page {
                padding: 5px;
            }

            .table {
                min-height: 690px;

                border-width: 3px;

                border-radius: 24px;
            }

            .seat {
                width: 88px;
            }

            .seat.right {
                right: 6px;
            }

            .seat.left {
                left: 6px;
            }

            .center {
                width: 170px;
            }

            .trick {
                transform: scale(.92);
            }

            .hand {
                height: 112px;
            }

            .card {
                width: 42px;
                height: 68px;

                margin-left: -13px;
            }

            .card.selected {
                transform:
                    translateY(-13px);
            }
        }

        @media (max-width: 340px) {

            .seat {
                width: 78px;
            }

            .seat-name {
                font-size: 10px;
            }

            .card {
                width: 39px;
                height: 63px;

                margin-left: -12px;
            }

            .card-rank {
                top: 4px;
                left: 5px;

                font-size: 13px;
            }

            .card-suit {
                right: 4px;
                bottom: 4px;

                font-size: 15px;
            }

            .hand {
                height: 105px;
            }
        }
    </style>
</head>

<body>

<div class="page">

    <div class="table">

        <!-- TOP -->
        <div class="topbar">
            <div class="title">
                ♠️ حکم گرین‌دریم ♥️
            </div>

            <div class="subtitle">
                میز بازی آنلاین
            </div>

            <div
                id="status"
                class="status"
            >
                در حال دریافت وضعیت بازی...
            </div>
        </div>

        <!-- INFO -->
        <div class="info-row">

            <div
                id="hakimInfo"
                class="info"
            >
                👑 حاکم: -
            </div>

            <div
                id="hokmInfo"
                class="info"
            >
                🃏 حکم: -
            </div>

            <div
                id="turnInfo"
                class="info"
            >
                🎯 نوبت: -
            </div>

        </div>

        <!-- TOP PLAYER -->
        <div
            id="seatTop"
            class="seat top"
        >
            <div class="seat-name">
                -
            </div>

            <div class="seat-status">
                -
            </div>

            <div class="seat-badge">
                -
            </div>
        </div>

        <!-- LEFT PLAYER -->
        <div
            id="seatLeft"
            class="seat left"
        >
            <div class="seat-name">
                -
            </div>

            <div class="seat-status">
                -
            </div>

            <div class="seat-badge">
                -
            </div>
        </div>

        <!-- RIGHT PLAYER -->
        <div
            id="seatRight"
            class="seat right"
        >
            <div class="seat-name">
                -
            </div>

            <div class="seat-status">
                -
            </div>

            <div class="seat-badge">
                -
            </div>
        </div>

        <!-- CENTER -->
        <div class="center">

            <div
                id="hokmBox"
                class="hokm-box empty"
            >
                حکم: انتخاب نشده
            </div>

            <div
                id="trick"
                class="trick"
            >
            </div>

        </div>

        <!-- BOTTOM / MY HAND -->
        <div class="bottom-area">

            <div
                id="bottomInfo"
                class="bottom-info"
            >
                دست شما
            </div>

            <div
                id="hand"
                class="hand"
            >
            </div>

            <div class="controls">

                <button
                    id="startBtn"
                    class="btn"
                    onclick="startGame()"
                >
                    🎮 شروع بازی
                </button>

                <button
                    class="btn secondary"
                    onclick="loadGame()"
                >
                    🔄 بروزرسانی
                </button>

            </div>

        </div>

    </div>

</div>


<!-- HOKM MODAL -->

<div
    id="hokmModal"
    class="modal"
>

    <div class="modal-box">

        <div class="modal-title">
            👑 انتخاب حکم
        </div>

        <div class="modal-subtitle">
            یکی از خال‌ها را برای حکم انتخاب کنید
        </div>

        <div class="suits">

            <button
                class="suit-btn red"
                onclick="chooseHokm('♥')"
            >
                ♥
            </button>

            <button
                class="suit-btn red"
                onclick="chooseHokm('♦')"
            >
                ♦
            </button>

            <button
                class="suit-btn"
                onclick="chooseHokm('♣')"
            >
                ♣
            </button>

            <button
                class="suit-btn"
                onclick="chooseHokm('♠')"
            >
                ♠
            </button>

        </div>

    </div>

</div>


<div
    id="message"
    class="message"
>
</div>


<script>

    const tg =
        window.Telegram &&
        window.Telegram.WebApp
            ? window.Telegram.WebApp
            : null;

    if (tg) {
        tg.ready();
        tg.expand();
    }


    /* =========================
       GAME ID
    ========================= */

    const params =
        new URLSearchParams(
            window.location.search
        );

    const gameId =
        params.get("game") ||
        params.get("game_id");


    let currentState = null;


    /* =========================
       API
    ========================= */

    function headers() {

        const result = {
            "Content-Type":
                "application/json"
        };

        if (
            tg &&
            tg.initData
        ) {
            result[
                "X-Telegram-Init-Data"
            ] = tg.initData;
        }

        return result;
    }


    async function api(
        url,
        options = {}
    ) {

        const response =
            await fetch(
                url,
                {
                    ...options,
                    headers: {
                        ...headers(),
                        ...(options.headers || {})
                    }
                }
            );

        let data = null;

        try {
            data =
                await response.json();
        }
        catch {
            data = {};
        }

        if (!response.ok) {

            throw new Error(
                data.error ||
                "خطا در ارتباط با سرور"
            );
        }

        return data;
    }


    /* =========================
       MESSAGE
    ========================= */

    let messageTimer = null;


    function showMessage(
        text
    ) {

        const box =
            document.getElementById(
                "message"
            );

        box.textContent = text;

        box.classList.add(
            "show"
        );

        clearTimeout(
            messageTimer
        );

        messageTimer =
            setTimeout(
                () => {
                    box.classList.remove(
                        "show"
                    );
                },
                2600
            );
    }


    /* =========================
       HELPERS
    ========================= */

    function escapeHtml(
        value
    ) {

        return String(
            value ?? ""
        )
            .replace(
                /&/g,
                "&amp;"
            )
            .replace(
                /</g,
                "&lt;"
            )
            .replace(
                />/g,
                "&gt;"
            )
            .replace(
                /"/g,
                "&quot;"
            )
            .replace(
                /'/g,
                "&#039;"
            );
    }


    function cardIsRed(
        suit
    ) {

        return (
            suit === "♥" ||
            suit === "♦"
        );
    }


    /* =========================
       LOAD GAME
    ========================= */

    async function loadGame() {

        if (!gameId) {

            document.getElementById(
                "status"
            ).textContent =
                "❌ شناسه بازی پیدا نشد.";

            return;
        }

        try {

            const state =
                await api(
                    `/api/game/${gameId}`
                );

            currentState =
                state;

            render(
                state
            );

        }
        catch (error) {

            document.getElementById(
                "status"
            ).textContent =
                "❌ " +
                error.message;

        }
    }


    /* =========================
       RENDER
    ========================= */

    function render(
        state
    ) {

        document.getElementById(
            "status"
        ).textContent =
            state.status_text ||
            "در حال بازی";


        document.getElementById(
            "hakimInfo"
        ).textContent =
            "👑 حاکم: " +
            (
                state.hakim_name ||
                "-"
            );


        document.getElementById(
            "hokmInfo"
        ).textContent =
            "🃏 حکم: " +
            (
                state.hokm ||
                "-"
            );


        document.getElementById(
            "turnInfo"
        ).textContent =
            "🎯 نوبت: " +
            (
                state.current_player_name ||
                "-"
            );


        const hokmBox =
            document.getElementById(
                "hokmBox"
            );


        if (state.hokm) {

            hokmBox.textContent =
                "حکم: " +
                state.hokm;

            hokmBox.classList.remove(
                "empty"
            );

        }
        else {

            hokmBox.textContent =
                "حکم: انتخاب نشده";

            hokmBox.classList.add(
                "empty"
            );
        }


        renderSeats(
            state
        );


        renderTrick(
            state
        );


        renderHand(
            state
        );


        const startBtn =
            document.getElementById(
                "startBtn"
            );


        if (
            state.started
        ) {

            startBtn.style.display =
                "none";

        }
        else {

            if (
                Number(state.viewer_id) ===
                Number(state.creator_id)
            ) {

                startBtn.style.display =
                    "inline-block";

            }
            else {

                startBtn.style.display =
                    "none";
            }
        }


        /*
          اگر خودمان حاکم باشیم
          و هنوز حکم انتخاب نشده باشد،
          پنجره انتخاب حکم باز می‌شود.
        */

        if (
            state.phase ===
                "choose_hokm" &&
            Number(state.viewer_id) ===
                Number(state.hakim_id)
        ) {

            document
                .getElementById(
                    "hokmModal"
                )
                .classList.add(
                    "show"
                );

        }
        else {

            document
                .getElementById(
                    "hokmModal"
                )
                .classList.remove(
                    "show"
                );
        }


        document.getElementById(
            "bottomInfo"
        ).textContent =
            state.status_text ||
            "دست شما";
    }


    /* =========================
       SEATS
    ========================= */

    function renderSeats(
        state
    ) {

        const players =
            state.players || [];


        const seats = [
            document.getElementById(
                "seatTop"
            ),
            document.getElementById(
                "seatRight"
            ),
            document.getElementById(
                "seatLeft"
            )
        ];


        seats.forEach(
            seat => {
                seat.classList.remove(
                    "turn",
                    "you"
                );
            }
        );


        /*
          بازیکن خودمان را جدا می‌کنیم
          و بقیه را دور میز می‌چینیم.
        */

        const me =
            players.find(
                player =>
                    Number(player.id) ===
                    Number(state.viewer_id)
            );


        const others =
            players.filter(
                player =>
                    Number(player.id) !==
                    Number(state.viewer_id)
            );


        const ordered =
            [];


        if (others.length > 0) {
            ordered.push(
                others[0]
            );
        }

        if (others.length > 1) {
            ordered.push(
                others[1]
            );
        }

        if (others.length > 2) {
            ordered.push(
                others[2]
            );
        }


        seats.forEach(
            (seat, index) => {

                const player =
                    ordered[index];

                if (!player) {

                    seat.querySelector(
                        ".seat-name"
                    ).textContent =
                        "صندلی خالی";

                    seat.querySelector(
                        ".seat-status"
                    ).textContent =
                        "";

                    seat.querySelector(
                        ".seat-badge"
                    ).textContent =
                        "";

                    return;
                }


                seat.querySelector(
                    ".seat-name"
                ).textContent =
                    player.name;


                let status = "";

                if (
                    player.is_turn
                ) {

                    status =
                        "🎯 نوبت";

                    seat.classList.add(
                        "turn"
                    );
                }


                let badge = "";

                if (
                    player.is_hakim
                ) {

                    badge =
                        "👑 حاکم";
                }


                if (
                    player.is_bot
                ) {

                    badge +=
                        (
                            badge
                                ? " • "
                                : ""
                        ) +
                        "🤖 کامپیوتر";
                }


                seat.querySelector(
                    ".seat-status"
                ).textContent =
                    status;


                seat.querySelector(
                    ".seat-badge"
                ).textContent =
                    badge;
            }
        );


        /*
          اگر خودمان بازی هستیم،
          نام ما در پایین نمایش داده می‌شود.
        */

        if (me) {

            const bottom =
                document.getElementById(
                    "bottomInfo"
                );

            let text =
                "👤 " +
                me.name;

            if (
                me.is_turn
            ) {
                text +=
                    " • 🎯 نوبت شما";
            }

            if (
                me.is_hakim
            ) {
                text +=
                    " • 👑 حاکم";
            }

            bottom.textContent =
                text;
        }
    }


    /* =========================
       TRICK
    ========================= */

    function renderTrick(
        state
    ) {

        const trick =
            document.getElementById(
                "trick"
            );

        trick.innerHTML = "";


        const cards =
            state.current_trick ||
            [];


        cards.forEach(
            (item, index) => {

                const card =
                    item.card;

                if (!card) {
                    return;
                }


                const div =
                    document.createElement(
                        "div"
                    );

                div.className =
                    "played " +
                    (
                        cardIsRed(
                            card.suit
                        )
                            ? "red "
                            : ""
                    ) +
                    "p" +
                    (
                        index + 1
                    );


                div.innerHTML =
                    `
                    <div class="rank">
                        ${escapeHtml(card.label)}
                    </div>
                    <div class="suit">
                        ${escapeHtml(card.suit)}
                    </div>
                    `;


                trick.appendChild(
                    div
                );
            }
        );
    }


    /* =========================
       HAND
    ========================= */

    function renderHand(
        state
    ) {

        const hand =
            document.getElementById(
                "hand"
            );

        hand.innerHTML = "";


        const me =
            (state.players || [])
                .find(
                    player =>
                        Number(player.id) ===
                        Number(state.viewer_id)
                );


        if (!me) {
            return;
        }


        const cards =
            me.cards || [];


        const canPlay =
            state.phase ===
                "playing" &&
            Number(
                state.current_player_id
            ) ===
                Number(
                    state.viewer_id
                );


        /*
          کارت‌های قانونی را از سرور
          طبق قانون خال محاسبه می‌کنیم.
        */

        let legal = [];

        if (
            canPlay
        ) {

            const trick =
                state.current_trick ||
                [];

            const lead =
                state.lead_suit;


            if (
                trick.length === 0 ||
                !lead
            ) {

                legal =
                    cards;

            }
            else {

                const sameSuit =
                    cards.filter(
                        card =>
                            card.suit ===
                            lead
                    );

                legal =
                    sameSuit.length
                        ? sameSuit
                        : cards;
            }
        }


        cards.forEach(
            card => {

                const div =
                    document.createElement(
                        "div"
                    );


                const legalCard =
                    legal.some(
                        item =>
                            item.suit ===
                                card.suit &&
                            Number(
                                item.rank
                            ) ===
                                Number(
                                    card.rank
                                )
                    );


                div.className =
                    "card " +
                    (
                        cardIsRed(
                            card.suit
                        )
                            ? "red "
                            : ""
                    ) +
                    (
                        canPlay &&
                        !legalCard
                            ? "disabled"
                            : ""
                    );


                div.innerHTML =
                    `
                    <div class="card-rank">
                        ${escapeHtml(card.label)}
                    </div>

                    <div class="card-suit">
                        ${escapeHtml(card.suit)}
                    </div>
                    `;


                if (
                    canPlay &&
                    legalCard
                ) {

                    div.onclick =
                        () =>
                            playCard(
                                card.suit,
                                card.rank,
                                div
                            );
                }


                hand.appendChild(
                    div
                );
            }
        );
    }


    /* =========================
       START
    ========================= */

    async function startGame() {

        if (!gameId) {
            return;
        }

        try {

            await api(
                `/api/game/${gameId}/start`,
                {
                    method:
                        "POST"
                }
            );

            await loadGame();

        }
        catch (error) {

            showMessage(
                error.message
            );
        }
    }


    /* =========================
       HOKM
    ========================= */

    async function chooseHokm(
        suit
    ) {

        if (!gameId) {
            return;
        }


        try {

            document
                .getElementById(
                    "hokmModal"
                )
                .classList.remove(
                    "show"
                );


            await api(
                `/api/game/${gameId}/hokm`,
                {
                    method:
                        "POST",

                    body:
                        JSON.stringify(
                            {
                                suit:
                                    suit
                            }
                        )
                }
            );


            await loadGame();

        }
        catch (error) {

            showMessage(
                error.message
            );
        }
    }


    /* =========================
       PLAY CARD
    ========================= */

    async function playCard(
        suit,
        rank,
        element
    ) {

        if (!currentState) {
            return;
        }


        if (
            currentState.phase !==
            "playing"
        ) {
            return;
        }


        if (
            Number(
                currentState.current_player_id
            ) !==
            Number(
                currentState.viewer_id
            )
        ) {

            showMessage(
                "الان نوبت شما نیست."
            );

            return;
        }


        element.classList.add(
            "selected"
        );


        try {

            await api(
                `/api/game/${gameId}/play`,
                {
                    method:
                        "POST",

                    body:
                        JSON.stringify(
                            {
                                suit:
                                    suit,

                                rank:
                                    rank
                            }
                        )
                }
            );


            await loadGame();

        }
        catch (error) {

            element.classList.remove(
                "selected"
            );

            showMessage(
                error.message
            );
        }
    }


    /* =========================
       AUTO REFRESH
    ========================= */

    loadGame();


    setInterval(
        () => {

            loadGame();

        },
        1800
    );

</script>
