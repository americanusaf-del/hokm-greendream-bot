<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
>

<title>حکم گرین‌دریم</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap');

:root{
    --gold:#d8bd61;
    --gold2:#a8892e;
    --green:#075b43;
    --green2:#063b2f;
    --dark:#061512;
    --panel:#0d211c;
    --text:#f3f1df;
    --muted:#9caea8;
    --red:#d83d42;
}

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    min-height:100%;
    overflow:hidden;
    background:#06110e;
    font-family:"Vazirmatn",Tahoma,Arial,sans-serif;
}

body{
    color:var(--text);
    overscroll-behavior:none;
}

button{
    font-family:inherit;
}

.page{
    width:100%;
    height:100dvh;
    min-height:100dvh;
    max-height:100dvh;
    overflow:hidden;

    display:flex;
    flex-direction:column;

    padding:
        max(4px, env(safe-area-inset-top))
        8px
        max(4px, env(safe-area-inset-bottom));

    background:
        radial-gradient(circle at 50% 0%, #15362c 0%, #071612 42%, #030b09 100%);
}

/* ---------------- HEADER ---------------- */

.game-head{
    height:54px;
    min-height:54px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 8px;
}

.brand{
    text-align:center;
    flex:1;
}

.brand h1{
    margin:0;
    font-size:21px;
    font-weight:900;
    letter-spacing:-.8px;
    color:#f3ead0;

    text-shadow:
        0 2px 10px rgba(0,0,0,.7);
}

.brand p{
    margin:0;
    margin-top:-2px;
    font-size:9px;
    color:#8c9c95;
}

.head-btn{
    width:42px;
    height:42px;
    border-radius:50%;

    border:1px solid rgba(214,187,91,.55);
    background:rgba(10,28,23,.85);

    color:#d8c57d;
    font-size:20px;

    display:flex;
    align-items:center;
    justify-content:center;
}

/* ---------------- SCORE ---------------- */

.score-row{
    height:43px;
    min-height:43px;

    display:grid;
    grid-template-columns:1fr 70px 1fr;
    gap:7px;

    margin:0 5px 6px;
}

.score-box{
    border:1px solid rgba(255,255,255,.07);
    border-radius:18px;

    background:
        linear-gradient(
            180deg,
            rgba(26,48,42,.9),
            rgba(8,25,20,.9)
        );

    box-shadow:
        inset 0 1px 0 rgba(255,255,255,.04),
        0 5px 12px rgba(0,0,0,.22);

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 13px;
}

.score-box span{
    font-size:11px;
    color:#d5d6ca;
}

.score-box strong{
    color:#e9cb61;
    font-size:18px;
}

.score-center{
    border-radius:18px;

    display:flex;
    align-items:center;
    justify-content:center;

    background:rgba(255,255,255,.035);
    border:1px solid rgba(255,255,255,.05);

    color:#a8b1ac;
    font-size:10px;
}

/* ---------------- TABLE ---------------- */

.table{
    position:relative;

    flex:1;
    min-height:0;

    margin:0 1px;

    border-radius:34px;

    border:6px solid #b99838;

    background:
        radial-gradient(
            ellipse at center,
            #0b8c62 0%,
            #087653 30%,
            #075b43 62%,
            #043d2f 100%
        );

    box-shadow:
        0 0 0 3px #55491f,
        0 0 0 6px #d4b64d,
        inset 0 0 0 2px rgba(255,255,255,.12),
        inset 0 0 60px rgba(0,0,0,.3),
        0 14px 35px rgba(0,0,0,.5);

    overflow:hidden;
}

.table::before{
    content:"";
    position:absolute;
    inset:15px;

    border-radius:26px;

    border:1px solid rgba(222,196,100,.18);

    pointer-events:none;
}

.table::after{
    content:"";
    position:absolute;
    width:65%;
    height:45%;

    left:17.5%;
    top:27%;

    background:radial-gradient(
        ellipse,
        rgba(91,232,172,.08),
        transparent 70%
    );

    pointer-events:none;
}

/* ---------------- TOP INFO ---------------- */

.table-top{
    position:absolute;
    top:12px;
    left:14px;
    right:14px;

    display:flex;
    justify-content:space-between;
    align-items:center;

    z-index:20;
}

.status-pill{
    padding:8px 13px;

    border-radius:20px;

    background:rgba(3,30,23,.78);
    border:1px solid rgba(255,255,255,.05);

    color:#d7ded8;
    font-size:10px;

    box-shadow:0 5px 12px rgba(0,0,0,.18);
}

.hokm-pill{
    min-width:105px;
    text-align:center;

    padding:8px 13px;

    border-radius:20px;

    background:rgba(3,30,23,.78);
    border:1px solid rgba(255,255,255,.05);

    color:#e7d28b;
    font-size:11px;

    box-shadow:0 5px 12px rgba(0,0,0,.18);
}

/* ---------------- PLAYERS ---------------- */

.seat{
    position:absolute;
    z-index:15;

    display:flex;
    flex-direction:column;
    align-items:center;

    min-width:78px;
}

.seat.top{
    top:48px;
    left:50%;
    transform:translateX(-50%);
}

.seat.left{
    left:7px;
    top:50%;
    transform:translateY(-50%);
}

.seat.right{
    right:7px;
    top:50%;
    transform:translateY(-50%);
}

.avatar{
    width:62px;
    height:62px;

    border-radius:50%;

    border:3px solid rgba(205,224,211,.45);

    background:
        radial-gradient(circle at 35% 25%,
            #7cae99,
            #346c5a 55%,
            #183e34 100%
        );

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:23px;
    font-weight:800;

    color:#e8eee9;

    box-shadow:
        0 4px 10px rgba(0,0,0,.35),
        inset 0 0 12px rgba(255,255,255,.08);
}

.player-name{
    margin-top:6px;

    max-width:115px;

    padding:5px 10px;

    border-radius:14px;

    background:rgba(2,33,25,.72);

    color:#d8dfd9;

    font-size:10px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;

    text-align:center;
}

.player-meta{
    margin-top:2px;

    color:rgba(226,234,228,.62);
    font-size:8px;
}

/* ---------------- CENTER ---------------- */

.ahuramehr{
    position:absolute;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    z-index:5;

    text-align:center;

    pointer-events:none;

    width:100%;
}

.ahuramehr-title{
    font-family:
        "Vazirmatn",
        "B Titr",
        "Tahoma",
        sans-serif;

    font-size:clamp(24px,7vw,38px);

    font-weight:900;

    letter-spacing:-1.5px;

    color:#e6cf77;

    text-shadow:
        0 2px 0 #715d24,
        0 4px 10px rgba(0,0,0,.55),
        0 0 22px rgba(220,190,86,.22);
}

.ahuramehr-line{
    width:75px;
    height:2px;

    margin:7px auto 0;

    background:
        linear-gradient(
            90deg,
            transparent,
            #d6bd68,
            transparent
        );

    opacity:.75;
}

.ahuramehr-sub{
    margin-top:5px;

    font-size:8px;

    color:rgba(235,227,193,.52);

    letter-spacing:1px;
}

/* ---------------- TRICK ---------------- */

.center{
    position:absolute;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    width:145px;
    height:145px;

    z-index:10;

    pointer-events:none;
}

.center-label{
    position:absolute;

    top:0;
    left:50%;

    transform:translateX(-50%);

    font-size:9px;
    color:rgba(236,239,227,.48);

    white-space:nowrap;
}

.played{
    position:absolute;

    width:55px;
    height:76px;

    border-radius:8px;

    background:#f8f5e9;

    border:1px solid rgba(0,0,0,.22);

    box-shadow:0 5px 10px rgba(0,0,0,.35);

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:25px;

    color:#1b2924;
}

.played.p1{
    top:22px;
    left:45px;
}

.played.p2{
    top:45px;
    right:2px;
}

.played.p3{
    bottom:0;
    left:45px;
}

.played.p4{
    top:45px;
    left:2px;
}

.played.red{
    color:#c52f35;
}

/* ---------------- TIMER ---------------- */

.timer{
    position:absolute;

    left:14px;
    bottom:14px;

    padding:7px 13px;

    border-radius:18px;

    background:rgba(2,32,25,.82);

    color:#e0ca72;

    font-size:9px;

    z-index:25;
}

/* ---------------- MY PLAYER ---------------- */

.my-strip{
    position:absolute;

    left:50%;
    bottom:112px;

    transform:translateX(-50%);

    z-index:40;

    display:flex;
    align-items:center;
    gap:7px;

    padding:5px 11px;

    border-radius:18px;

    background:rgba(2,30,23,.83);

    border:1px solid rgba(220,195,102,.16);

    white-space:nowrap;
}

.my-avatar{
    width:28px;
    height:28px;

    border-radius:50%;

    background:#5f8d7c;

    border:1px solid rgba(255,255,255,.25);

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:11px;
    font-weight:800;
}

.my-name{
    font-size:10px;
    color:#e7e5d4;
}

/* ---------------- HAND ---------------- */

.hand-wrap{
    position:absolute;

    left:5px;
    right:5px;
    bottom:5px;

    height:92px;

    z-index:50;

    overflow:visible;

    pointer-events:none;
}

.hand{
    position:absolute;

    left:50%;
    bottom:0;

    transform:translateX(-50%);

    height:92px;

    width:100%;

    display:flex;
    justify-content:center;
    align-items:flex-end;

    pointer-events:none;
}

.card{
    position:relative;

    flex:0 0 clamp(34px,9.7vw,46px);

    width:clamp(34px,9.7vw,46px);

    height:clamp(64px,18.8vw,82px);

    margin-left:clamp(-13px,-2.8vw,-7px);

    border-radius:8px;

    background:
        linear-gradient(
            145deg,
            #fffefa,
            #eeeade
        );

    border:1px solid rgba(0,0,0,.25);

    box-shadow:
        0 5px 8px rgba(0,0,0,.32),
        inset 0 0 0 1px rgba(255,255,255,.7);

    color:#202a26;

    display:flex;
    align-items:center;
    justify-content:center;

    pointer-events:auto;

    cursor:pointer;

    transition:
        transform .15s ease,
        filter .15s ease;
}

.card:first-child{
    margin-left:0;
}

.card.red{
    color:#c82f38;
}

.card.disabled{
    filter:brightness(.52) saturate(.5);
    cursor:default;
}

.card:not(.disabled):active{
    transform:translateY(-12px) scale(1.03) !important;
}

.card-rank{
    position:absolute;

    top:4px;
    right:5px;

    font-size:11px;
    font-weight:800;

    line-height:1;
}

.card-suit{
    font-size:24px;

    transform:translateY(2px);
}

.card-bottom{
    position:absolute;

    bottom:4px;
    left:5px;

    font-size:9px;

    transform:rotate(180deg);
}

.card:nth-child(1){transform:rotate(-10deg) translateY(3px);}
.card:nth-child(2){transform:rotate(-8deg) translateY(1px);}
.card:nth-child(3){transform:rotate(-6deg) translateY(-1px);}
.card:nth-child(4){transform:rotate(-4deg);}
.card:nth-child(5){transform:rotate(-2deg);}
.card:nth-child(6){transform:rotate(-1deg);}
.card:nth-child(7){transform:rotate(0deg) translateY(-2px);}
.card:nth-child(8){transform:rotate(1deg);}
.card:nth-child(9){transform:rotate(2deg);}
.card:nth-child(10){transform:rotate(4deg);}
.card:nth-child(11){transform:rotate(6deg) translateY(-1px);}
.card:nth-child(12){transform:rotate(8deg) translateY(1px);}
.card:nth-child(13){transform:rotate(10deg) translateY(3px);}

/* ---------------- CONTROLS ---------------- */

.controls{
    position:absolute;

    left:50%;
    bottom:103px;

    transform:translateX(-50%);

    z-index:60;

    display:flex;
    align-items:center;
    justify-content:center;

    gap:6px;
}

.control-btn{
    border:none;

    min-width:118px;
    height:36px;

    padding:0 15px;

    border-radius:19px;

    background:
        linear-gradient(
            180deg,
            #d7bd62,
            #9d812c
        );

    color:#fffce9;

    font-size:11px;
    font-weight:800;

    box-shadow:
        0 5px 13px rgba(0,0,0,.3),
        inset 0 1px 0 rgba(255,255,255,.3);

    cursor:pointer;
}

.control-btn:active{
    transform:translateY(1px);
}

.control-btn.secondary{
    background:rgba(3,31,24,.85);
    border:1px solid rgba(214,188,94,.3);
    color:#ddcc8b;
}

#refreshBtn{
    min-width:auto;
    width:42px;
    padding:0;
    display:none;
}

/* ---------------- MODAL ---------------- */

.modal{
    position:fixed;

    inset:0;

    z-index:200;

    display:none;

    align-items:center;
    justify-content:center;

    padding:20px;

    background:rgba(0,0,0,.68);

    backdrop-filter:blur(5px);
}

.modal.show{
    display:flex;
}

.modal-box{
    width:min(330px,90vw);

    padding:22px;

    border-radius:24px;

    background:
        linear-gradient(
            180deg,
            #102c24,
            #071a15
        );

    border:1px solid rgba(214,188,95,.4);

    box-shadow:
        0 20px 50px rgba(0,0,0,.55);
}

.modal-title{
    text-align:center;

    font-size:17px;
    font-weight:800;

    color:#e5d287;

    margin-bottom:18px;
}

.suits{
    display:grid;
    grid-template-columns:1fr 1fr;

    gap:9px;
}

.suit-btn{
    height:58px;

    border-radius:16px;

    border:1px solid rgba(255,255,255,.07);

    background:rgba(255,255,255,.045);

    font-size:26px;

    cursor:pointer;
}

.suit-btn.red{
    color:#ed4c52;
}

.suit-btn.black{
    color:#eee;
}

/* ---------------- MESSAGE ---------------- */

.message{
    position:fixed;

    left:50%;
    bottom:22px;

    transform:translate(-50%,20px);

    z-index:300;

    max-width:90vw;

    padding:10px 17px;

    border-radius:20px;

    background:rgba(8,24,20,.96);

    border:1px solid rgba(214,188,95,.3);

    color:#eee9d7;

    font-size:11px;

    opacity:0;

    pointer-events:none;

    transition:.2s ease;
}

.message.show{
    opacity:1;
    transform:translate(-50%,0);
}

/* ---------------- SMALL SCREENS ---------------- */

@media(max-height:700px){

    .game-head{
        height:48px;
        min-height:48px;
    }

    .brand h1{
        font-size:19px;
    }

    .score-row{
        height:38px;
        min-height:38px;
        margin-bottom:5px;
    }

    .table{
        border-width:5px;
        border-radius:29px;
    }

    .seat.top{
        top:43px;
    }

    .avatar{
        width:54px;
        height:54px;
    }

    .player-name{
        margin-top:4px;
        padding:4px 8px;
    }

    .ahuramehr-title{
        font-size:26px;
    }

    .my-strip{
        bottom:101px;
    }

    .controls{
        bottom:92px;
    }

    .hand-wrap{
        height:83px;
    }

    .hand{
        height:83px;
    }

    .card{
        height:clamp(58px,17.5vw,74px);
    }
}

@media(max-width:380px){

    .game-head{
        height:45px;
        min-height:45px;
    }

    .score-row{
        grid-template-columns:1fr 58px 1fr;
    }

    .score-box{
        padding:0 9px;
    }

    .table-top{
        top:8px;
        left:9px;
        right:9px;
    }

    .status-pill,
    .hokm-pill{
        padding:6px 9px;
        font-size:8px;
    }

    .seat.left{
        left:2px;
    }

    .seat.right{
        right:2px;
    }

    .avatar{
        width:48px;
        height:48px;
    }

    .player-name{
        max-width:85px;
        font-size:8px;
    }

    .ahuramehr-title{
        font-size:23px;
    }

    .my-strip{
        bottom:92px;
    }

    .controls{
        bottom:84px;
    }

    .control-btn{
        min-width:105px;
        height:33px;
        font-size:10px;
    }

    .hand-wrap{
        height:76px;
    }

    .hand{
        height:76px;
    }

    .card{
        flex-basis:34px;
        width:34px;
        height:58px;
        margin-left:-8px;
    }

    .card-rank{
        font-size:9px;
    }

    .card-suit{
        font-size:19px;
    }
}
</style>
</head>

<body>

<div class="page">

    <header class="game-head">

        <button class="head-btn" id="menuBtn">
            •••
        </button>

        <div class="brand">
            <h1>حکم گرین‌دریم</h1>
            <p>میز بازی آنلاین</p>
        </div>

        <button class="head-btn" id="closeBtn">
            ×
        </button>

    </header>

    <div class="score-row">

        <div class="score-box">
            <span id="team2Name">حریف</span>
            <strong id="score2">0</strong>
        </div>

        <div class="score-center">
            <span>امتیاز</span>
        </div>

        <div class="score-box">
            <span>ما</span>
            <strong id="score1">0</strong>
        </div>

    </div>

    <section class="table">

        <div class="table-top">

            <div class="status-pill" id="turnText">
                منتظر شروع بازی
            </div>

            <div class="hokm-pill" id="hokmText">
                حکم: —
            </div>

        </div>

        <div id="seatTop" class="seat top">

            <div class="avatar">•</div>

            <div class="player-name">
                صندلی خالی
            </div>

            <div class="player-meta">
                منتظر بازیکن
            </div>

        </div>

        <div id="seatLeft" class="seat left">

            <div class="avatar">•</div>

            <div class="player-name">
                صندلی خالی
            </div>

            <div class="player-meta">
                منتظر بازیکن
            </div>

        </div>

        <div id="seatRight" class="seat right">

            <div class="avatar">•</div>

            <div class="player-name">
                صندلی خالی
            </div>

            <div class="player-meta">
                منتظر بازیکن
            </div>

        </div>

        <div class="ahuramehr">

            <div class="ahuramehr-title">
                اهورامهر
            </div>

            <div class="ahuramehr-line"></div>

            <div class="ahuramehr-sub">
                حکم گرین‌دریم
            </div>

        </div>

        <div class="center" id="trick">

            <div class="center-label">
                کارت‌های بازی‌شده
            </div>

        </div>

        <div class="timer" id="timer">
            زمان نوبت: ۳۰
        </div>

        <div class="my-strip">

            <div class="my-avatar" id="myAvatar">
                A
            </div>

            <div class="my-name" id="myName">
                بازیکن
            </div>

        </div>

        <div class="controls" id="controls">

            <button
                id="startBtn"
                class="control-btn"
                onclick="startGame()"
                style="display:none"
            >
                شروع بازی
            </button>

            <button
                id="refreshBtn"
                class="control-btn secondary"
                onclick="loadGame()"
                title="به‌روزرسانی"
            >
                ↻
            </button>

        </div>

        <div class="hand-wrap">

            <div id="hand" class="hand"></div>

        </div>

    </section>

</div>


<div id="hokmModal" class="modal">

    <div class="modal-box">

        <div class="modal-title">
            حکم را انتخاب کن
        </div>

        <div class="suits">

            <button
                class="suit-btn red"
                onclick="chooseHokm('♥')"
            >
                ♥
            </button>

            <button
                class="suit-btn red"
                onclick="chooseHokm('♦')"
            >
                ♦
            </button>

            <button
                class="suit-btn black"
                onclick="chooseHokm('♣')"
            >
                ♣
            </button>

            <button
                class="suit-btn black"
                onclick="chooseHokm('♠')"
            >
                ♠
            </button>

        </div>

    </div>

</div>


<div id="message" class="message"></div>


<script>

/* =========================================================
   TELEGRAM
========================================================= */

const tg =
    window.Telegram &&
    window.Telegram.WebApp
        ? window.Telegram.WebApp
        : null;

if(tg){

    tg.ready();

    tg.expand();

    try{
        tg.disableVerticalSwipes();
    }catch(e){}

}


/* =========================================================
   GAME ID
========================================================= */

const params =
    new URLSearchParams(
        window.location.search
    );


/*
   تلگرام وقتی از Main Mini App با
   ?startapp=... باز می‌شود، شناسه را
   معمولاً در این دو جا در اختیار Mini App
   قرار می‌دهد:

   1. tg.initDataUnsafe.start_param
   2. tgWebAppStartParam در URL

   همچنین روش‌های قبلی خودمان را حفظ می‌کنیم.
*/

const telegramStartParam =
    tg &&
    tg.initDataUnsafe
        ? tg.initDataUnsafe.start_param
        : null;


const gameId =
    telegramStartParam ||
    params.get("tgWebAppStartParam") ||
    params.get("startapp") ||
    params.get("game") ||
    params.get("game_id") ||
    null;


/* برای تست در console */

console.log(
    "Hokm game id:",
    gameId
);


let currentState = null;

let messageTimer = null;


/* =========================================================
   VIEWER
========================================================= */

function viewerId(state){

    if(!state){
        return null;
    }

    return (
        state.viewer_id ??
        state.user_id ??
        state.viewer_player_id ??
        state.user_player_id ??
        null
    );
}


function findViewerPlayer(state){

    const id =
        viewerId(state);

    if(
        id === null ||
        id === undefined
    ){
        return null;
    }

    const players =
        state.players || [];

    return players.find(
        player =>
            String(player.id) ===
            String(id)
    ) || null;
}


/* =========================================================
   API
========================================================= */

function headers(){

    const h = {
        "Content-Type":
            "application/json"
    };

    if(
        tg &&
        tg.initData
    ){

        h[
            "X-Telegram-Init-Data"
        ] =
            tg.initData;
    }

    return h;
}


async function api(
    url,
    options={}
){

    const response =
        await fetch(
            url,
            {
                ...options,

                headers:{
                    ...headers(),
                    ...(options.headers || {})
                }
            }
        );


    let data = null;

    try{

        data =
            await response.json();

    }catch(e){

        data = {};
    }


    if(!response.ok){

        throw new Error(
            data.detail ||
            data.error ||
            data.message ||
            "خطا در ارتباط با سرور"
        );
    }


    return data;
}


/* =========================================================
   MESSAGE
========================================================= */

function showMessage(text){

    const el =
        document.getElementById(
            "message"
        );

    el.textContent =
        text;

    el.classList.add(
        "show"
    );

    clearTimeout(
        messageTimer
    );

    messageTimer =
        setTimeout(
            ()=>{
                el.classList.remove(
                    "show"
                );
            },
            2600
        );
}


/* =========================================================
   HELPERS
========================================================= */

function escapeHtml(value){

    return String(
        value ?? ""
    )
        .replaceAll(
            "&",
            "&amp;"
        )
        .replaceAll(
            "<",
            "&lt;"
        )
        .replaceAll(
            ">",
            "&gt;"
        )
        .replaceAll(
            '"',
            "&quot;"
        )
        .replaceAll(
            "'",
            "&#039;"
        );
}


function cardIsRed(suit){

    return (
        suit === "♥" ||
        suit === "♦"
    );
}


function initials(name){

    const text =
        String(
            name || "A"
        ).trim();

    if(!text){
        return "A";
    }

    return text
        .split(/\s+/)
        .slice(0,2)
        .map(
            x => x[0]
        )
        .join("")
        .toUpperCase();
}


function getPlayers(state){

    return (
        state.players ||
        state.game?.players ||
        []
    );
}


/* =========================================================
   SCORE
========================================================= */

function setScoreUI(state){

    const score1 =
        state.team_a_score ??
        state.score_us ??
        state.team1_score ??
        state.score1 ??
        0;


    const score2 =
        state.team_b_score ??
        state.score_them ??
        state.team2_score ??
        state.score2 ??
        0;


    document
        .getElementById("score1")
        .textContent =
            score1;


    document
        .getElementById("score2")
        .textContent =
            score2;
}


/* =========================================================
   LOAD GAME
========================================================= */

async function loadGame(){

    if(!gameId){

        showMessage(
            "شناسه بازی پیدا نشد"
        );

        console.error(
            "No game id found",
            {
                url:
                    window.location.href,

                search:
                    window.location.search,

                startParam:
                    telegramStartParam,

                initDataUnsafe:
                    tg
                        ? tg.initDataUnsafe
                        : null
            }
        );

        return;
    }


    try{

        const state =
            await api(
                `/api/game/${encodeURIComponent(gameId)}`
            );


        currentState =
            state;


        render(
            state
        );


    }catch(error){

        console.error(
            error
        );

        showMessage(
            error.message ||
            "خطا در دریافت بازی"
        );
    }
}


/* =========================================================
   RENDER
========================================================= */

function render(state){

    if(!state){
        return;
    }


    setScoreUI(
        state
    );


    renderSeats(
        state
    );


    renderTrick(
        state
    );


    renderHand(
        state
    );


    const hokm =
        state.hokm ||
        state.trump ||
        null;


    document
        .getElementById(
            "hokmText"
        )
        .textContent =
            `حکم: ${
                hokm || "—"
            }`;


    const turnEl =
        document.getElementById(
            "turnText"
        );


    const phase =
        state.phase ||
        "waiting";


    const myId =
        viewerId(
            state
        );


    if(
        phase === "waiting"
    ){

        turnEl.textContent =
            "منتظر شروع بازی";


    }else if(
        phase === "choose_hokm"
    ){

        if(
            state.hakim_id &&
            myId &&
            String(
                state.hakim_id
            ) ===
            String(myId)
        ){

            turnEl.textContent =
                "👑 شما حاکم هستید؛ حکم را انتخاب کنید";

        }else{

            turnEl.textContent =
                "انتظار برای انتخاب حکم";
        }


    }else if(
        phase === "playing"
    ){

        const currentId =
            state.current_player_id;


        if(
            currentId &&
            myId &&
            String(currentId) ===
            String(myId)
        ){

            turnEl.textContent =
                "🎯 نوبت شما";

        }else{

            turnEl.textContent =
                state.current_player_name
                    ? `نوبت: ${state.current_player_name}`
                    : "🎯 نوبت بازیکن مقابل";
        }


    }else if(
        phase === "finished"
    ){

        turnEl.textContent =
            "🏆 بازی تمام شد";


    }else{

        turnEl.textContent =
            phase;
    }


    /* بازیکن خودمان */

    const me =
        findViewerPlayer(
            state
        );


    if(me){

        const name =
            me.name ||
            "بازیکن";


        document
            .getElementById(
                "myName"
            )
            .textContent =
                name;


        document
            .getElementById(
                "myAvatar"
            )
            .textContent =
                initials(
                    name
                );
    }


    updateStartButton(
        state
    );


    /* مودال حکم */

    const modal =
        document.getElementById(
            "hokmModal"
        );


    const isHakim =
        Boolean(
            state.hakim_id &&
            myId &&
            String(
                state.hakim_id
            ) ===
            String(myId)
        );


    if(
        phase === "choose_hokm" &&
        isHakim
    ){

        modal.classList.add(
            "show"
        );

    }else{

        modal.classList.remove(
            "show"
        );
    }
}


/* =========================================================
   START BUTTON
========================================================= */

function updateStartButton(
    state
){

    const btn =
        document.getElementById(
            "startBtn"
        );


    const refresh =
        document.getElementById(
            "refreshBtn"
        );


    const phase =
        state.phase ||
        "waiting";


    const myId =
        viewerId(
            state
        );


    const creatorId =
        state.creator_id;


    const amCreator =
        Boolean(
            creatorId &&
            myId &&
            String(
                creatorId
            ) ===
            String(myId)
        );


    if(
        phase === "waiting" &&
        amCreator
    ){

        btn.style.display =
            "block";

        refresh.style.display =
            "none";

    }else{

        btn.style.display =
            "none";

        refresh.style.display =
            "block";
    }
}


/* =========================================================
   SEATS
========================================================= */

function updateSeat(
    seatId,
    player
){

    const seat =
        document.getElementById(
            seatId
        );


    if(!seat){
        return;
    }


    const avatar =
        seat.querySelector(
            ".avatar"
        );


    const name =
        seat.querySelector(
            ".player-name"
        );


    const meta =
        seat.querySelector(
            ".player-meta"
        );


    if(!player){

        avatar.textContent =
            "•";

        name.textContent =
            "صندلی خالی";

        meta.textContent =
            "منتظر بازیکن";

        seat.classList.remove(
            "hakim",
            "turn"
        );

        return;
    }


    const playerName =
        player.name ||
        "بازیکن";


    avatar.textContent =
        initials(
            playerName
        );


    name.innerHTML =
        escapeHtml(
            playerName
        ) +
        (
            player.is_hakim
                ? " 👑"
                : ""
        );


    if(
        player.is_hakim
    ){

        meta.textContent =
            "حاکم";

    }else if(
        player.is_turn
    ){

        meta.textContent =
            "🎯 نوبت";

    }else{

        meta.textContent =
            `🎴 ${player.card_count ?? 0} کارت`;
    }


    seat.classList.toggle(
        "hakim",
        Boolean(
            player.is_hakim
        )
    );


    seat.classList.toggle(
        "turn",
        Boolean(
            player.is_turn
        )
    );
}


function renderSeats(
    state
){

    const players =
        getPlayers(
            state
        );


    const myId =
        viewerId(
            state
        );


    const others =
        players.filter(
            player =>
                String(
                    player.id
                ) !==
                String(
                    myId
                )
        );


    /*
      فعلاً سه صندلی اطراف میز
      از بین بازیکنان مقابل پر می‌شوند.
    */

    updateSeat(
        "seatTop",
        others[0] || null
    );


    updateSeat(
        "seatLeft",
        others[1] || null
    );


    updateSeat(
        "seatRight",
        others[2] || null
    );
}


/* =========================================================
   TRICK
========================================================= */

function renderTrick(
    state
){

    const trick =
        document.getElementById(
            "trick"
        );


    trick.innerHTML =
        `
        <div class="center-label">
            کارت‌های بازی‌شده
        </div>
        `;


    const cards =
        state.current_trick ||
        [];


    cards.forEach(
        (
            item,
            index
        )=>{

            const cardData =
                item.card ||
                item;


            const suit =
                cardData.suit ||
                "";


            const rank =
                cardData.label ||
                cardData.rank ||
                "";


            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "played " +
                (
                    cardIsRed(
                        suit
                    )
                        ? "red"
                        : ""
                ) +
                " p" +
                (
                    index + 1
                );


            card.textContent =
                `${rank}${suit}`;


            trick.appendChild(
                card
            );
        }
    );
}


/* =========================================================
   HAND
========================================================= */

function renderHand(
    state
){

    const hand =
        document.getElementById(
            "hand"
        );


    hand.innerHTML =
        "";


    /*
      بازیکن خودمان را مستقیماً
      از viewer_id پیدا می‌کنیم.
    */

    const me =
        findViewerPlayer(
            state
        );


    if(!me){

        return;
    }


    const cards =
        me.cards ||
        [];


    const phase =
        state.phase ||
        "waiting";


    const currentPlayerId =
        state.current_player_id;


    const myId =
        viewerId(
            state
        );


    const myTurn =
        phase === "playing" &&
        currentPlayerId &&
        myId &&
        String(
            currentPlayerId
        ) ===
        String(
            myId
        );


    const trick =
        state.current_trick ||
        [];


    const firstCard =
        trick.length
            ? (
                trick[0].card ||
                trick[0]
            )
            : null;


    const leadSuit =
        firstCard
            ? firstCard.suit
            : null;


    const hasLeadSuit =
        leadSuit
            ? cards.some(
                card =>
                    card.suit ===
                    leadSuit
            )
            : false;


    cards.forEach(
        card => {

            const suit =
                card.suit;


            const rank =
                card.rank;


            let legal =
                Boolean(
                    myTurn
                );


            /*
              قانون پیروی از خال:
              اگر خال لید را داریم،
              باید همان خال را بازی کنیم.
            */

            if(
                legal &&
                leadSuit &&
                hasLeadSuit &&
                suit !== leadSuit
            ){

                legal =
                    false;
            }


            const el =
                document.createElement(
                    "div"
                );


            el.className =
                "card " +
                (
                    cardIsRed(
                        suit
                    )
                        ? "red"
                        : ""
                ) +
                (
                    legal
                        ? ""
                        : " disabled"
                );


            const label =
                card.label ||
                rank;


            el.innerHTML =
                `
                <div class="card-rank">
                    ${escapeHtml(label)}
                </div>

                <div class="card-suit">
                    ${escapeHtml(suit)}
                </div>

                <div class="card-bottom">
                    ${escapeHtml(label)}
                </div>
                `;


            if(legal){

                el.addEventListener(
                    "click",
                    ()=>{
                        playCard(
                            suit,
                            rank,
                            el
                        );
                    }
                );
            }


            hand.appendChild(
                el
            );
        }
    );
}


/* =========================================================
   START GAME
========================================================= */

async function startGame(){

    if(!gameId){

        showMessage(
            "شناسه بازی پیدا نشد"
        );

        return;
    }


    const btn =
        document.getElementById(
            "startBtn"
        );


    btn.disabled =
        true;


    btn.textContent =
        "در حال شروع...";


    try{

        await api(
            `/api/game/${encodeURIComponent(gameId)}/start`,
            {
                method:"POST"
            }
        );


        await loadGame();


        showMessage(
            "بازی شروع شد"
        );


    }catch(error){

        console.error(
            error
        );


        showMessage(
            error.message ||
            "شروع بازی انجام نشد"
        );


        btn.disabled =
            false;


        btn.textContent =
            "شروع بازی";
    }
}


/* =========================================================
   CHOOSE HOKM
========================================================= */

async function chooseHokm(
    suit
){

    if(!gameId){
        return;
    }


    try{

        await api(
            `/api/game/${encodeURIComponent(gameId)}/hokm`,
            {
                method:"POST",

                body:
                    JSON.stringify({
                        suit:suit
                    })
            }
        );


        document
            .getElementById(
                "hokmModal"
            )
            .classList.remove(
                "show"
            );


        await loadGame();


        showMessage(
            `حکم ${suit} انتخاب شد`
        );


    }catch(error){

        console.error(
            error
        );


        showMessage(
            error.message ||
            "انتخاب حکم انجام نشد"
        );
    }
}


/* =========================================================
   PLAY CARD
========================================================= */

async function playCard(
    suit,
    rank,
    element
){

    if(
        !currentState ||
        currentState.phase !==
        "playing"
    ){

        return;
    }


    element.style.pointerEvents =
        "none";


    element.style.transform =
        "translateY(-14px)";


    try{

        await api(
            `/api/game/${encodeURIComponent(gameId)}/play`,
            {
                method:"POST",

                body:
                    JSON.stringify({
                        suit:suit,
                        rank:rank
                    })
            }
        );


        await loadGame();


    }catch(error){

        console.error(
            error
        );


        element.style.pointerEvents =
            "auto";


        element.style.transform =
            "";


        showMessage(
            error.message ||
            "بازی کارت انجام نشد"
        );
    }
}


/* =========================================================
   CLOSE
========================================================= */

document
    .getElementById(
        "closeBtn"
    )
    .addEventListener(
        "click",
        ()=>{
            if(tg){

                try{
                    tg.close();
                }catch(e){}

            }
        }
    );


/* =========================================================
   INITIAL LOAD
========================================================= */

loadGame();


/* =========================================================
   AUTO REFRESH
========================================================= */

setInterval(
    loadGame,
    1800
);

</script>
